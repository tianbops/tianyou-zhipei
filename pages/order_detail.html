<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日运单详情</title>
  <link rel="stylesheet" href="../css/order.css">
  <style>
    .store-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      gap: 10px;
    }
    .store-item:last-child { border-bottom: none; }
    .store-item .store-index {
      color: #7F8B98;
      font-weight: 500;
      min-width: 28px;
      font-size: 14px;
      flex-shrink: 0;
    }
    .store-item .store-name {
      flex: 1;
      font-size: 15px;
      color: #fff;
      line-height: 1.5;
      word-break: break-word;
      max-height: 3em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .store-item .nav-btn {
      background: #2457A6;
      border: none;
      color: #fff;
      border-radius: 10px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .store-item .nav-btn:active { transform: scale(0.94); }
    .store-item .nav-btn:hover { background: #2A6BC4; }
    .store-list {
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .store-list::-webkit-scrollbar {
      width: 4px;
    }
    .store-list::-webkit-scrollbar-thumb {
      background: #3A4654;
      border-radius: 10px;
    }
    .empty-tip {
      text-align: center;
      padding: 40px 20px;
      color: #7F8B98;
      font-size: 15px;
    }
    .empty-tip .icon {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <button class="back-btn" onclick="goBack()">←</button>
      <div class="app-title">今日运单详情</div>
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </header>

    <div id="menuPanel" class="menu-panel">
      <div class="menu-line" id="menuRoute">加载中...</div>
      <div onclick="openVehicle()">🚚 更换车辆</div>
      <div onclick="window.location.href='route_edit.html'">⚙ 原始数据</div>
      <div onclick="shareOrder()">↗ 分享运单</div>
      <div onclick="logout()" class="logout-item">🚪 退出登录</div>
    </div>

    <section class="task-card">
      <div class="info-row top-row">
        <div id="routeName">加载中...</div>
        <div id="todayDate"></div>
      </div>
      <div class="info-row">
        <span class="label">今日用车：</span>
        <span class="value" id="vehicleText">渝DK7692</span>
      </div>
      <div class="info-row">
        <span class="label">今日配送：</span>
        <span class="value warning">总 <span id="storeCount">--</span> 家</span>
      </div>
      <div class="info-row">
        <span class="label">商品总量：</span>
        <span class="value" id="totalWeight">--</span>
      </div>
    </section>

    <section class="task-card">
      <div class="route-title">配送路线</div>
      <div class="store-list" id="routeList">
        <div class="empty-tip">
          <span class="icon">📭</span>
          今日暂无配送数据
        </div>
      </div>
    </section>

    <div id="vehicleDialog" class="dialog">
      <div class="dialog-box">
        <h3>更换今日用车</h3>
        <input id="newVehicle" placeholder="请输入车辆号码" value="渝DK7692">
        <div class="dialog-btn">
          <button onclick="closeVehicle()">取消</button>
          <button onclick="saveVehicle()">确认</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script>
    // ============================================================
    // 页面初始化
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      if (!Auth.checkAuth()) return;
      
      const route = Auth.getCurrentRoute();
      document.getElementById("routeName").textContent = route;
      document.getElementById("menuRoute").textContent = route;
      document.getElementById("todayDate").textContent = new Date().toISOString().split('T')[0];
      
      const vehicle = localStorage.getItem("today_vehicle") || "渝DK7692";
      document.getElementById("vehicleText").textContent = vehicle;
      
      loadTodayData(route);
    });

    // ============================================================
    // 从 Upstash 获取今日运单
    // ============================================================
    async function loadTodayData(route) {
      const listEl = document.getElementById("routeList");
      const storeCountEl = document.getElementById("storeCount");
      const totalWeightEl = document.getElementById("totalWeight");

      try {
        const today = new Date().toISOString().split('T')[0];
        const response = await fetch(`/api/history?date=${today}&route=${encodeURIComponent(route)}`);
        if (!response.ok) {
          throw new Error('获取今日运单失败');
        }
        const data = await response.json();
        // data 是一个数组，查找当天的记录
        let todayRecord = null;
        if (Array.isArray(data)) {
          todayRecord = data.find(item => item.date === today);
        }
        if (todayRecord && todayRecord.orders && todayRecord.orders.length > 0) {
          const orders = todayRecord.orders;
          const count = orders.length;
          let totalWeight = 0;
          orders.forEach(order => {
            const weight = parseFloat(order.weight) || 0;
            totalWeight += weight;
          });
          storeCountEl.textContent = count;
          totalWeightEl.textContent = totalWeight.toFixed(1) + ' kg';
          renderRoute(orders);
        } else {
          // 尝试从 localStorage 读取（兼容旧数据）
          const localOrders = getLocalTodayOrders();
          if (localOrders && localOrders.length > 0) {
            const count = localOrders.length;
            let totalWeight = 0;
            localOrders.forEach(order => {
              const weight = parseFloat(order.weight) || 0;
              totalWeight += weight;
            });
            storeCountEl.textContent = count;
            totalWeightEl.textContent = totalWeight.toFixed(1) + ' kg';
            renderRoute(localOrders);
          } else {
            storeCountEl.textContent = '0';
            totalWeightEl.textContent = '无数据';
            listEl.innerHTML = `
              <div class="empty-tip">
                <span class="icon">📭</span>
                今日暂无配送数据
              </div>
            `;
          }
        }
      } catch (error) {
        console.error('加载今日运单失败:', error);
        // 回退到本地
        const localOrders = getLocalTodayOrders();
        if (localOrders && localOrders.length > 0) {
          const count = localOrders.length;
          let totalWeight = 0;
          localOrders.forEach(order => {
            const weight = parseFloat(order.weight) || 0;
            totalWeight += weight;
          });
          storeCountEl.textContent = count;
          totalWeightEl.textContent = totalWeight.toFixed(1) + ' kg';
          renderRoute(localOrders);
        } else {
          storeCountEl.textContent = '0';
          totalWeightEl.textContent = '无数据';
          listEl.innerHTML = `
            <div class="empty-tip">
              <span class="icon">📭</span>
              今日暂无配送数据
            </div>
          `;
        }
      }
    }

    function getLocalTodayOrders() {
      try {
        const data = localStorage.getItem('today_orders');
        return data ? JSON.parse(data) : null;
      } catch { return null; }
    }

    // ============================================================
    // 渲染配送路线
    // ============================================================
    function renderRoute(stores) {
      const box = document.getElementById("routeList");
      if (!box) return;
      box.innerHTML = "";
      
      if (!stores || stores.length === 0) {
        box.innerHTML = `
          <div class="empty-tip">
            <span class="icon">📭</span>
            今日暂无配送数据
          </div>
        `;
        return;
      }
      
      stores.forEach(function(store, index) {
        const seq = index + 1;
        const name = store.name || '未命名门店';
        const nav = store.nav || '';
        
        const div = document.createElement('div');
        div.className = 'store-item';
        div.innerHTML = `
          <span class="store-index">${seq}</span>
          <span class="store-name">${name}</span>
          <button class="nav-btn" data-nav="${nav}">导航</button>
        `;
        const btn = div.querySelector('.nav-btn');
        btn.addEventListener('click', function(e) {
          const navUrl = this.getAttribute('data-nav');
          if (navUrl) {
            window.open(navUrl, '_blank');
          } else {
            alert('该门店暂无导航地址');
          }
        });
        box.appendChild(div);
      });
    }

    // ============================================================
    // 三横菜单
    // ============================================================
    function toggleMenu() {
      const menu = document.getElementById("menuPanel");
      menu.style.display = menu.style.display === "block" ? "none" : "block";
    }
    document.addEventListener("click", function(e) {
      const menu = document.getElementById("menuPanel");
      const btn = document.querySelector(".menu-btn");
      if (menu && !menu.contains(e.target) && !btn?.contains(e.target)) {
        menu.style.display = "none";
      }
    });

    // ============================================================
    // 更换车辆
    // ============================================================
    function openVehicle() {
      document.getElementById("vehicleDialog").style.display = "flex";
      document.getElementById("menuPanel").style.display = "none";
    }
    function closeVehicle() {
      document.getElementById("vehicleDialog").style.display = "none";
    }
    function saveVehicle() {
      const vehicle = document.getElementById("newVehicle").value.trim();
      if (!vehicle) {
        alert("请输入车辆号码");
        return;
      }
      localStorage.setItem("today_vehicle", vehicle);
      document.getElementById("vehicleText").textContent = vehicle;
      closeVehicle();
      Auth.addLog('车辆更换', `更换车辆为: ${vehicle}`);
    }

    // ============================================================
    // 分享
    // ============================================================
    function shareOrder() {
      if (navigator.share) {
        navigator.share({
          title: "天友智配One 今日运单",
          text: `今日配送任务 - ${Auth.getCurrentRoute()}`,
          url: window.location.href
        });
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href).then(() => alert('📋 链接已复制'));
      } else {
        alert('分享功能: 请复制链接分享');
      }
    }

    // ============================================================
    // 返回首页
    // ============================================================
    function goBack() {
      window.location.href = "../home.html";
    }

    // ============================================================
    // 退出登录
    // ============================================================
    function logout() {
      if (confirm("确定退出登录吗？")) {
        Auth.logout();
      }
    }
  </script>
</body>
</html>
