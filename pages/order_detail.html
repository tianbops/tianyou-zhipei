<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>当日运单详情</title>
  <link rel="stylesheet" href="../css/order.css?v=20260922-18">
  <link rel="stylesheet" href="../css/icons.css?v=20260921-1">
</head>
<body class="order-detail-page">
  <div class="app-container">
    <header class="top-bar">
      <button class="back-btn" type="button" onclick="goBack()" aria-label="返回"><svg class="z-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <div class="app-title">当日运单详情</div>
      <button class="menu-btn" onclick="toggleMenu()" aria-label="菜单"><svg class="z-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </header>

    <div id="menuPanel" class="menu-panel">
      <div class="menu-line" id="menuRoute">加载中...</div>
      <div onclick="openVehicle()"><span class="z-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></span>更换车辆</div>
      <div onclick="window.location.href='route_edit.html'"><span class="z-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.5"/></svg></span>线路编辑</div>
      <div onclick="shareOrder()"><span class="z-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/><path d="M5 5v14h14"/></svg></span>分享运单</div>
      <div onclick="logout()" class="logout-item"><span class="z-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M14 16l4-4-4-4M18 12H9"/></svg></span>退出登录</div>
    </div>

    <section class="task-card summary-card">
      <div class="date-title" id="todayDate">加载中...</div>
      <div class="summary-grid">
        <div class="summary-item">
          <span class="label">线路编号</span>
          <span class="value" id="routeName">加载中...</span>
        </div>
        <div class="summary-item">
          <span class="label">当日配送</span>
          <span class="value warning" id="storeCount">0家</span>
        </div>
        <div class="summary-item">
          <span class="label">商品总量</span>
          <span class="value" id="totalWeight">0t</span>
        </div>
      </div>
    </section>

    <section class="task-card route-card">
      <div class="route-title">配送线路</div>
      <div class="store-list" id="routeList">
        <div class="empty-tip"><span class="empty-icon z-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="13" rx="2"/><path d="m7 10 3 3 2-2 5 5"/></svg></span>当日暂无配送数据</div>
      </div>
    </section>
  </div>

  <div id="vehicleDialog" class="dialog">
    <div class="dialog-box">
      <h3>更换当日用车</h3>
      <input id="newVehicle" placeholder="请输入车辆号码" autocomplete="off">
      <div class="dialog-btn">
        <button onclick="closeVehicle()">取消</button>
        <button onclick="saveVehicle()">确认</button>
      </div>
    </div>
  </div>

  <script src="../js/auth.js?v=20260924-6"></script>
  <script src="../js/order_detail.js?v=20260925-3"></script>
</body>
</html>
