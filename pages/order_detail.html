<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>当日运单详情</title>
  <link rel="stylesheet" href="../css/order.css">
</head>
<body class="order-detail-page">
  <div class="app-container">
    <header class="top-bar">
      <button class="back-btn" type="button" onclick="goBack()" aria-label="返回">←</button>
      <div class="app-title">当日运单详情</div>
      <button class="menu-btn" onclick="toggleMenu()" aria-label="菜单">☰</button>
    </header>

    <div id="menuPanel" class="menu-panel">
      <div class="menu-line" id="menuRoute">加载中...</div>
      <div onclick="openVehicle()">🚚 更换车辆</div>
      <div onclick="window.location.href='route_edit.html'">⚙ 线路编辑</div>
      <div onclick="shareOrder()">↗ 分享运单</div>
      <div onclick="logout()" class="logout-item">🚪 退出登录</div>
    </div>

    <section class="task-card summary-card">
      <div class="date-title" id="todayDate">加载中...</div>
      <div class="summary-grid">
        <div class="summary-item">
          <span class="label">路线编号</span>
          <span class="value" id="routeName">加载中...</span>
        </div>
        <div class="summary-item">
          <span class="label">当日配送</span>
          <span class="value warning" id="storeCount">0家</span>
        </div>
        <div class="summary-item">
          <span class="label">商品总量</span>
          <span class="value" id="totalWeight">0t</span>
        </div>
      </div>
    </section>

    <section class="task-card route-card">
      <div class="route-title">配送路线</div>
      <div class="store-list" id="routeList">
        <div class="empty-tip"><span class="icon">📭</span>当日暂无配送数据</div>
      </div>
    </section>
  </div>

  <div id="vehicleDialog" class="dialog">
    <div class="dialog-box">
      <h3>更换当日用车</h3>
      <input id="newVehicle" placeholder="请输入车辆号码" autocomplete="off">
      <div class="dialog-btn">
        <button onclick="closeVehicle()">取消</button>
        <button onclick="saveVehicle()">确认</button>
      </div>
    </div>
  </div>

  <script src="../js/auth.js?v=20260920-7"></script>
  <script src="../js/order_detail.js?v=20260920-2"></script>
</body>
</html>
