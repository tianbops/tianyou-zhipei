<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>原始数据维护</title><link rel="stylesheet" href="../css/route_edit.css"></head>
<body><div class="app-container"><header class="top-bar"><button class="back-btn" id="backBtn">←</button><div class="app-title">原始数据维护</div><div style="width:40px"></div></header><section class="card"><div class="card-title">📋 线路信息</div><div class="info-row"><span class="label">线路名称</span><span class="value" id="routeName">加载中...</span></div><div class="info-row"><span class="label">默认车辆</span><span class="value">渝DK7692</span></div><div class="info-row"><span class="label">客户总数</span><span class="value" id="storeCount">--</span></div></section><section class="card"><div class="card-header"><div class="card-title">🏪 全部客户</div><button class="add-btn" onclick="openAddDialog()">+ 新增</button></div><div class="store-list-scroll" id="storeList"><div style="text-align:center;padding:20px;color:#7F8B98">加载中...</div></div></section><div class="btn-group"><button class="save-btn" onclick="updateDatabase()">📌 更新数据库</button><button class="cancel-btn" id="cancelBtn">取消</button></div><div id="storeDialog" class="dialog"><div class="dialog-box"><h3 id="dialogTitle">编辑客户</h3><div id="singleEditMode"><div class="input-box"><input id="storeCode" placeholder="编号"></div><div class="input-box"><input id="storeName" placeholder="客户名称"></div><div class="input-box"><input id="storeNav" placeholder="导航链接（选填）"></div></div><div id="batchEditMode" style="display:none"><div style="color:#7F8B98;font-size:13px;text-align:center;margin-bottom:12px">每行一条，格式：客户名称 | 导航链接（选填）</div><textarea id="batchInput" class="edit-textarea" rows="7" placeholder="请输入客户数据"></textarea><div class="quick-actions"><button onclick="pasteBatchContent()">📋 粘贴</button><button onclick="clearBatchInput()">🗑️ 清空</button><button onclick="loadBatchExample()">📝 示例</button></div></div><div class="dialog-btn"><button onclick="closeStoreDialog()">取消</button><button onclick="saveStore()" id="saveBtn">保存</button></div></div></div></div><script src="../js/auth.js"></script><script>
let editIndex=-1,stores=[],isDirty=false,isBatchMode=false,currentRoute='';
function getRouteFromURL(){return new URLSearchParams(location.search).get('route')||Auth.getCurrentRoute()||''}function getReturnUrl(){return new URLSearchParams(location.search).get('from')==='admin'?'../admin.html':'../home.html'}
document.addEventListener('DOMContentLoaded',()=>{if(!Auth.checkAuth())return;currentRoute=getRouteFromURL();routeName.textContent=currentRoute;backBtn.onclick=goBack;cancelBtn.onclick=goBack;loadStores(currentRoute)});function goBack(){if(isDirty&&!confirm('有未保存的修改，确定离开吗？'))return;location.href=getReturnUrl()}
async function loadStores(route){try{const r=await fetch(`/api/route/${encodeURIComponent(route)}`,{cache:'no-store'});if(!r.ok)throw new Error(await r.text());const d=await r.json();stores=Array.isArray(d.stores)?d.stores:[];localStorage.setItem('base_data',JSON.stringify(stores));renderStores()}catch(e){const c=Auth.getCachedRouteData(route);stores=c&&Array.isArray(c.stores)?c.stores:[];renderStores();if(!stores.length)showStatus('无法读取服务器基准数据库：'+e.message,'error')}}
function renderStores(){storeCount.textContent=stores.length;storeList.innerHTML=stores.length?stores.map((s,i)=>`<div class="store-row"><div><span style="color:#7F8B98;margin-right:10px">${esc(s.code)}</span>${esc(s.name)}</div><div class="store-actions">${s.nav?`<button onclick="window.open('${escAttr(s.nav)}','_blank')" style="background:#2457A6">导航</button>`:''}<button onclick="editStore(${i})">编辑</button><button onclick="deleteStore(${i})" style="background:#C0392B">删除</button></div></div>`).join(''):'<div style="text-align:center;padding:20px;color:#7F8B98">暂无客户，点击 + 新增</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function escAttr(s){return esc(s).replace(/javascript:/gi,'')}
function openAddDialog(){editIndex=-1;isBatchMode=true;dialogTitle.textContent='新增客户（批量录入）';singleEditMode.style.display='none';batchEditMode.style.display='block';batchInput.value='';saveBtn.textContent='批量导入';storeDialog.style.display='flex'}function editStore(i){editIndex=i;isBatchMode=false;const s=stores[i];dialogTitle.textContent='编辑客户';singleEditMode.style.display='block';batchEditMode.style.display='none';storeCode.value=s.code||'';storeName.value=s.name||'';storeNav.value=s.nav||'';saveBtn.textContent='保存';storeDialog.style.display='flex'}function closeStoreDialog(){storeDialog.style.display='none'}function saveStore(){isBatchMode?saveBatchStores():saveSingleStore()}
function saveSingleStore(){const code=storeCode.value.trim(),name=storeName.value.trim(),nav=storeNav.value.trim();if(!code||!name)return alert('请输入编号和客户名称');stores[editIndex<0?stores.length:editIndex]={code,name,nav};renumber();markDirty();closeStoreDialog();renderStores()}function saveBatchStores(){const lines=batchInput.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),add=[];lines.forEach(line=>{const p=line.split(/[|\t]/).map(x=>x.trim());if(p[0])add.push({code:'',name:p[0],nav:p[1]||''})});if(!add.length)return alert('未能解析有效数据');stores.push(...add);renumber();markDirty();closeStoreDialog();renderStores();alert(`已录入 ${add.length} 条数据，请点击“更新数据库”保存`)}function renumber(){stores.forEach((s,i)=>s.code=String(i+1).padStart(2,'0'))}function markDirty(){isDirty=true;localStorage.setItem('base_data',JSON.stringify(stores));Auth.cacheRouteData(currentRoute,{route:currentRoute,stores})}
function deleteStore(i){if(!confirm('确定删除该客户吗？'))return;stores.splice(i,1);renumber();markDirty();renderStores()}async function updateDatabase(){if(!currentRoute)return alert('未识别线路');if(!stores.length)return alert('没有可保存的基准门店');if(!confirm('确认更新数据库吗？'))return;const btn=document.querySelector('.save-btn');btn.disabled=true;btn.textContent='正在保存...';try{const r=await fetch(`/api/route/${encodeURIComponent(currentRoute)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({stores})});const text=await r.text();let d={};try{d=JSON.parse(text)}catch{}if(!r.ok||d.success===false)throw new Error(d.error||`HTTP ${r.status}`);const v=await fetch(`/api/route/${encodeURIComponent(currentRoute)}`,{cache:'no-store'});if(!v.ok)throw new Error('服务器回读失败');const check=await v.json();if(!Array.isArray(check.stores)||check.stores.length!==stores.length)throw new Error('服务器回读数量不一致');stores=check.stores;localStorage.setItem('base_data',JSON.stringify(stores));Auth.cacheRouteData(currentRoute,{route:currentRoute,stores});isDirty=false;Auth.addLog('数据库更新',`${currentRoute} 基准数据库已更新（${stores.length}条）`);alert(`✅ 基准数据库更新成功\n${stores.length}家门店已保存到服务器`)}catch(e){console.error(e);alert(`❌ 基准数据库保存失败\n${e.message}\n\n本地缓存仍保留，请修复 Cloudflare / Upstash 后重试`)}finally{btn.disabled=false;btn.textContent='📌 更新数据库'}}
async function pasteBatchContent(){try{batchInput.value=await navigator.clipboard.readText()}catch{alert('无法读取剪贴板，请手动粘贴')}}function clearBatchInput(){if(confirm('确定清空输入内容吗？'))batchInput.value=''}function loadBatchExample(){batchInput.value='江北胡汪洋经销商 | https://surl.amap.com/zTkZfPL2fP\n渝北中景隆贸易有限公司\n江北重庆兴农'}function showStatus(t,type){storeList.innerHTML=`<div style="text-align:center;padding:20px;color:${type==='error'?'#E74C3C':'#7F8B98'}">${esc(t)}</div>`}
</script></body></html>
