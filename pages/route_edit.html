<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>线路基准维护</title><link rel="stylesheet" href="../css/route_edit.css">
<style>
.card-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:16px;margin-bottom:12px;border-bottom:1px solid #26313C}.card-header .card-title{margin:0}.base-actions{display:flex;gap:8px}.base-actions button{margin:0!important;white-space:nowrap}.store-list-scroll{padding-top:4px}.store-row{margin-bottom:12px}.store-name-clickable{cursor:pointer}.store-name-clickable:hover{opacity:.85}.store-actions{display:flex;justify-content:flex-end;align-items:center;margin-top:8px}.store-actions button{width:64px!important;min-width:64px!important;height:34px!important;min-height:34px!important;padding:0!important;margin:0!important;box-sizing:border-box!important;border:1px solid #3A4856!important;border-radius:9px!important;background:#18212B!important;color:#DCE5EE!important;font-size:14px!important;font-weight:600!important;line-height:32px!important;text-align:center!important;cursor:pointer!important}.store-actions button:active{transform:scale(.97)}.btn-group{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}.btn-group>button{width:100%;min-height:55px;margin:0!important;border:none;border-radius:18px;background:#2457A6;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}.btn-group>button:active{transform:scale(.97)}.btn-group>button:disabled{opacity:.65;cursor:not-allowed}.cancel-btn{background:#2457A6!important;color:#fff!important;border:1px solid #2457A6!important}.dialog{padding:12px 10px}.dialog-box{width:calc(100% - 20px);max-width:560px;box-sizing:border-box}.edit-textarea{width:100%;box-sizing:border-box;min-height:220px;border:1px solid #2A3540;border-radius:12px;background:#10161D;color:#E8EDF2;padding:14px;font-size:15px;line-height:1.65;outline:none;resize:vertical}.input-box{margin-bottom:10px}.input-box input{width:100%;box-sizing:border-box}.status{padding:12px;border-radius:10px;margin:12px 0;display:none}.status.show{display:block}.status.error{color:#ff8b8b;background:rgba(192,57,43,.12)}.status.ok{color:#8ee0a8;background:rgba(39,174,96,.12)}
</style>
</head>
<body>
<div class="app-container">
<header class="top-bar"><button class="back-btn" id="backBtn" type="button" aria-label="返回">←</button><div class="app-title">线路基准维护</div><div style="width:40px"></div></header>
<section class="card"><div class="card-title">📋 线路信息</div><div class="info-row"><span class="label">线路名称</span><span class="value" id="routeName">加载中...</span></div><div class="info-row"><span class="label">客户总数</span><span class="value" id="storeCount">--</span></div></section>
<div id="status" class="status"></div>
<section class="card"><div class="card-header"><div class="card-title">🏪 基准门店</div><div class="base-actions"><button class="add-btn" id="addBtn" type="button">+ 新增</button><button class="add-btn" id="replaceBtn" type="button">↻ 更换</button></div></div><div class="store-list-scroll" id="storeList"><div style="text-align:center;padding:20px;color:#7F8B98">加载中...</div></div></section>
<div class="btn-group"><button class="save-btn" id="saveBtn" type="button">更新</button><button class="cancel-btn" id="cancelBtn" type="button">取消</button></div>
<div id="storeDialog" class="dialog"><div class="dialog-box"><h3 id="dialogTitle">编辑门店</h3><div id="singleMode"><div class="input-box"><input id="storeCode" placeholder="编号"></div><div class="input-box"><input id="storeName" placeholder="门店名称"></div><div class="input-box"><input id="storeNav" placeholder="导航链接（选填）"></div><div class="input-box"><input id="storeNote" placeholder="备注（选填）"></div><div id="editDeleteArea" style="margin-top:18px;padding-top:16px;border-top:1px solid #26313C"><button id="deleteStoreBtn" type="button" style="width:100%;min-height:46px;border:1px solid #C0392B;border-radius:14px;background:transparent;color:#ff8b8b;font-size:16px;font-weight:600;cursor:pointer">删除此门店</button></div></div><div id="batchMode" style="display:none"><p id="batchTip" style="color:#7F8B98;font-size:13px">每行一个门店；可带编号、导航链接、备注。新增模式会追加到现有基准数据。</p><textarea id="batchInput" class="edit-textarea" placeholder="01、门店名称\n导航：https://...\n备注：由经销商代送\n02、门店名称"></textarea></div><div class="dialog-btn"><button class="cancel-btn" id="dialogCancel" type="button">取消</button><button id="dialogSave" type="button">保存</button></div></div></div>
</div>
<script src="../js/auth.js"></script>
<script>
'use strict';
let stores=[],editIndex=-1,batchMode=false,replaceMode=false,currentRoute='';
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function apiHeaders(extra={}){return Auth.getAuthHeaders?Auth.getAuthHeaders(extra):extra}
function showStatus(text,type='ok'){const el=$('status');el.textContent=text;el.className='status show '+type}
function hideStatus(){const el=$('status');el.className='status'}
async function loadStores(){hideStatus();$('storeList').innerHTML='<div style="text-align:center;padding:20px;color:#7F8B98">⏳ 正在读取服务器最新基准数据...</div>';try{const r=await fetch(`/api/routes?route=${encodeURIComponent(currentRoute)}`,{cache:'no-store',credentials:'same-origin',headers:apiHeaders()});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'服务器基准读取失败（'+r.status+'）');stores=Array.isArray(d.stores)?d.stores:[];render();if(!stores.length)showStatus('当前线路暂无基准门店，请新增。','ok')}catch(e){stores=[];render();showStatus(e.message||'服务器读取失败，请联网后重试','error')}}
function render(){$('routeName').textContent=currentRoute;$('storeCount').textContent=stores.length;const list=$('storeList');if(!stores.length){list.innerHTML='<div style="text-align:center;padding:30px;color:#7F8B98">暂无基准门店</div>';return}list.innerHTML=stores.map((s,i)=>`<div class="store-row"><div class="store-name-clickable" data-store-nav="${i}" title="${s.nav?'点击门店名称打开导航':''}"><span style="color:#7F8B98;margin-right:10px">${esc(String(s.code||i+1).padStart(2,'0'))}</span>${esc(s.name)}</div>${s.note?`<div style="color:#7F8B98;font-size:12px;margin:5px 0 0 34px">${esc(s.note)}</div>`:''}<div class="store-actions"><button type="button" data-edit="${i}">编辑</button></div></div>`).join('');list.querySelectorAll('[data-store-nav]').forEach(el=>el.onclick=()=>{const u=stores[Number(el.dataset.storeNav)]?.nav||'';if(!u)return;if(/^https?:\/\//i.test(u))window.open(u,'_blank','noopener,noreferrer');else alert('导航地址无效')});list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(Number(b.dataset.edit)))}
function renumber(){stores.forEach((s,i)=>{s.code=String(i+1).padStart(2,'0');s.routeOrder=i+1})}
function openEdit(i){editIndex=i;batchMode=false;replaceMode=false;const s=stores[i]||{};$('dialogTitle').textContent='编辑门店';$('singleMode').style.display='block';$('batchMode').style.display='none';$('editDeleteArea').style.display='block';$('storeCode').value=s.code||'';$('storeName').value=s.name||'';$('storeNav').value=s.nav||'';$('storeNote').value=s.note||'';$('storeDialog').style.display='flex'}
function openBatch(replace){editIndex=-1;batchMode=true;replaceMode=replace;$('dialogTitle').textContent=replace?'更换基准数据':'新增基准门店';$('singleMode').style.display='none';$('batchMode').style.display='block';$('editDeleteArea').style.display='none';$('batchTip').textContent=replace?'⚠ 更换模式：保存后将删除当前已有的全部基准数据，并使用本次导入内容作为新的完整基准数据。':'新增模式：保存后将本次导入的门店追加到当前基准数据，已有门店不会被整体删除。';$('batchInput').value='';$('storeDialog').style.display='flex'}
function closeDialog(){$('storeDialog').style.display='none'}
function parseBatch(text){const lines=String(text||'').replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean),out=[];let cur=null;const push=()=>{if(cur?.name){cur.name=cleanStoreName(cur.name);if(cur.name)out.push(cur)}cur=null};for(let raw of lines){let line=raw.trim();const navMatch=line.match(/(?:[（(]\s*)?(?:[•·\-—]\s*)?(?:导航\s*[:：]?\s*)?(https?:\/\/[^\s）)]+)(?:\s*[）)])?/i);if(navMatch){if(!cur){const before=line.slice(0,navMatch.index).trim();if(before)cur={name:before,nav:'',note:''}}if(cur)cur.nav=navMatch[1].trim();line=(line.slice(0,navMatch.index)+line.slice(navMatch.index+navMatch[0].length)).trim();line=line.replace(/[（(]\s*[•·\-—]?\s*导航\s*[:：]?\s*[）)]/gi,'').trim();if(!line)continue}if(/^\s*(?:[•·\-—]\s*)?导航\s*[:：]\s*https?:\/\//i.test(line)){const u=line.replace(/^\s*(?:[•·\-—]\s*)?导航\s*[:：]\s*/i,'').trim();if(cur)cur.nav=u;continue}if(/^https?:\/\//i.test(line)){if(cur)cur.nav=line.trim();continue}if(/^\s*(?:[•·\-—]\s*)?备注\s*[:：]/i.test(line)){const note=line.replace(/^\s*(?:[•·\-—]\s*)?备注\s*[:：]\s*/i,'').trim();if(cur)cur.note=note;continue}const m=line.match(/^\d+\s*[、.．)）\-]?\s*(.+)$/);if(m){push();cur={name:m[1].trim(),nav:'',note:''};const inline=cur.name.match(/(?:[（(]\s*)?(?:[•·\-—]\s*)?(?:导航\s*[:：]?\s*)(https?:\/\/[^\s）)]+)\s*[）)]?/i);if(inline){cur.nav=inline[1].trim();cur.name=cur.name.replace(inline[0],'').trim()}continue}if(!cur)cur={name:line,nav:'',note:''};else cur.name+=' '+line}push();const seen=new Set();return out.filter(x=>{const k=x.name.replace(/\s+/g,'').toLowerCase();if(!k||seen.has(k))return false;seen.add(k);return true}).map(x=>({...x,nav:/^https?:\/\//i.test(x.nav||'')?x.nav.trim():'',note:String(x.note||'').trim()}))}
function cleanStoreName(name){let s=String(name||'').trim();s=s.replace(/[（(]\s*(?:[•·\-—]\s*)?(?:导航\s*[:：]?\s*)?https?:\/\/[^\s）)]+\s*[）)]/gi,'');s=s.replace(/(?:[•·\-—]\s*)?导航\s*[:：]?\s*https?:\/\/[^\s）)]+/gi,'');s=s.replace(/\s{2,}/g,' ').trim();return s.replace(/^[、.．)）\-\s]+|[、.．\-\s]+$/g,'').trim()}
$('dialogSave').onclick=()=>{if(batchMode){const p=parseBatch($('batchInput').value);if(!p.length)return alert('没有识别到有效门店');if(replaceMode){if(!confirm('确定更换基准数据吗？\n\n当前已有的全部基准门店将被删除，并替换为本次导入的数据。'))return;stores=p}else{stores=stores.concat(p)}renumber();closeDialog();render();return}const name=cleanStoreName($('storeName').value.trim());if(!name)return alert('请输入门店名称');const item={code:$('storeCode').value.trim(),name,nav:/^https?:\/\//i.test($('storeNav').value.trim())?$('storeNav').value.trim():'',note:$('storeNote').value.trim()};if(editIndex<0)stores.push(item);else stores[editIndex]=item;renumber();closeDialog();render()};
$('deleteStoreBtn').onclick=()=>{if(editIndex<0||!stores[editIndex])return;const name=stores[editIndex].name||'此门店';if(!confirm(`确定删除“${name}”吗？\n\n删除后需点击“更新”才会正式保存到服务器。`))return;stores.splice(editIndex,1);renumber();closeDialog();render();showStatus('门店已从当前编辑数据中移除，请点击“更新”正式保存。','ok')};
$('dialogCancel').onclick=closeDialog;$('addBtn').onclick=()=>openBatch(false);$('replaceBtn').onclick=()=>openBatch(true);
$('saveBtn').onclick=async()=>{if(!currentRoute)return alert('未识别线路');if(!stores.length)return alert('没有可保存的基准门店');const btn=$('saveBtn');btn.disabled=true;btn.textContent='更新中...';try{renumber();const r=await fetch('/api/routes?route='+encodeURIComponent(currentRoute),{method:'PUT',cache:'no-store',credentials:'same-origin',headers:apiHeaders({'Content-Type':'application/json'}),body:JSON.stringify({stores})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.error||'服务器保存失败（'+r.status+'）');if(Array.isArray(d.stores))stores=d.stores;else renumber();render();showStatus('✅ 基准数据已更新，当前客户总数：'+stores.length+' 家','ok');}catch(e){showStatus('❌ '+(e.message||'保存失败')+'；服务器数据未修改，请联网后重试','error')}finally{btn.disabled=false;btn.textContent='更新'}};
function goBack(){if(window.history.length>1){window.history.back();return}window.location.href='../home.html'}
$('backBtn').onclick=goBack;$('cancelBtn').onclick=goBack;
document.addEventListener('DOMContentLoaded',async()=>{if(!(await Auth.checkAuth()))return;currentRoute=String(Auth.getCurrentRoute?.()||'').trim();if(!currentRoute){showStatus('当前账号未绑定线路，无法维护基准数据','error');return}await loadStores()});
</script>
</body></html>
