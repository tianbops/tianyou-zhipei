<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>原始数据维护</title><link rel="stylesheet" href="../css/route_edit.css"><style>.card-header{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:16px;padding-bottom:16px!important;margin-bottom:12px!important;border-bottom:1px solid #26313C!important}.card-header .card-title{margin:0!important}.card-header .add-btn{margin:0!important;flex-shrink:0}.store-list-scroll{padding-top:4px!important}.store-row{margin-bottom:12px!important}.btn-group{display:grid!important;grid-template-columns:2fr 1fr!important;align-items:stretch!important;gap:12px!important}.btn-group>button{width:100%!important;margin:0!important;box-sizing:border-box!important;min-height:46px}.btn-group .cancel-btn{background:#2457A6!important;color:#fff!important;border:1px solid #2457A6!important;border-radius:10px!important;font-weight:500!important}.dialog{padding:12px 10px!important}.dialog-box{width:calc(100% - 20px)!important;max-width:560px!important;box-sizing:border-box}.edit-textarea{width:100%;box-sizing:border-box;min-height:220px;border:1px solid #2A3540;border-radius:12px;background:#10161D;color:#E8EDF2;padding:14px;font-size:15px;line-height:1.65;outline:none;resize:vertical}.edit-textarea:focus{border-color:#2457A6;box-shadow:0 0 0 2px rgba(36,87,166,.18)}.batch-actions{display:flex;justify-content:space-between;gap:8px;margin-top:10px}.batch-actions button{flex:1}.select-all-btn{border:1px solid #2A3540;background:#18212B;color:#E8EDF2;border-radius:10px;padding:9px 12px}</style></head><body><div class="app-container"><header class="top-bar"><button class="back-btn" id="backBtn">←</button><div class="app-title">原始数据维护</div><div style="width:40px"></div></header><section class="card"><div class="card-title">📋 线路信息</div><div class="info-row"><span class="label">线路名称</span><span class="value" id="routeName">加载中...</span></div><div class="info-row"><span class="label">默认车辆</span><span class="value">渝DK7692</span></div><div class="info-row"><span class="label">客户总数</span><span class="value" id="storeCount">--</span></div></section><section class="card"><div class="card-header"><div class="card-title">🏪 全部客户</div><button class="add-btn" onclick="openAddDialog()">+ 新增</button></div><div class="store-list-scroll" id="storeList"><div style="text-align:center;padding:20px;color:#7F8B98">加载中...</div></div></section><div class="btn-group"><button class="save-btn" onclick="updateDatabase()">📌 更新数据库</button><button class="cancel-btn" id="cancelBtn">取消</button></div><div id="storeDialog" class="dialog"><div class="dialog-box"><h3 id="dialogTitle">编辑客户</h3><div id="singleEditMode"><div class="input-box"><input id="storeCode" placeholder="编号"></div><div class="input-box"><input id="storeName" placeholder="门店名称"></div><div class="input-box"><input id="storeNav" placeholder="导航链接（选填）"></div></div><div id="batchEditMode" style="display:none"><div style="color:#7F8B98;font-size:13px;text-align:center;margin-bottom:12px">直接粘贴完整基准数据，自动识别编号、门店、导航和备注。</div><textarea id="batchInput" class="edit-textarea" rows="10" placeholder="请粘贴40家基准门店原始数据"></textarea><div class="batch-actions"><button class="select-all-btn" onclick="selectAllBatch()">全选</button><button class="select-all-btn" onclick="pasteBatchContent()">📋 粘贴</button><button class="select-all-btn" onclick="clearBatchInput()">清空</button></div></div><div class="dialog-btn"><button class="cancel-btn" onclick="closeStoreDialog()">取消</button><button onclick="saveStore()" id="saveBtn">解析并导入</button></div></div></div></div><script src="../js/auth.js"></script><script>let editIndex=-1,stores=[],isDirty=false,isBatchMode=false,currentRoute='';function getRouteFromURL(){return new URLSearchParams(location.search).get('route')||Auth.getCurrentRoute()||''}function getReturnUrl(){return new URLSearchParams(location.search).get('from')==='admin'?'../admin.html':'../home.html'}document.addEventListener('DOMContentLoaded',()=>{if(!Auth.checkAuth())return;currentRoute=getRouteFromURL();document.getElementById('routeName').textContent=currentRoute;document.getElementById('backBtn').onclick=goBack;document.getElementById('cancelBtn').onclick=goBack;loadStores(currentRoute)});function goBack(){if(isDirty&&!confirm('有未保存的修改，确定离开吗？'))return;location.href=getReturnUrl()}async function loadStores(route){try{const r=await fetch('/api/route/'+encodeURIComponent(route),{cache:'no-store'});if(!r.ok)throw new Error(await r.text());const d=await r.json();stores=Array.isArray(d.stores)?d.stores:[];localStorage.setItem('base_data',JSON.stringify(stores));renderStores()}catch(e){const c=Auth.getCachedRouteData(route);stores=c&&Array.isArray(c.stores)?c.stores:[];renderStores();if(!stores.length)showStatus('无法读取服务器基准数据库：'+e.message,'error')}}function renderStores(){const list=document.getElementById('storeList'),count=document.getElementById('storeCount');count.textContent=stores.length;list.innerHTML=stores.length?stores.map((s,i)=>'<div class="store-row"><div><span style="color:#7F8B98;margin-right:10px">'+esc(s.code)+'</span>'+esc(s.name)+'</div><div class="store-actions">'+(s.nav?'<button onclick="openNav('+i+')" style="background:#2457A6">导航</button>':'')+'<button onclick="editStore('+i+')">编辑</button><button onclick="deleteStore('+i+')" style="background:#C0392B">删除</button></div></div>').join(''):'<div style="text-align:center;padding:20px;color:#7F8B98">暂无客户，点击 + 新增</div>'}function openNav(i){const u=stores[i]?.nav||'';if(/^https?:\/\//i.test(u))window.open(u,'_blank');else alert('导航地址无效')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function openAddDialog(){editIndex=-1;isBatchMode=true;document.getElementById('dialogTitle').textContent='新增客户（批量导入）';document.getElementById('singleEditMode').style.display='none';document.getElementById('batchEditMode').style.display='block';document.getElementById('batchInput').value='';document.getElementById('saveBtn').textContent='解析并导入';document.getElementById('storeDialog').style.display='flex'}function editStore(i){editIndex=i;isBatchMode=false;const s=stores[i]||{};document.getElementById('dialogTitle').textContent='编辑客户';document.getElementById('singleEditMode').style.display='block';document.getElementById('batchEditMode').style.display='none';document.getElementById('storeCode').value=s.code||'';document.getElementById('storeName').value=s.name||'';document.getElementById('storeNav').value=s.nav||'';document.getElementById('saveBtn').textContent='保存';document.getElementById('storeDialog').style.display='flex'}function closeStoreDialog(){document.getElementById('storeDialog').style.display='none'}function saveStore(){isBatchMode?saveBatchStores():saveSingleStore()}function saveSingleStore(){const code=document.getElementById('storeCode').value.trim(),name=document.getElementById('storeName').value.trim(),nav=document.getElementById('storeNav').value.trim();if(!code||!name)return alert('请输入编号和门店名称');stores[editIndex<0?stores.length:editIndex]={code,name,nav};renumber();markDirty();closeStoreDialog();renderStores()}function normalizeText(s){return String(s||'').replace(/\r/g,'').replace(/[\u200b-\u200f\ufeff]/g,'').trim()}function parseBaseData(text){const lines=String(text||'').split('\n').map(normalizeText).filter(Boolean),result=[];let cur=null;const push=()=>{if(cur&&cur.name){cur.name=cur.name.replace(/^\s*\d+[、.．)]\s*/,'').trim();if(cur.name)result.push(cur)}cur=null};for(let raw of lines){let line=raw.replace(/^[-*•]\s*/,'').trim();if(/^\d+\s*[、.．)]\s*/.test(line)){push();line=line.replace(/^\d+\s*[、.．)]\s*/,'').trim();if(line)cur={code:'',name:line,nav:''};continue}if(/^导航\s*[:：]/i.test(line)){if(cur)cur.nav=line.replace(/^导航\s*[:：]\s*/i,'').trim();continue}if(/^备注\s*[:：]/i.test(line)||/^说明\s*[:：]/i.test(line))continue;if(/^https?:\/\//i.test(line)){if(cur&&!cur.nav)cur.nav=line;continue}if(line.includes('|')||line.includes('\t')){const p=line.split(/[|\t]/).map(x=>x.trim());if(p[0]){push();cur={code:'',name:p[0].replace(/^\d+\s*[、.．)]\s*/,''),nav:p[1]||''}}continue}if(cur&&!cur.nav)cur.name+=' '+line}push();const seen=new Set();return result.filter(s=>{const k=s.name.replace(/[\s，,。；;：:（）()【】\[\]]/g,'').toLowerCase();if(!k||seen.has(k))return false;seen.add(k);return true}).map((s,i)=>({...s,code:String(i+1).padStart(2,'0')}))}function saveBatchStores(){const text=document.getElementById('batchInput').value.trim();if(!text)return alert('请先粘贴基准数据');const parsed=parseBaseData(text);if(!parsed.length)return alert('没有识别到有效门店');const replace=confirm('已识别 '+parsed.length+' 家门店。\n\n确定=覆盖当前基准数据；取消=追加。');stores=replace?parsed:mergeStores(stores,parsed);renumber();markDirty();closeStoreDialog();renderStores();alert('✅ 已识别 '+parsed.length+' 家门店\n当前基准数据库：'+stores.length+' 家\n\n请点击“更新数据库”正式保存')}function mergeStores(a,b){const out=[...a],seen=new Set(out.map(s=>s.name.replace(/[\s，,。；;：:（）()【】\[\]]/g,'').toLowerCase()));b.forEach(s=>{const k=s.name.replace(/[\s，,。；;：:（）()【】\[\]]/g,'').toLowerCase();if(!seen.has(k)){out.push(s);seen.add(k)}});return out}function renumber(){stores.forEach((s,i)=>s.code=String(i+1).padStart(2,'0'))}function markDirty(){isDirty=true;localStorage.setItem('base_data',JSON.stringify(stores));Auth.cacheRouteData(currentRoute,{route:currentRoute,stores})}function deleteStore(i){if(!confirm('确定删除该客户吗？'))return;stores.splice(i,1);renumber();markDirty();renderStores()}async function updateDatabase(){if(!currentRoute)return alert('未识别线路');if(!stores.length)return alert('没有可保存的基准门店');const btn=document.querySelector('.save-btn');btn.disabled=true;btn.textContent='正在保存...';try{const r=await fetch('/api/route/'+encodeURIComponent(currentRoute),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({stores})});const text=await r.text();let d={};try{d=JSON.parse(text)}catch{}if(!r.ok||d.success===false)throw new Error(d.error||'HTTP '+r.status);if(!Array.isArray(d.stores)||d.stores.length!==stores.length)throw new Error('服务器返回数量不一致：本地'+stores.length+'家，服务器'+(Array.isArray(d.stores)?d.stores.length:0)+'家');stores=d.stores;localStorage.setItem('base_data',JSON.stringify(stores));Auth.cacheRouteData(currentRoute,{route:currentRoute,stores});isDirty=false;Auth.addLog('数据库更新',currentRoute+' 基准数据库已更新（'+stores.length+'条）');alert('✅ 基准数据库更新成功\n'+stores.length+'家门店已保存到服务器')}catch(e){console.error(e);alert('❌ 基准数据库保存失败\n'+e.message+'\n\n本地缓存仍保留，请修复 Cloudflare / Upstash 后重试')}finally{btn.disabled=false;btn.textContent='📌 更新数据库'}}function selectAllBatch(){const el=document.getElementById('batchInput');el.focus();el.select()}async function pasteBatchContent(){try{document.getElementById('batchInput').value=await navigator.clipboard.readText()}catch{alert('无法读取剪贴板，请手动粘贴')}}function clearBatchInput(){const el=document.getElementById('batchInput');el.value='';el.focus()}function showStatus(t,type){document.getElementById('storeList').innerHTML='<div style="text-align:center;padding:20px;color:'+(type==='error'?'#E74C3C':'#7F8B98')+'">'+esc(t)+'</div>'}</script></body></html>
