<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史查询</title><link rel="stylesheet" href="../css/order.css">
</head>
<body>
  <div class="app-container history-page">
    <header class="top-bar"><button class="back-btn" onclick="goBack()">←</button><div class="app-title">历史查询</div><div style="width:40px;"></div></header>
    <section class="task-card history-filter-card">
      <div class="date-picker-title">选择日期</div>
      <button class="date-display" id="dateDisplay" type="button">2026-09-17</button>
      <button class="query-btn" id="queryBtn">查询配送记录</button>
    </section>
    <section class="task-card history-record-card"><div class="route-title">📋 配送记录</div><div class="history-scroll" id="historyList"><div class="empty-tip">请选择日期并点击查询</div></div></section>
  </div>

  <div class="date-modal" id="dateModal" aria-hidden="true">
    <div class="date-sheet" role="dialog" aria-modal="true">
      <div class="date-sheet-head"><button type="button" id="cancelDate">取消</button><strong>选择日期</strong><button type="button" id="confirmDate">确定</button></div>
      <div class="wheel-wrap"><div class="wheel" id="yearWheel"></div><div class="wheel" id="monthWheel"></div><div class="wheel" id="dayWheel"></div></div>
      <div class="wheel-highlight" aria-hidden="true"></div>
      <div class="wheel-labels"><span>年</span><span>月</span><span>日</span></div>
    </div>
  </div>

<script src="../js/auth.js"></script>
<script>
'use strict';
let historyData=[], selected='';
const $=id=>document.getElementById(id),pad=v=>String(v).padStart(2,'0');
function today(){const d=new Date();return [d.getFullYear(),d.getMonth()+1,d.getDate()]}
function daysInMonth(y,m){return new Date(Number(y),Number(m),0).getDate()}
function selectedDate(){return selected||$('dateDisplay')?.textContent||''}
function buildWheel(id,min,max,value,label){const box=$(id);box.innerHTML='';for(let n=min;n<=max;n++){const item=document.createElement('button');item.type='button';item.className='wheel-item';item.dataset.value=String(n);item.textContent=label==='year'?String(n):pad(n);item.addEventListener('click',()=>snapWheel(box,n));box.appendChild(item)}requestAnimationFrame(()=>snapWheel(box,value,false))}
function snapWheel(box,value,smooth=true){const item=box.querySelector(`[data-value="${value}"]`);if(!item)return;const top=item.offsetTop-(box.clientHeight-item.offsetHeight)/2;box.scrollTo({top:Math.max(0,top),behavior:smooth?'smooth':'auto'});setActive(box,item)}
function setActive(box,item){box.querySelectorAll('.wheel-item').forEach(el=>el.classList.toggle('active',el===item))}
function wheelValue(id){const box=$(id),items=[...box.querySelectorAll('.wheel-item')];if(!items.length)return 0;const center=box.scrollTop+box.clientHeight/2;let best=items[0],distance=Infinity;items.forEach(item=>{const d=Math.abs(item.offsetTop+item.offsetHeight/2-center);if(d<distance){distance=d;best=item}});setActive(box,best);return Number(best.dataset.value)}
function openDatePicker(){const [y,m,d]=selectedDate().split('-').map(Number);buildWheel('yearWheel',2020,2035,y,'year');buildWheel('monthWheel',1,12,m,'month');buildWheel('dayWheel',1,daysInMonth(y,m),Math.min(d,daysInMonth(y,m)),'day');$('dateModal').classList.add('active');$('dateModal').setAttribute('aria-hidden','false')}
function closeDatePicker(){$('dateModal').classList.remove('active');$('dateModal').setAttribute('aria-hidden','true')}
function confirmDate(){const y=wheelValue('yearWheel'),m=wheelValue('monthWheel'),d=Math.min(wheelValue('dayWheel'),daysInMonth(y,m));selected=`${y}-${pad(m)}-${pad(d)}`;$('dateDisplay').textContent=selected;closeDatePicker();loadHistory(selected)}
async function loadHistory(date){const box=$('historyList');box.innerHTML='<div class="empty-tip">⏳ 加载中...</div>';try{const r=await fetch(`/api/history?date=${encodeURIComponent(date)}`,{cache:'no-store',headers:Auth.getAuthHeaders?Auth.getAuthHeaders():{},credentials:'same-origin'});if(!r.ok)throw new Error(r.status===401?'登录已失效，请重新登录':`历史数据读取失败（${r.status}）`);const payload=await r.json();const records=Array.isArray(payload?.data)?payload.data:(Array.isArray(payload)?payload:[]);historyData=records;render(records)}catch(e){console.error(e);box.innerHTML=`<div class="empty-tip">🌐 ${escapeHtml(e.message)}<br><small>请联网后重试</small></div>`}}
function render(records){const box=$('historyList');if(!records.length){box.innerHTML='<div class="empty-tip">📭 暂无配送记录</div>';return}box.innerHTML='';records.forEach((item,i)=>{const card=document.createElement('div');card.className='history-item';const count=Number(item.uniqueStoreCount??item.count??item.orders?.length??0);const rawCount=Number(item.rawOrderCount??item.recognizedCount??0);const countText=rawCount>count?`${count} 家门店（${rawCount} 条原始记录）`:`${count} 家门店`;card.innerHTML=`<div class="history-date">${escapeHtml(item.date||'未知日期')}</div><div class="info-row"><span>线路</span><b>${escapeHtml(item.route||'')}</b></div><div class="info-row"><span>车辆</span><b>🚚 ${escapeHtml(item.vehicle||'未设置')}</b></div><div class="info-row"><span>配送</span><b>${countText}</b></div><div class="info-row"><span>总重量</span><b>${escapeHtml(formatWeight(item.weight??item.totalWeight))}</b></div><div class="info-row"><span>批次</span><b>${escapeHtml(item.orderBatchId||'—')}</b></div><div class="history-actions"><button class="history-btn" data-action="view" data-index="${i}">查看路线 →</button><button class="history-delete" data-action="delete" data-index="${i}">删除</button></div>`;card.querySelector('[data-action="view"]').addEventListener('click',()=>viewHistoryDetail(i));card.querySelector('[data-action="delete"]').addEventListener('click',()=>deleteHistory(i));box.appendChild(card)})}
function viewHistoryDetail(i){const item=historyData[i];if(!item?.orderBatchId){alert('该历史记录缺少运单批次，无法打开详情');return}const date=encodeURIComponent(item.date||selectedDate());const batch=encodeURIComponent(item.orderBatchId);window.location.href=`order_detail.html?mode=history&date=${date}&orderBatchId=${batch}`}
async function deleteHistory(i){const item=historyData[i];if(!item)return;const date=item.date||selectedDate();const batch=item.orderBatchId||'';if(!batch){alert('该历史记录缺少运单批次，无法安全删除');return}if(!confirm(`确定删除这条 ${date} 的历史配送记录吗？\n如果存在完全相同的重复数据，会一并删除；同一天其它不同配送不会删除。`))return;const button=document.querySelector(`.history-delete[data-index="${i}"]`);if(button){button.disabled=true;button.textContent='删除中…'}try{const r=await fetch(`/api/history?date=${encodeURIComponent(date)}&orderBatchId=${encodeURIComponent(batch)}`,{method:'DELETE',cache:'no-store',headers:Auth.getAuthHeaders?Auth.getAuthHeaders():{},credentials:'same-origin'});const data=await r.json().catch(()=>({}));if(!r.ok||!data.success)throw new Error(data.error||`删除失败（${r.status}）`);await loadHistory(selectedDate())}catch(e){if(button){button.disabled=false;button.textContent='删除'}alert(e.message||'历史记录删除失败')}}
function formatWeight(v){if(v===null||v===undefined||v==='')return '0t';const s=String(v).trim().replace(/,/g,'');const m=s.match(/[\d]+(?:\.\d+)?/);if(!m)return '0t';const n=Number(m[0]);if(!Number.isFinite(n))return '0t';const tons=/吨|\bt\b/i.test(s)?n:/kg|千克|公斤/i.test(s)?n/1000:n>=1000?n/1000:n;const fixed=Math.round((tons+Number.EPSILON)*1e6)/1e6;return `${fixed.toFixed(6).replace(/0+$/,'').replace(/\.$/,'')}t`}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function goBack(){location.href='../home.html'}
$('dateDisplay')?.addEventListener('click',openDatePicker);$('cancelDate')?.addEventListener('click',closeDatePicker);$('confirmDate')?.addEventListener('click',confirmDate);$('queryBtn')?.addEventListener('click',()=>loadHistory(selectedDate()));$('dateModal')?.addEventListener('click',e=>{if(e.target===$('dateModal'))closeDatePicker()});
['yearWheel','monthWheel','dayWheel'].forEach(id=>$(id)?.addEventListener('scroll',()=>{const box=$(id);clearTimeout(box._timer);box._timer=setTimeout(()=>{const y=wheelValue('yearWheel'),m=wheelValue('monthWheel'),d=wheelValue('dayWheel');if(id==='yearWheel'||id==='monthWheel')buildWheel('dayWheel',1,daysInMonth(y,m),Math.min(d,daysInMonth(y,m)),'day')},90)}));
document.addEventListener('DOMContentLoaded',async()=>{try{if(!(await Auth.checkAuth()))return;const [y,m,d]=today();selected=`${y}-${pad(m)}-${pad(d)}`;$('dateDisplay').textContent=selected;await loadHistory(selected)}catch(e){console.error(e)}});
</script>
<style>
/* 历史查询页面：明确把两张卡片作为固定内容区处理，记录窗口整体下移并在手机底部保留可见间距。 */
.history-page{padding-top:18px;padding-bottom:32px!important;box-sizing:border-box;min-height:0;height:calc(100dvh - 32px);}
.history-page .top-bar{margin-bottom:13px}
.history-filter-card{flex:0 0 auto;margin-bottom:12px;padding:16px}
.history-record-card{flex:1 1 0;min-height:0;margin-bottom:0;padding:14px;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box}
.history-record-card .route-title{flex:0 0 auto;margin-bottom:8px}
.history-scroll{flex:1 1 0;min-height:0;max-height:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-right:2px;padding-bottom:2px}
.date-picker-title{text-align:center;color:#B8C2CC;font-size:15px;letter-spacing:2px;margin-bottom:10px}.date-display{width:100%;height:50px;background:#05070A;color:#fff;border:0;border-radius:12px;font-size:17px;font-weight:600;letter-spacing:1px;cursor:pointer}.query-btn,.history-btn,.history-delete{height:48px;border:0;border-radius:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:14px}.query-btn{width:100%;background:#2457A6;font-size:16px}.history-btn,.history-delete{margin-top:10px}.empty-tip{text-align:center;padding:40px 20px;color:#7F8B98}.history-item{background:#05070A;border-radius:14px;padding:16px 18px;margin-bottom:12px;border:1px solid rgba(255,255,255,.05)}.history-date{font-size:16px;font-weight:bold;margin-bottom:8px;color:#FFB020}.info-row{display:flex;justify-content:space-between;align-items:center;min-height:34px;font-size:14px}.info-row span{color:#7F8B98}.info-row b{color:#fff;font-weight:500}.history-actions{display:grid;grid-template-columns:1fr 88px;gap:10px}.history-btn,.history-delete{width:100%;height:40px;font-size:14px}.history-btn{background:#2457A6}.history-delete{background:#5A2026;color:#FFB4B4}.history-delete:disabled{opacity:.55;cursor:wait}.date-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:9999}.date-modal.active{display:flex}.date-sheet{width:100%;max-width:520px;background:#121820;border-radius:22px 22px 0 0;padding:8px 16px 22px;box-shadow:0 -12px 40px rgba(0,0,0,.45);position:relative}.date-sheet-head{height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}.date-sheet-head strong{font-size:16px;color:#fff}.date-sheet-head button{border:0;background:none;color:#8FAFE0;font-size:15px;padding:8px}.date-sheet-head button:last-child{color:#4E8BE8;font-weight:600}.wheel-wrap{position:relative;display:grid;grid-template-columns:1.25fr 1fr 1fr;height:210px;overflow:hidden;margin-top:8px}.wheel{height:210px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:85px 0}.wheel::-webkit-scrollbar{display:none}.wheel-item{display:block;width:100%;height:40px;line-height:40px;scroll-snap-align:center;text-align:center;border:0;background:none;color:#66727F;font-size:16px}.wheel-item.active{color:#fff;font-size:19px;font-weight:700}.wheel-highlight{position:absolute;z-index:5;left:16px;right:16px;top:145px;height:40px;border-top:1px solid rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.18);pointer-events:none}.wheel-labels{display:grid;grid-template-columns:1.25fr 1fr 1fr;text-align:center;color:#7F8B98;font-size:11px;padding-top:4px}
@media(max-height:700px){.history-page{padding-top:10px;padding-bottom:26px!important;height:calc(100dvh - 26px)}.history-page .top-bar{margin-bottom:8px}.history-filter-card{padding:13px;margin-bottom:9px}.history-record-card{padding:12px;margin-bottom:0}.date-display{height:46px}.query-btn{height:44px;margin-top:11px}.history-item{padding:13px 15px;margin-bottom:10px}.info-row{min-height:31px}.empty-tip{padding:28px 15px}}
</style>
</body>
</html>
