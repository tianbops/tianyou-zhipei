<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05070A">
  <title>历史查询 · 智配One</title>
  <link rel="stylesheet" href="../css/order.css?v=20260922-16">
  <link rel="stylesheet" href="../css/history.css?v=20260925-21">
  <link rel="stylesheet" href="../css/icons.css?v=20260921-1">
</head>
<body>
  <div class="app-container history-page">
    <header class="top-bar">
      <button class="back-btn" type="button" aria-label="返回"><svg class="z-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <div class="app-title">历史查询</div>
      <div class="top-placeholder" aria-hidden="true"></div>
    </header>
    <div class="history-toolbar">
      <button class="date-picker-btn" id="datePickerBtn" type="button" aria-label="按日期查询">
        <span class="date-picker-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16"/></svg></span>
        <span>按日期查询</span>
      </button>
    </div>
    <main class="history-scroll" id="historyList" aria-live="polite"><div class="empty-tip">加载中...</div></main>
  </div>
  <div class="delete-modal" id="deleteModal" aria-hidden="true">
    <div class="delete-sheet" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
      <div class="delete-icon" aria-hidden="true"><span class="z-icon"><svg viewBox="0 0 24 24"><path d="M6 7h12M9 7V5h6v2M8 10v7M12 10v7M16 10v7"/><path d="M7 7l1 13h8l1-13"/></svg></span></div>
      <strong class="delete-title" id="deleteTitle">删除配送记录</strong>
      <div class="delete-message">确定删除这条配送记录？</div>
      <div class="delete-warning">删除后将无法恢复，请确认操作。</div>
      <div class="delete-actions"><button type="button" class="delete-cancel" id="cancelDelete">取消</button><button type="button" class="delete-confirm" id="confirmDelete">删除</button></div>
    </div>
  </div>
  <div class="date-modal" id="dateModal" aria-hidden="true">
    <div class="date-sheet" role="dialog" aria-modal="true" aria-label="选择日期">
      <div class="date-sheet-head"><button type="button" id="cancelDate">取消</button><strong>选择日期</strong><button type="button" id="confirmDate">确定</button></div>
      <div class="wheel-wrap"><div class="wheel" id="yearWheel"></div><div class="wheel" id="monthWheel"></div><div class="wheel" id="dayWheel"></div></div>
      <div class="wheel-highlight" aria-hidden="true"></div>
      <div class="wheel-labels"><span>年</span><span>月</span><span>日</span></div>
    </div>
  </div>
  <script src="../js/auth.js?v=20260924-6"></script>
  <script src="../js/modal.js?v=20260925-1"></script>
  <script>
  'use strict';
  let selected='', historyLoading=false;
  let historyView='home';
  let pendingDelete=null;
  let validatedRoute='';
  let routeValidationPromise=null;
  let historyRefreshPromise=null;
  const HISTORY_CACHE_FRESH_MS=30*1000;
  const HISTORY_CACHE_STALE_MS=5*60*1000;
  const HISTORY_CACHE_PREFIX='zhipei:history-cache:';
  const $=id=>document.getElementById(id), pad=v=>String(v).padStart(2,'0');
  const authHeaders=()=>Auth.getAuthHeaders?Auth.getAuthHeaders():{};
  function shanghaiParts(date=new Date()){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);const get=t=>Number(parts.find(p=>p.type===t)?.value||0);return [get('year'),get('month'),get('day')]}
  function today(){return shanghaiParts()}
  function daysInMonth(y,m){return new Date(Number(y),Number(m),0).getDate()}
  function dateFromOffset(offset){const [y,m,d]=shanghaiParts();return new Date(Date.UTC(y,m-1,d-offset,12)).toISOString().slice(0,10)}
  function buildWheel(id,min,max,value,label){const box=$(id);box.innerHTML='';for(let n=min;n<=max;n++){const item=document.createElement('button');item.type='button';item.className='wheel-item';item.dataset.value=String(n);item.textContent=label==='year'?String(n):pad(n);item.addEventListener('click',()=>snapWheel(box,n));box.appendChild(item)}requestAnimationFrame(()=>snapWheel(box,value,false))}
  function snapWheel(box,value,smooth=true){const item=box.querySelector(`[data-value="${value}"]`);if(!item)return;box.scrollTo({top:Math.max(0,item.offsetTop-(box.clientHeight-item.offsetHeight)/2),behavior:smooth?'smooth':'auto'});setActive(box,item)}
  function setActive(box,item){box.querySelectorAll('.wheel-item').forEach(el=>el.classList.toggle('active',el===item))}
  function wheelValue(id){const box=$(id),items=[...box.querySelectorAll('.wheel-item')];if(!items.length)return 0;const center=box.scrollTop+box.clientHeight/2;let best=items[0],distance=Infinity;items.forEach(item=>{const d=Math.abs(item.offsetTop+item.offsetHeight/2-center);if(d<distance){distance=d;best=item}});setActive(box,best);return Number(best.dataset.value)}
  function openDatePicker(){const now=selected?selected.split('-').map(Number):today(), [y,m,d]=now;buildWheel('yearWheel',2020,2035,y,'year');buildWheel('monthWheel',1,12,m,'month');buildWheel('dayWheel',1,daysInMonth(y,m),Math.min(d,daysInMonth(y,m)),'day');$('dateModal').classList.add('active');$('dateModal').setAttribute('aria-hidden','false')}
  function closeDatePicker(){$('dateModal').classList.remove('active');$('dateModal').setAttribute('aria-hidden','true')}
  function confirmDate(){const y=wheelValue('yearWheel'),m=wheelValue('monthWheel'),d=Math.min(wheelValue('dayWheel'),daysInMonth(y,m));selected=`${y}-${pad(m)}-${pad(d)}`;closeDatePicker();openDateHistory(selected)}
  function historyCacheKey(route){return HISTORY_CACHE_PREFIX+encodeURIComponent(String(route||''))}
  function readHistoryCache(route){
    try{
      const raw=localStorage.getItem(historyCacheKey(route));
      if(!raw)return null;
      const cached=JSON.parse(raw);
      if(!cached||!Array.isArray(cached.data)||!Number.isFinite(Number(cached.savedAt)))return null;
      return {data:cached.data,savedAt:Number(cached.savedAt)};
    }catch(_){return null}
  }
  function writeHistoryCache(route,data){
    try{localStorage.setItem(historyCacheKey(route),JSON.stringify({savedAt:Date.now(),data:Array.isArray(data)?data:[]}));}catch(_){}
  }
  function normalizeHistoryEntries(entries){return Array.isArray(entries)?entries.filter(entry=>entry?.date&&Array.isArray(entry.records)&&entry.records.length):[]}
  function groupHistoryRecords(records){const groups=new Map();(Array.isArray(records)?records:[]).forEach(item=>{const date=String(item?.date||'').trim();if(!date)return;if(!groups.has(date))groups.set(date,[]);groups.get(date).push(item)});return [...groups.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([date,records])=>({date,records}))}
  async function validateDispatchRoute(force=false){
    const route=String(typeof Auth!=='undefined'?(Auth.getDispatchRoute?Auth.getDispatchRoute():''):'').trim();
    if(!route)throw new Error('当前未选择调度线路，请返回首页选择线路');
    if(!force&&validatedRoute===route)return route;
    if(!force&&routeValidationPromise)return routeValidationPromise;
    routeValidationPromise=(async()=>{
      const r=await fetch('/api/routes',{cache:'no-store',headers:authHeaders(),credentials:'same-origin'});
      const payload=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(r.status===401?'登录已失效，请重新登录':`线路状态读取失败（${r.status}）`);
      const routes=Array.isArray(payload?.routes)?payload.routes:[];
      const fmt=Auth.formatRouteCode?Auth.formatRouteCode(route):route;
      const found=routes.find(x=>{const id=String(x?.id||'').trim(),name=String(x?.name||'').trim();return (id&&(Auth.formatRouteCode?Auth.formatRouteCode(id):id)===fmt)||(name&&(Auth.formatRouteCode?Auth.formatRouteCode(name):name)===fmt)});
      if(!found)throw new Error('当前线路不存在，无法查询历史记录');
      if(found.status==='disabled')throw new Error('当前线路已停用，无法查询历史记录');
      validatedRoute=route;
      return route;
    })();
    try{return await routeValidationPromise}finally{routeValidationPromise=null}
  }
  async function requestHistory(date){
    const route=await validateDispatchRoute();
    const params=new URLSearchParams();
    if(date)params.set('date',date);
    if(route)params.set('route',route);
    const query=params.toString()?`?${params.toString()}`:'';
    const r=await fetch('/api/v3/history'+query,{cache:'no-store',headers:authHeaders(),credentials:'same-origin'});
    if(!r.ok)throw new Error(r.status===401?'登录已失效，请重新登录':`历史数据读取失败（${r.status}）`);
    const payload=await r.json();
    return Array.isArray(payload?.history)?payload.history:(Array.isArray(payload?.records)?groupHistoryRecords(payload.records):Array.isArray(payload?.data)?payload.data:(Array.isArray(payload)?payload:[]));
  }
  async function refreshHistoryDates(){
    if(historyRefreshPromise)return historyRefreshPromise;
    historyRefreshPromise=(async()=>{
      const entries=normalizeHistoryEntries(await requestHistory(''));
      writeHistoryCache(validatedRoute,entries);
      renderDates(entries);
      return entries;
    })();
    try{return await historyRefreshPromise}finally{historyRefreshPromise=null}
  }
  async function loadHistoryDates(options={}){
    const force=options.force===true;
    const box=$('historyList');
    const route=await validateDispatchRoute();
    const cached=readHistoryCache(route);
    const age=cached?Math.max(0,Date.now()-cached.savedAt):Infinity;
    if(cached){
      renderDates(normalizeHistoryEntries(cached.data));
      if(!force&&age<HISTORY_CACHE_FRESH_MS)return;
      // 成熟移动端列表常用“先显示上次内容，再静默刷新”的规则；刷新期间不清空当前列表。
      refreshHistoryDates().catch(error=>console.warn('历史后台刷新失败',error));
      if(age<=HISTORY_CACHE_STALE_MS)return;
    }else if(!historyRefreshPromise){
      box.innerHTML='<div class="empty-tip"><span class="z-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg></span>正在读取历史记录...</div>';
    }
    if(!cached){
      try{await refreshHistoryDates()}catch(e){console.error(e);box.innerHTML=`<div class="empty-tip"><span class="z-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.2 2.5 3.3 5.5 3.3 9S14.2 18.5 12 21M12 3c2.2 2.5 3.3 9 3.3 9S14.2 18.5 12 21"/></svg></span>${escapeHtml(e.message)}<br><small>请联网后重试</small></div>`}}
  }
  function parseWeightTons(value){const source=String(value??'').trim().replace(/,/g,'');const match=source.match(/\d+(?:\.\d+)?/);if(!match)return 0;const n=Number(match[0]);if(!Number.isFinite(n))return 0;if(/kg|千克|公斤/i.test(source))return n/1000;return n} function recordSummary(item){const count=Number(item?.uniqueStoreCount)||Number(item?.count)||(Array.isArray(item?.orders)?item.orders.length:0);const tons=parseWeightTons(item?.totalWeight??item?.weight);const weight=(Math.round((tons+Number.EPSILON)*100)/100).toFixed(2);return {count,weight}}
  function renderDates(entries){
  const box=$('historyList');
  if(!entries.length){
    box.innerHTML='<div class="empty-tip"><span class="z-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="13" rx="2"/><path d="m7 10 3 3 2-2 5 5"/></svg></span>暂无配送记录</div>';
    return;
  }

  box.innerHTML='';
  const months=new Map();

  entries.sort((a,b)=>b.date.localeCompare(a.date)).forEach(entry=>{
    const month=String(entry.date||'').slice(0,7);
    if(!/^\d{4}-\d{2}$/.test(month))return;
    if(!months.has(month))months.set(month,[]);
    months.get(month).push(entry);
  });

  months.forEach((monthEntries,month)=>{
    const monthCard=document.createElement('section');
    monthCard.className='history-month-item';

    const monthHead=document.createElement('button');
    monthHead.type='button';
    monthHead.className='history-head history-month-head';
    monthHead.setAttribute('aria-expanded','false');

    const monthParts=month.split('-');
    const monthLabel=monthParts[0]+'年'+monthParts[1]+'月';
    const monthStats=monthEntries.reduce((acc,entry)=>{
      dedupeDateRecords(entry.records).forEach(item=>{
        const orders=Array.isArray(item?.orders)?item.orders:[];
        const storeCount=Number(item?.uniqueStoreCount)||Number(item?.count)||orders.length;
        acc.stores+=storeCount;
        const raw=item?.totalWeight??item?.weight??0;
        const text=String(raw).trim().replace(/,/g,'');
        const match=text.match(/\d+(?:\.\d+)?/);
        const value=match?Number(match[0]):0;
        acc.weight+=/kg|千克|公斤/i.test(text)?value/1000:value;
      });
      return acc;
    },{stores:0,weight:0});

    const displayWeight=Math.trunc((monthStats.weight+Number.EPSILON)*100)/100;
    monthHead.innerHTML='<span class="history-date">'+escapeHtml(monthLabel)+'</span><span class="history-month-summary">'+monthStats.stores+'家 · '+displayWeight.toFixed(2)+'t</span><span class="history-chevron" aria-hidden="true"></span>';
    monthCard.appendChild(monthHead);

    const days=document.createElement('div');
    days.className='history-month-days';
    days.hidden=true;
    monthCard.appendChild(days);

    const renderDays=()=>{
      days.innerHTML='';
      monthEntries.sort((a,b)=>b.date.localeCompare(a.date)).forEach(entry=>{
        const dayCard=document.createElement('div');
        dayCard.className='history-date-item history-day-item';

        const dayHead=document.createElement('button');
        dayHead.type='button';
        dayHead.className='history-head history-day-head';
        dayHead.setAttribute('aria-expanded','false');
        const day=String(entry.date).slice(8,10);
        const dayCount=dedupeDateRecords(entry.records).length;
        dayHead.innerHTML='<span class="history-date">'+escapeHtml(monthParts[1]+'月'+day+'日')+'</span><span class="history-day-meta"><span class="history-count">'+dayCount+'笔</span><span class="history-chevron" aria-hidden="true"></span></span>';
        dayCard.appendChild(dayHead);

        const list=document.createElement('div');
        list.className='history-records';
        list.hidden=true;
        dayCard.appendChild(list);

        dayHead.addEventListener('click',()=>{
          const expanded=dayHead.getAttribute('aria-expanded')==='true';
          if(expanded){
            dayHead.setAttribute('aria-expanded','false');
            list.hidden=true;
            return;
          }
          days.querySelectorAll('.history-day-head[aria-expanded="true"]').forEach(openHead=>{
            openHead.setAttribute('aria-expanded','false');
            const openList=openHead.parentElement?.querySelector('.history-records');
            if(openList)openList.hidden=true;
          });
          dayHead.setAttribute('aria-expanded','true');
          list.hidden=false;
          renderDateRecords(entry.records,list,null,entry.date);
        });

        days.appendChild(dayCard);
      });
    };

    monthHead.addEventListener('click',()=>{
      const expanded=monthHead.getAttribute('aria-expanded')==='true';
      if(expanded){
        monthHead.setAttribute('aria-expanded','false');
        days.hidden=true;
        return;
      }
      box.querySelectorAll('.history-month-head[aria-expanded="true"]').forEach(openHead=>{
        openHead.setAttribute('aria-expanded','false');
        const openDays=openHead.parentElement?.querySelector('.history-month-days');
        if(openDays)openDays.hidden=true;
      });
      monthHead.setAttribute('aria-expanded','true');
      days.hidden=false;
      if(!days.childElementCount)renderDays();
    });

    box.appendChild(monthCard);
  });
}

function historySignature(item){const batch=String(item?.orderBatchId||'').trim();if(batch)return `batch:${batch}`;const vehicle=String(item?.vehicle||'').trim().toLowerCase(),weight=String(item?.totalWeight??item?.weight??'').trim(),orders=Array.isArray(item?.orders)?item.orders.map(order=>{const storeId=String(order?.storeId||order?.baseCode||'').trim();const name=String(order?.name||order?.storeName||order?.shopName||order?.['门店名称']||'').trim().replace(/[\\s\\u3000（）()【】\\[\\]]/g,'').toLowerCase();return{identity:storeId?'id:'+storeId:(name?'name:'+name:''),weight:Number(order?.weight)||0}}).filter(order=>order.identity).sort((a,b)=>String(a.identity+'|'+a.weight).localeCompare(String(b.identity+'|'+b.weight))):[];return JSON.stringify({vehicle,weight,orders})}
  function dedupeDateRecords(records){const map=new Map();records.forEach(item=>{const signature=historySignature(item);if(signature&&!map.has(signature))map.set(signature,item)});return [...map.values()]}
  async function deleteRecord(date,item,button){
    if(!item?.orderBatchId)return;
    button.disabled=true;button.classList.add('deleting');
    try{
      const route=await validateDispatchRoute();
      const r=await fetch('/api/v3/history?date='+encodeURIComponent(date)+'&route='+encodeURIComponent(route)+'&taskId='+encodeURIComponent(item.orderBatchId),{method:'DELETE',cache:'no-store',headers:authHeaders(),credentials:'same-origin'});
      const payload=await r.json().catch(()=>({}));
      if(!r.ok||payload?.success!==true)throw new Error(payload?.error||'删除失败');
      try{localStorage.removeItem(historyCacheKey(route))}catch(_){}
      // 删除完成后统一返回历史首页，避免把删除结果停留在某个日期的空状态页。
      historyView='home';
      await refreshHistoryDates();
    }catch(e){console.error(e);OneModal.notice(e.message||'删除失败',{title:'删除失败'});button.disabled=false;button.classList.remove('deleting')}
  }
  function closeSwipeRows(except){document.querySelectorAll('.history-swipe-row.open').forEach(row=>{if(row!==except){row.classList.remove('open');const surface=row.querySelector('.history-swipe-surface');if(surface)surface.style.transform='translateX(0)'}})}
function bindSwipeRow(row,surface,date,item){
  let startX=0,startY=0,dragging=false,moved=false;
  const actionWidth=144;
  const reset=()=>{dragging=false;moved=false;surface.style.transition='transform .18s ease';surface.style.transform=row.classList.contains('open')?'translateX(-144px)':'translateX(0)'};
  surface.addEventListener('pointerdown',event=>{if(event.pointerType==='mouse'&&event.button!==0)return;startX=event.clientX;startY=event.clientY;dragging=true;moved=false;surface.style.transition='none';closeSwipeRows(row);surface.setPointerCapture?.(event.pointerId)});
  surface.addEventListener('pointermove',event=>{
    if(!dragging)return;
    const dx=event.clientX-startX,dy=event.clientY-startY;
    if(!moved&&Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>6){dragging=false;surface.style.transition='';return;}
    if(Math.abs(dx)<4)return;
    moved=true;
    const base=row.classList.contains('open')?-actionWidth:0;
    const next=Math.max(-actionWidth,Math.min(0,base+dx));
    surface.style.transform='translateX('+next+'px)';
  });
  const end=event=>{
    if(!dragging)return;
    const dx=event.clientX-startX;
    dragging=false;
    if(moved&&dx<-42){row.classList.add('open');surface.style.transition='transform .18s ease';surface.style.transform='translateX(-144px)';}
    else if(moved&&dx>42){row.classList.remove('open');surface.style.transition='transform .18s ease';surface.style.transform='translateX(0)';}
    else reset();
    if(moved)event.preventDefault();
  };
  ['pointerup','pointercancel','lostpointercapture'].forEach(type=>surface.addEventListener(type,end));
  surface.addEventListener('click',event=>{if(moved){event.preventDefault();event.stopPropagation();moved=false;return}openRecord(date,item)});
}
function bindRecordActions(row,date,item){
  row.querySelector('.history-edit')?.addEventListener('click',event=>{event.stopPropagation();closeSwipeRows();openCorrectionRecord(date,item)});
  row.querySelector('.history-delete')?.addEventListener('click',event=>{event.stopPropagation();closeSwipeRows();pendingDelete={date,item,button:row.querySelector('.history-view')};const modal=$('deleteModal');modal?.classList.add('active');modal?.setAttribute('aria-hidden','false')});
}
function openRecord(date,item){
  if(!item?.orderBatchId){OneModal.notice('该记录缺少运单批次，无法打开运单详情',{title:'无法打开记录'});return}
  const route=String(item?.route||Auth.getDispatchRoute?.()||'').trim();
  window.location.href='order_detail.html?mode=history&date='+encodeURIComponent(date)+'&route='+encodeURIComponent(route)+'&orderBatchId='+encodeURIComponent(item.orderBatchId);
}

  function renderDateRecords(records,list,countEl,date){
  list.innerHTML='';
  const uniqueRecords=dedupeDateRecords(records);
  if(countEl)countEl.textContent=uniqueRecords.length+'笔';
  if(!uniqueRecords.length){list.innerHTML='<div class="empty-tip">暂无记录</div>';return}
  uniqueRecords.forEach((item,index)=>{
    const row=document.createElement('div');row.className='history-swipe-row';
    const surface=document.createElement('div');surface.className='history-swipe-surface';
    const button=document.createElement('button');button.type='button';button.className='history-view';
    const summary=recordSummary(item);
    button.innerHTML='<span>第'+(index+1)+'笔</span><span class="history-summary">'+summary.count+'家</span><span class="history-weight">'+summary.weight+'t</span>';
    surface.appendChild(button);
    const actions=document.createElement('div');actions.className='history-swipe-actions';
    const edit=document.createElement('button');edit.type='button';edit.className='history-action history-edit';edit.setAttribute('aria-label','查看修正详情');edit.title='查看修正详情';edit.textContent='查看';
    const del=document.createElement('button');del.type='button';del.className='history-action history-delete';del.textContent='删除';
    actions.append(edit,del);row.append(actions,surface);list.appendChild(row);
    bindSwipeRow(row,surface,date,item);bindRecordActions(row,date,item);
  });
}
  async function openDateHistory(date){historyView='date';const box=$('historyList');box.innerHTML='<div class="empty-tip"><span class="z-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg></span>正在读取记录...</div>';try{const records=await requestHistory(date);if(!records.length){box.innerHTML='<div class="empty-tip"><span class=\"z-icon\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\"><rect x=\"4\" y=\"6\" width=\"16\" height=\"13\" rx=\"2\"/><path d=\"m7 10 3 3 2-2 5 5\"/></svg></span>'+escapeHtml(date)+' 暂无配送记录</div>';return}renderDates([{date,records}]);const head=box.querySelector('.history-head');head?.click()}catch(e){console.error(e);box.innerHTML='<div class="empty-tip">🌐 '+escapeHtml(e.message)+'<br><small>请联网后重试</small></div>'}}
function openCorrectionRecord(date,item){
  if(!item?.orderBatchId){OneModal.notice('该记录缺少运单批次，无法打开修正详情',{title:'无法打开记录'});return}
  const route=String(item?.route||Auth.getDispatchRoute?.()||'').trim();
  window.location.href='correction_detail.html?date='+encodeURIComponent(date)+'&route='+encodeURIComponent(route)+'&orderBatchId='+encodeURIComponent(item.orderBatchId);
}
function goBack(){closeDatePicker();location.replace('../home.html')}
  $('datePickerBtn')?.addEventListener('click',openDatePicker);
  function closeDeleteConfirm(){pendingDelete=null;$('deleteModal')?.classList.remove('active');$('deleteModal')?.setAttribute('aria-hidden','true')}
  $('cancelDelete')?.addEventListener('click',closeDeleteConfirm);
  $('deleteModal')?.addEventListener('click',e=>{if(e.target===$('deleteModal'))closeDeleteConfirm()});
  $('confirmDelete')?.addEventListener('click',async()=>{const p=pendingDelete;if(!p)return;closeDeleteConfirm();await deleteRecord(p.date,p.item,p.button)});$('cancelDate')?.addEventListener('click',closeDatePicker);$('confirmDate')?.addEventListener('click',confirmDate);$('dateModal')?.addEventListener('click',e=>{if(e.target===$('dateModal'))closeDatePicker()});
  ['yearWheel','monthWheel','dayWheel'].forEach(id=>$(id)?.addEventListener('scroll',()=>{const box=$(id);clearTimeout(box._timer);box._timer=setTimeout(()=>{const y=wheelValue('yearWheel'),m=wheelValue('monthWheel'),d=wheelValue('dayWheel');if(id==='yearWheel'||id==='monthWheel')buildWheel('dayWheel',1,daysInMonth(y,m),Math.min(d,daysInMonth(y,m)),'day')},90)}));
  let historyInitialized=false;
  async function initHistory(force=false){
    historyView='home';
    if(historyInitialized&&!force)return;
    historyInitialized=true;
    try{
      closeDatePicker();
      if(!(await Auth.checkAuth())){historyInitialized=false;return}
      await loadHistoryDates({force});
    }catch(e){
      historyInitialized=false;
      const box=$('historyList');
      if(box)box.innerHTML='<div class="empty-tip">'+escapeHtml(e?.message||'历史记录读取失败')+'<br><small>请返回首页重新选择有效线路</small></div>';
      console.error(e);
    }
  }
  document.addEventListener('DOMContentLoaded',()=>initHistory(false));
  window.addEventListener('pageshow',event=>{
    if(event.persisted){
      initHistory(false);
      return;
    }
    // 普通返回历史页不重复整页加载；仅当缓存超过新鲜窗口时静默更新。
    const route=String(Auth.getDispatchRoute?Auth.getDispatchRoute():'').trim();
    const cached=route?readHistoryCache(route):null;
    if(cached&&Date.now()-cached.savedAt>=HISTORY_CACHE_FRESH_MS)refreshHistoryDates().catch(error=>console.warn('历史返回刷新失败',error));
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDatePicker();closeDeleteConfirm()}});
  window.addEventListener('pagehide',()=>{closeDatePicker();closeDeleteConfirm()});
  function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  </script>
</body>
</html>
