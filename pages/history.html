<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05070A">
  <title>历史查询 · Zhipei One</title>
  <link rel="stylesheet" href="../css/order.css?v=20260920-2">
  <link rel="stylesheet" href="../css/history.css?v=20260921-1">
</head>
<body>
  <div class="app-container history-page">
    <header class="top-bar">
      <button class="back-btn" type="button" aria-label="返回">←</button>
      <div class="app-title">历史查询</div>
      <div class="top-placeholder" aria-hidden="true"></div>
    </header>
    <section class="task-card history-filter-card">
      <button class="date-picker-btn" id="datePickerBtn" type="button">选择日期</button>
    </section>
    <section class="task-card history-record-card">
      <div class="route-title">📋 配送记录</div>
      <div class="history-scroll" id="historyList"><div class="empty-tip">⏳ 加载中...</div></div>
    </section>
  </div>
  <div class="date-modal" id="dateModal" aria-hidden="true">
    <div class="date-sheet" role="dialog" aria-modal="true" aria-label="选择日期">
      <div class="date-sheet-head"><button type="button" id="cancelDate">取消</button><strong>选择日期</strong><button type="button" id="confirmDate">确定</button></div>
      <div class="wheel-wrap"><div class="wheel" id="yearWheel"></div><div class="wheel" id="monthWheel"></div><div class="wheel" id="dayWheel"></div></div>
      <div class="wheel-highlight" aria-hidden="true"></div>
      <div class="wheel-labels"><span>年</span><span>月</span><span>日</span></div>
    </div>
  </div>
  <script src="../js/auth.js?v=20260917-3"></script>
  <script>
  'use strict';
  let selected='', historyLoading=false;
  const $=id=>document.getElementById(id), pad=v=>String(v).padStart(2,'0');
  const authHeaders=()=>Auth.getAuthHeaders?Auth.getAuthHeaders():{};
  function shanghaiParts(date=new Date()){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);const get=t=>Number(parts.find(p=>p.type===t)?.value||0);return [get('year'),get('month'),get('day')]}
  function today(){return shanghaiParts()}
  function daysInMonth(y,m){return new Date(Number(y),Number(m),0).getDate()}
  function dateFromOffset(offset){const [y,m,d]=shanghaiParts();return new Date(Date.UTC(y,m-1,d-offset,12)).toISOString().slice(0,10)}
  function buildWheel(id,min,max,value,label){const box=$(id);box.innerHTML='';for(let n=min;n<=max;n++){const item=document.createElement('button');item.type='button';item.className='wheel-item';item.dataset.value=String(n);item.textContent=label==='year'?String(n):pad(n);item.addEventListener('click',()=>snapWheel(box,n));box.appendChild(item)}requestAnimationFrame(()=>snapWheel(box,value,false))}
  function snapWheel(box,value,smooth=true){const item=box.querySelector(`[data-value="${value}"]`);if(!item)return;box.scrollTo({top:Math.max(0,item.offsetTop-(box.clientHeight-item.offsetHeight)/2),behavior:smooth?'smooth':'auto'});setActive(box,item)}
  function setActive(box,item){box.querySelectorAll('.wheel-item').forEach(el=>el.classList.toggle('active',el===item))}
  function wheelValue(id){const box=$(id),items=[...box.querySelectorAll('.wheel-item')];if(!items.length)return 0;const center=box.scrollTop+box.clientHeight/2;let best=items[0],distance=Infinity;items.forEach(item=>{const d=Math.abs(item.offsetTop+item.offsetHeight/2-center);if(d<distance){distance=d;best=item}});setActive(box,best);return Number(best.dataset.value)}
  function openDatePicker(){const now=selected?selected.split('-').map(Number):today(), [y,m,d]=now;buildWheel('yearWheel',2020,2035,y,'year');buildWheel('monthWheel',1,12,m,'month');buildWheel('dayWheel',1,daysInMonth(y,m),Math.min(d,daysInMonth(y,m)),'day');$('dateModal').classList.add('active');$('dateModal').setAttribute('aria-hidden','false')}
  function closeDatePicker(){$('dateModal').classList.remove('active');$('dateModal').setAttribute('aria-hidden','true')}
  function confirmDate(){const y=wheelValue('yearWheel'),m=wheelValue('monthWheel'),d=Math.min(wheelValue('dayWheel'),daysInMonth(y,m));selected=`${y}-${pad(m)}-${pad(d)}`;closeDatePicker();openDateHistory(selected)}
  async function requestHistory(date){const r=await fetch(`/api/history?date=${encodeURIComponent(date)}`,{cache:'no-store',headers:authHeaders(),credentials:'same-origin'});if(!r.ok)throw new Error(r.status===401?'登录已失效，请重新登录':`历史数据读取失败（${r.status}）`);const payload=await r.json();return Array.isArray(payload?.data)?payload.data:(Array.isArray(payload)?payload:[])}
  async function loadHistoryDates(){if(historyLoading)return;historyLoading=true;const box=$('historyList');box.innerHTML='<div class="empty-tip">⏳ 正在读取历史记录...</div>';try{const dates=Array.from({length:32},(_,i)=>dateFromOffset(i-1));const results=await Promise.all(dates.map(async date=>{try{const records=await requestHistory(date);return records.length?{date,records}:null}catch(error){if(error.message.includes('登录已失效'))throw error;return null}}));renderDates(results.filter(Boolean))}catch(e){console.error(e);box.innerHTML=`<div class="empty-tip">🌐 ${escapeHtml(e.message)}<br><small>请联网后重试</small></div>`}finally{historyLoading=false}}
  function recordSummary(item){const count=Number(item?.uniqueStoreCount)||Number(item?.count)||(Array.isArray(item?.orders)?item.orders.length:0);const source=String(item?.totalWeight??item?.weight??'').trim().replace(/,/g,'');const match=source.match(/[\\d]+(?:\\.\\d+)?/);const value=match?Number(match[0]):NaN;let kg=NaN;if(Number.isFinite(value)){if(/kg|千克|公斤/i.test(source))kg=value;else if(/吨|\\bt\\b/i.test(source))kg=value*1000;else kg=value>=1000?value:value*1000}const weight=Number.isFinite(kg)?(Math.round((kg+Number.EPSILON)*100)/100).toFixed(2):'0.00';return {count,weight}}
  function renderDates(entries){const box=$('historyList');if(!entries.length){box.innerHTML='<div class="empty-tip">📭 暂无配送记录</div>';return}box.innerHTML='';entries.sort((a,b)=>b.date.localeCompare(a.date)).forEach(entry=>{const card=document.createElement('div');card.className='history-date-item';const head=document.createElement('button');head.type='button';head.className='history-head';head.setAttribute('aria-expanded','false');head.innerHTML='<span class="history-date">'+escapeHtml(entry.date)+'</span><span class="history-count">'+dedupeDateRecords(entry.records).length+'笔</span>';card.appendChild(head);const list=document.createElement('div');list.className='history-records';list.hidden=true;card.appendChild(list);head.addEventListener('click',()=>{const expanded=head.getAttribute('aria-expanded')==='true';if(expanded){head.setAttribute('aria-expanded','false');list.hidden=true;return}box.querySelectorAll('.history-head[aria-expanded="true"]').forEach(openHead=>{openHead.setAttribute('aria-expanded','false');const openList=openHead.parentElement?.querySelector('.history-records');if(openList)openList.hidden=true});head.setAttribute('aria-expanded','true');list.hidden=false;renderDateRecords(entry.records,list,head.querySelector('.history-count'),entry.date)});box.appendChild(card)})}
function historySignature(item){const vehicle=String(item?.vehicle||'').trim().toLowerCase(),weight=String(item?.totalWeight??item?.weight??'').trim(),orders=Array.isArray(item?.orders)?item.orders.map(order=>({name:String(order?.name||order?.storeName||order?.shopName||order?.['门店名称']||'').trim().replace(/[\\s\\u3000（）()【】\\[\\]]/g,'').toLowerCase(),weight:Number(order?.weight)||0})).filter(order=>order.name).sort((a,b)=>String(a.name+'|'+a.weight).localeCompare(String(b.name+'|'+b.weight))):[];return JSON.stringify({vehicle,weight,orders})}
  function dedupeDateRecords(records){const map=new Map();records.forEach(item=>{const signature=historySignature(item);if(signature&&!map.has(signature))map.set(signature,item)});return [...map.values()]}
  async function deleteRecord(date,item,button){if(!item?.orderBatchId)return;button.disabled=true;button.classList.add('deleting');try{const r=await fetch('/api/history?date='+encodeURIComponent(date)+'&orderBatchId='+encodeURIComponent(item.orderBatchId),{method:'DELETE',cache:'no-store',headers:authHeaders(),credentials:'same-origin'});const payload=await r.json().catch(()=>({}));if(!r.ok||payload?.success!==true)throw new Error(payload?.error||'删除失败');const records=await requestHistory(date);const list=button.parentElement,headCount=list?.previousElementSibling?.querySelector('.history-count');renderDateRecords(records,list,headCount,date)}catch(e){console.error(e);alert(e.message||'删除失败');button.disabled=false;button.classList.remove('deleting')}}
  function bindLongPress(button,date,item){let timer=0,longPressed=false;const start=()=>{if(button.disabled)return;longPressed=false;timer=window.setTimeout(()=>{timer=0;longPressed=true;if(confirm('确定删除这条配送记录？删除后不可恢复。'))deleteRecord(date,item,button)},700)};const cancel=()=>{if(timer){clearTimeout(timer);timer=0}};button.addEventListener('pointerdown',start);['pointerup','pointercancel','pointerleave'].forEach(type=>button.addEventListener(type,cancel));button.addEventListener('click',event=>{if(longPressed){event.preventDefault();event.stopPropagation();longPressed=false;return}openRecord(date,item)})}
  function renderDateRecords(records,list,countEl,date){list.innerHTML='';const uniqueRecords=dedupeDateRecords(records);if(countEl)countEl.textContent=uniqueRecords.length+'笔';if(!uniqueRecords.length){list.innerHTML='<div class="empty-tip">暂无记录</div>';return}uniqueRecords.forEach((item,index)=>{const button=document.createElement('button');button.type='button';button.className='history-view';const summary=recordSummary(item);button.innerHTML='<span>第'+(index+1)+'笔</span><span class="history-summary">'+summary.count+'家</span><span class="history-weight">'+summary.weight+'kg</span><span class="history-arrow" aria-hidden="true">→</span>';bindLongPress(button,date,item);list.appendChild(button)})}
  async function openDateHistory(date){const box=$('historyList');box.innerHTML='<div class="empty-tip">⏳ 正在读取记录...</div>';try{const records=await requestHistory(date);if(!records.length){box.innerHTML='<div class="empty-tip">📭 '+escapeHtml(date)+' 暂无配送记录</div>';return}renderDates([{date,records}]);const head=box.querySelector('.history-head');head?.click()}catch(e){console.error(e);box.innerHTML='<div class="empty-tip">🌐 '+escapeHtml(e.message)+'<br><small>请联网后重试</small></div>'}}
function openRecord(date,item){if(!item?.orderBatchId){alert('该记录缺少运单批次，无法打开详情');return}window.location.href='order_detail.html?mode=history&date='+encodeURIComponent(date)+'&orderBatchId='+encodeURIComponent(item.orderBatchId)}
  function goBack(){closeDatePicker();location.href='../home.html'}
  $('datePickerBtn')?.addEventListener('click',openDatePicker);$('cancelDate')?.addEventListener('click',closeDatePicker);$('confirmDate')?.addEventListener('click',confirmDate);$('dateModal')?.addEventListener('click',e=>{if(e.target===$('dateModal'))closeDatePicker()});
  ['yearWheel','monthWheel','dayWheel'].forEach(id=>$(id)?.addEventListener('scroll',()=>{const box=$(id);clearTimeout(box._timer);box._timer=setTimeout(()=>{const y=wheelValue('yearWheel'),m=wheelValue('monthWheel'),d=wheelValue('dayWheel');if(id==='yearWheel'||id==='monthWheel')buildWheel('dayWheel',1,daysInMonth(y,m),Math.min(d,daysInMonth(y,m)),'day')},90)}));
  let historyInitialized=false;
  async function initHistory(force=false){if(historyInitialized&&!force)return;historyInitialized=true;try{closeDatePicker();if(!(await Auth.checkAuth())){historyInitialized=false;return}await loadHistoryDates()}catch(e){historyInitialized=false;console.error(e)}}
  document.addEventListener('DOMContentLoaded',()=>initHistory(false));
  window.addEventListener('pageshow',event=>{if(event.persisted)initHistory(true)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDatePicker()});
  window.addEventListener('pagehide',closeDatePicker);
  function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  </script>
</body>
</html>
