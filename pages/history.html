<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>历史查询</title>
  <link rel="stylesheet" href="../css/order.css">
  <link rel="stylesheet" href="../css/history.css">
</head>
<body>
  <div class="app-container history-page">
    <header class="top-bar">
      <button class="back-btn" onclick="goBack()" aria-label="返回">←</button>
      <div class="app-title">历史查询</div>
      <div class="top-placeholder" aria-hidden="true"></div>
    </header>

    <section class="task-card history-filter-card">
      <button class="date-picker-btn" id="datePickerBtn" type="button">选择日期</button>
    </section>

    <section class="task-card history-record-card">
      <div class="route-title">📋 配送记录</div>
      <div class="history-scroll" id="historyList"><div class="empty-tip">⏳ 加载中...</div></div>
    </section>
  </div>

  <div class="date-modal" id="dateModal" aria-hidden="true">
    <div class="date-sheet" role="dialog" aria-modal="true" aria-label="选择日期">
      <div class="date-sheet-head">
        <button type="button" id="cancelDate">取消</button>
        <strong>选择日期</strong>
        <button type="button" id="confirmDate">确定</button>
      </div>
      <div class="wheel-wrap">
        <div class="wheel" id="yearWheel"></div>
        <div class="wheel" id="monthWheel"></div>
        <div class="wheel" id="dayWheel"></div>
      </div>
      <div class="wheel-highlight" aria-hidden="true"></div>
      <div class="wheel-labels"><span>年</span><span>月</span><span>日</span></div>
    </div>
  </div>

<script src="../js/auth.js"></script>
<script>
'use strict';
let historyDates=[], selected='';
const $=id=>document.getElementById(id), pad=v=>String(v).padStart(2,'0');
function today(){const d=new Date();return [d.getFullYear(),d.getMonth()+1,d.getDate()]}
function daysInMonth(y,m){return new Date(Number(y),Number(m),0).getDate()}
function buildWheel(id,min,max,value,label){const box=$(id);box.innerHTML='';for(let n=min;n<=max;n++){const item=document.createElement('button');item.type='button';item.className='wheel-item';item.dataset.value=String(n);item.textContent=label==='year'?String(n):pad(n);item.addEventListener('click',()=>snapWheel(box,n));box.appendChild(item)}requestAnimationFrame(()=>snapWheel(box,value,false))}
function snapWheel(box,value,smooth=true){const item=box.querySelector(`[data-value="${value}"]`);if(!item)return;const top=item.offsetTop-(box.clientHeight-item.offsetHeight)/2;box.scrollTo({top:Math.max(0,top),behavior:smooth?'smooth':'auto'});setActive(box,item)}
function setActive(box,item){box.querySelectorAll('.wheel-item').forEach(el=>el.classList.toggle('active',el===item))}
function wheelValue(id){const box=$(id),items=[...box.querySelectorAll('.wheel-item')];if(!items.length)return 0;const center=box.scrollTop+box.clientHeight/2;let best=items[0],distance=Infinity;items.forEach(item=>{const d=Math.abs(item.offsetTop+item.offsetHeight/2-center);if(d<distance){distance=d;best=item}});setActive(box,best);return Number(best.dataset.value)}
function openDatePicker(){const now=selected?selected.split('-').map(Number):today();const [y,m,d]=now;buildWheel('yearWheel',2020,2035,y,'year');buildWheel('monthWheel',1,12,m,'month');buildWheel('dayWheel',1,daysInMonth(y,m),Math.min(d,daysInMonth(y,m)),'day');$('dateModal').classList.add('active');$('dateModal').setAttribute('aria-hidden','false')}
function closeDatePicker(){$('dateModal').classList.remove('active');$('dateModal').setAttribute('aria-hidden','true')}
function confirmDate(){const y=wheelValue('yearWheel'),m=wheelValue('monthWheel'),d=Math.min(wheelValue('dayWheel'),daysInMonth(y,m));selected=`${y}-${pad(m)}-${pad(d)}`;closeDatePicker();loadHistory(selected,true)}
async function loadHistory(date='',showSelected=false){const box=$('historyList');box.innerHTML='<div class="empty-tip">⏳ 加载中...</div>';try{const query=date?`?date=${encodeURIComponent(date)}`:'';const r=await fetch(`/api/history${query}`,{cache:'no-store',headers:Auth.getAuthHeaders?Auth.getAuthHeaders():{},credentials:'same-origin'});if(!r.ok)throw new Error(r.status===401?'登录已失效，请重新登录':`历史数据读取失败（${r.status}）`);const payload=await r.json();if(date){if(showSelected)renderSelectedRecords(date,payload);else renderSelectedRecords(date,payload);return}historyDates=Array.isArray(payload?.data)?payload.data:(Array.isArray(payload)?payload:[]);renderDates(historyDates)}catch(e){console.error(e);box.innerHTML=`<div class="empty-tip">🌐 ${escapeHtml(e.message)}<br><small>请联网后重试</small></div>`}}
function renderDates(dates){const box=$('historyList');if(!dates.length){box.innerHTML='<div class="empty-tip">📭 暂无配送记录</div>';return}box.innerHTML='';dates.forEach((date,i)=>{const card=document.createElement('div');card.className='history-date-item';card.innerHTML=`<div class="history-head"><div class="history-date">${escapeHtml(date)}</div><button class="history-view" type="button">查看记录 →</button></div>`;card.querySelector('.history-view').addEventListener('click',()=>openDateHistory(date));box.appendChild(card)})}
async function openDateHistory(date){selected=date;await loadHistory(date,true)}
function renderSelectedRecords(date,payload){const records=Array.isArray(payload?.data)?payload.data:(Array.isArray(payload)?payload:[]);if(!records.length){$('historyList').innerHTML=`<div class="empty-tip">📭 ${escapeHtml(date)} 暂无配送记录</div>`;return}const item=records[0];if(!item?.orderBatchId){$('historyList').innerHTML='<div class="empty-tip">该日期记录缺少运单批次，无法打开详情</div>';return}const batch=encodeURIComponent(item.orderBatchId);window.location.href=`order_detail.html?mode=history&date=${encodeURIComponent(date)}&orderBatchId=${batch}`}
function goBack(){closeDatePicker();location.href='../home.html'}
$('datePickerBtn')?.addEventListener('click',openDatePicker);$('cancelDate')?.addEventListener('click',closeDatePicker);$('confirmDate')?.addEventListener('click',confirmDate);$('dateModal')?.addEventListener('click',e=>{if(e.target===$('dateModal'))closeDatePicker()});
['yearWheel','monthWheel','dayWheel'].forEach(id=>$(id)?.addEventListener('scroll',()=>{const box=$(id);clearTimeout(box._timer);box._timer=setTimeout(()=>{const y=wheelValue('yearWheel'),m=wheelValue('monthWheel'),d=wheelValue('dayWheel');if(id==='yearWheel'||id==='monthWheel')buildWheel('dayWheel',1,daysInMonth(y,m),Math.min(d,daysInMonth(y,m)),'day')},90)}));
document.addEventListener('DOMContentLoaded',async()=>{try{closeDatePicker();if(!(await Auth.checkAuth()))return;await loadHistory()}catch(e){console.error(e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDatePicker()});
window.addEventListener('pagehide',closeDatePicker);window.addEventListener('pageshow',closeDatePicker);
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script>
</body>
</html>
