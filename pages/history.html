<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史查询</title>
  <link rel="stylesheet" href="../css/order.css">
</head>
<body>
  <div class="app-container">
    <header class="top-bar"><button class="back-btn" onclick="goBack()">←</button><div class="app-title">历史查询</div><div style="width:40px;"></div></header>
    <section class="task-card">
      <div class="date-picker-title">选择日期</div>
      <div class="date-picker"><select id="yearSelect"></select><select id="monthSelect"></select><select id="daySelect"></select></div>
      <button class="query-btn" id="queryBtn">查询配送记录</button>
    </section>
    <section class="task-card"><div class="route-title">📋 配送记录</div><div class="history-scroll" id="historyList"><div class="empty-tip">请选择日期并点击查询</div></div></section>
  </div>
<script src="../js/auth.js"></script>
<script>
'use strict';
let historyData=[];
const $=id=>document.getElementById(id);
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')]}
function daysInMonth(y,m){return new Date(Number(y),Number(m),0).getDate()}
function fill(y,m,d){$('yearSelect').innerHTML='';for(let i=y-5;i<=y+1;i++)$('yearSelect').add(new Option(i+'年',i,i===y,i===y));$('monthSelect').innerHTML='';for(let i=1;i<=12;i++)$('monthSelect').add(new Option(i+'月',String(i).padStart(2,'0'),i===m,i===m));fillDays(y,m,d)}
function fillDays(y,m,d){$('daySelect').innerHTML='';const max=daysInMonth(y,m);const selected=Math.min(Number(d),max);for(let i=1;i<=max;i++)$('daySelect').add(new Option(i+'日',String(i).padStart(2,'0'),i===selected,i===selected))}
function selectedDate(){return `${$('yearSelect').value}-${$('monthSelect').value}-${$('daySelect').value}`}
$('monthSelect')?.addEventListener('change',()=>fillDays($('yearSelect').value,$('monthSelect').value,$('daySelect').value));
$('yearSelect')?.addEventListener('change',()=>fillDays($('yearSelect').value,$('monthSelect').value,$('daySelect').value));
$('queryBtn')?.addEventListener('click',()=>loadHistory(selectedDate()));
async function loadHistory(date){
  const box=$('historyList');box.innerHTML='<div class="empty-tip">⏳ 加载中...</div>';
  try{
    const r=await fetch(`/api/history?date=${encodeURIComponent(date)}`,{cache:'no-store',headers:Auth.getAuthHeaders?Auth.getAuthHeaders():{}});
    if(!r.ok) throw new Error(r.status===401?'登录已失效，请重新登录':`历史数据读取失败（${r.status}）`);
    const payload=await r.json();
    const records=Array.isArray(payload?.data)?payload.data:(Array.isArray(payload)?payload:[]);
    historyData=records;
    render(records);
  }catch(e){console.error(e);box.innerHTML=`<div class="empty-tip">🌐 ${escapeHtml(e.message)}<br><small>请联网后重试</small></div>`}
}
function render(records){const box=$('historyList');if(!records.length){box.innerHTML='<div class="empty-tip">📭 暂无配送记录</div>';return}box.innerHTML='';records.forEach((item,i)=>{const card=document.createElement('div');card.className='history-item';const count=item.count??item.orders?.length??0;card.innerHTML=`<div class="history-date">📅 ${escapeHtml(item.date||'未知日期')}</div><div class="info-row"><span>线路</span><b>${escapeHtml(item.route||'')}</b></div><div class="info-row"><span>车辆</span><b>🚚 ${escapeHtml(item.vehicle||'未设置')}</b></div><div class="info-row"><span>配送</span><b>${count} 家门店</b></div><div class="info-row"><span>总重量</span><b>${escapeHtml(formatWeight(item.weight))}</b></div><div class="info-row"><span>批次</span><b>${escapeHtml(item.orderBatchId||'—')}</b></div><button class="history-btn" data-index="${i}">查看路线 →</button>`;card.querySelector('button').addEventListener('click',()=>viewHistoryDetail(i));box.appendChild(card)})}
function viewHistoryDetail(i){const item=historyData[i];if(!item?.orderBatchId){alert('该历史记录缺少运单批次，无法打开详情');return}const date=encodeURIComponent(item.date||selectedDate());const batch=encodeURIComponent(item.orderBatchId);window.location.href=`order_detail.html?mode=history&date=${date}&orderBatchId=${batch}`}
function formatWeight(v){if(v===null||v===undefined||v==='')return '0 kg';const s=String(v);if(/[a-zA-Z]/.test(s))return s;return `${s} kg`}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function goBack(){location.href='../home.html'}
document.addEventListener('DOMContentLoaded',()=>{if(!window.Auth||!Auth.checkAuth())return;const [y,m,d]=today();fill(y,Number(m),Number(d));loadHistory(`${y}-${m}-${d}`)})
</script>
<style>
.date-picker-title{text-align:center;color:#B8C2CC;font-size:15px;letter-spacing:2px;margin-bottom:10px}.date-picker{display:flex;gap:10px}.date-picker select{flex:1;height:50px;background:#05070A;color:#fff;border:0;border-radius:12px;font-size:16px;text-align:center}.query-btn,.history-btn{width:100%;height:48px;border:0;border-radius:14px;background:#2457A6;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-top:14px}.history-scroll{max-height:440px;overflow-y:auto}.empty-tip{text-align:center;padding:40px 20px;color:#7F8B98}.history-item{background:#05070A;border-radius:14px;padding:16px 18px;margin-bottom:12px;border:1px solid rgba(255,255,255,.05)}.history-date{font-size:16px;font-weight:bold;margin-bottom:8px;color:#FFB020}.info-row{display:flex;justify-content:space-between;align-items:center;min-height:34px;font-size:14px}.info-row span{color:#7F8B98}.info-row b{color:#fff;font-weight:500}.history-btn{height:40px;font-size:14px;margin-top:10px}
</style>
</body>
</html>
