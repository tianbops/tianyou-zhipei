<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>当日修正详情</title>
  <link rel="stylesheet" href="../css/order.css?v=20260922-18">
  <link rel="stylesheet" href="../css/icons.css?v=20260921-1">
  <style>
    .correction-detail-list{display:flex;flex-direction:column;gap:10px}
    .correction-detail-item{padding:14px 15px;border:1px solid rgba(255,255,255,.055);border-radius:12px;background:#1B2530}
    .correction-detail-code{font-size:12px;color:#75818D;margin-bottom:8px}
    .correction-detail-name{font-size:15px;line-height:23px;word-break:break-all}
    .correction-detail-from{color:#9AA6B2}
    .correction-detail-arrow{height:20px;display:flex;align-items:center;color:#75818D;font-size:13px}
    .correction-detail-to{color:#F2F5F7;font-weight:500}
    .correction-detail-empty{padding:34px 12px;text-align:center;color:#75818D;font-size:14px;line-height:22px}
  </style>
</head>
<body class="order-detail-page">
  <div class="app-container">
    <header class="top-bar">
      <button class="back-btn" type="button" onclick="goBack()" aria-label="返回"><svg class="z-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <div class="app-title">当日修正详情</div>
      <div class="top-placeholder" aria-hidden="true"></div>
    </header>

    <section class="task-card summary-card">
      <div class="date-title" id="correctionDate">加载中...</div>
      <div class="summary-grid">
        <div class="summary-item">
          <span class="label">线路编号</span>
          <span class="value" id="routeName">加载中...</span>
        </div>
        <div class="summary-item">
          <span class="label">修正数量</span>
          <span class="value warning" id="correctionCount">0家</span>
        </div>
        <div class="summary-item">
          <span class="label">运单重量</span>
          <span class="value" id="totalWeight">0t</span>
        </div>
      </div>
    </section>

    <section class="task-card route-card">
      <div class="route-title">修正记录</div>
      <div class="correction-detail-list" id="correctionList">
        <div class="correction-detail-empty">正在读取修正记录...</div>
      </div>
    </section>
  </div>
  <script src="../js/auth.js?v=20260924-6"></script>
  <script src="../js/correction_detail.js?v=20260925-1"></script>
</body>
</html>
