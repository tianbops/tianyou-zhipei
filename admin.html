<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>智配One · 系统管理</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-head">
      <div>
        <div class="eyebrow">天友智配One</div>
        <h1>系统管理</h1>
        <p id="adminUser">正在验证管理员身份…</p>
      </div>
      <button id="backBtn" class="ghost">返回</button>
    </header>

    <section id="notice" class="notice hidden"></section>

    <nav class="tabs" aria-label="管理模块">
      <button class="tab active" data-tab="users">用户管理</button>
      <button class="tab" data-tab="routes">线路管理</button>
      <button class="tab" data-tab="requests">绑定申请</button>
      <button class="tab" data-tab="logs">管理日志</button>
      <button class="tab" data-tab="reset">数据重置</button>
    </nav>

    <section id="usersTab" class="panel">
      <div class="panel-head"><div><h2>用户</h2><span id="userCount">0</span></div><button id="refreshUsers" class="primary">刷新</button></div>
      <div id="userList" class="user-list"></div>
    </section>

    <section id="routesTab" class="panel hidden">
      <div class="panel-head"><div><h2>线路管理</h2><span>创建线路、绑定驾驶员与配送员</span></div><button id="refreshRoutes" class="primary">刷新</button></div>
      <div class="route-create">
        <label>新建线路<input id="newRouteInput" placeholder="例如 17号线" inputmode="numeric" autocomplete="off"></label>
        <button id="createRoute" class="primary" type="button">创建线路</button>
      </div>
      <div class="route-form">
        <label>路线<input id="routeInput" placeholder="例如 17号线"></label>
        <label>驾驶员<select id="driverSelect"></select></label>
        <label>配送员<select id="deliverySelect"></select></label>
        <button id="saveRoute" class="primary">保存绑定</button>
      </div>
      <div id="routeList" class="route-list"></div>
    </section>

    <section id="requestsTab" class="panel hidden">
      <div class="panel-head"><div><h2>绑定申请</h2><span>普通用户提交的线路绑定申请</span></div><button id="refreshRequests" class="primary">刷新</button></div>
      <div id="requestList" class="route-list"></div>
    </section>

    <section id="logsTab" class="panel hidden">
      <div class="panel-head"><div><h2>管理日志</h2><span>系统管理操作记录</span></div><button id="refreshLogs" class="primary">刷新</button></div>
      <div id="logList" class="route-list"></div>
    </section>

    <section id="resetTab" class="panel hidden">
      <div class="reset-card">
        <div class="reset-title">清空智配One业务数据</div>
        <p class="reset-warning">此操作不可恢复。将删除当前 Redis 中的用户、路线、基准库、今日运单、历史记录、学习数据、绑定关系、管理日志及登录关联数据。</p>
        <p class="reset-note">不会修改 GitHub 代码、Cloudflare 环境变量或 Upstash 服务本身。清空后当前管理员账号也会被删除，需要重新注册并重新建立系统管理员。</p>
        <label class="confirm-label">数据重置密钥
          <div class="reset-key-row"><input id="resetKey" type="text" inputmode="text" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="输入或粘贴 Cloudflare 中配置的 DATA_RESET_KEY"><button id="toggleResetKey" type="button" class="key-toggle">隐藏</button></div>
        </label>
        <label class="confirm-label">确认文字
          <input id="resetConfirmation" autocomplete="off" placeholder="输入：确认清空智配One数据">
        </label>
        <button id="resetDataBtn" class="danger-btn">清空全部智配One业务数据</button>
        <div id="resetResult" class="reset-result hidden"></div>
      </div>
    </section>
  </main>
  <script src="js/admin.js"></script>
</body>
</html>
