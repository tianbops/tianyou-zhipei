<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>智配One · 系统管理</title>
  <link rel="stylesheet" href="css/admin.css?v=20260926-5">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-head">
      <div>
        <div class="eyebrow">天友智配One · SYSTEM</div>
        <h1>系统管理</h1>
        <p id="adminUser">正在验证管理员身份…</p>
      </div>
    </header>
    <section id="notice" class="notice hidden"></section>
    <nav class="tabs" aria-label="管理模块">
      <button class="tab active" data-tab="users">用户</button>
      <button class="tab" data-tab="routes">线路</button>
      <button class="tab" data-tab="requests">绑定申请</button>
      <button class="tab" data-tab="invites">邀请码</button>
      <button class="tab" data-tab="logs">日志</button>
      <button class="tab" data-tab="reset">数据重置</button>
    </nav>
    <section id="usersTab" class="panel">
      <div class="panel-head"><div><h2>用户管理</h2><span id="userCount">0 个账号</span></div><button id="refreshUsers" class="ghost">刷新</button></div>
      <div id="userList" class="user-list"></div>
    </section>
    <section id="routesTab" class="panel hidden">
      <div class="panel-head"><div><h2>线路管理</h2><span>线路与驾驶员、配送员配置</span></div><div class="panel-head-actions"><button id="refreshRoutes" class="ghost">刷新</button><button id="showCreateRoute" class="primary">＋ 新建线路</button></div></div>
      <div id="routeCreatePanel" class="route-create hidden">
        <div class="section-label">新建线路</div>
        <label>线路名称<input id="newRouteInput" placeholder="例如 17号线" inputmode="text" autocomplete="off"></label>
        <div class="form-actions"><button id="cancelCreateRoute" class="ghost" type="button">取消</button><button id="createRoute" class="primary" type="button">创建线路</button></div>
      </div>
      <div id="routeList" class="route-list"></div>
    </section>
    <section id="requestsTab" class="panel hidden">
      <div class="panel-head"><div><h2>绑定申请</h2><span>普通用户提交的线路绑定申请</span></div><button id="refreshRequests" class="ghost">刷新</button></div>
      <div id="requestList" class="route-list"></div>
    </section>
    <section id="invitesTab" class="panel hidden">
      <div class="panel-head"><div><h2>邀请码</h2><span>内部注册资格由管理员统一发放</span></div><div class="panel-head-actions"><button id="refreshInvites" class="ghost">刷新</button><button id="showCreateInvite" class="primary">＋ 创建邀请码</button></div></div>
      <div id="inviteCreatePanel" class="invite-create hidden">
        <div class="section-label">创建邀请码</div>
        <label>使用次数<select id="inviteUses"><option value="1">1次</option><option value="5">5次</option><option value="10">10次</option><option value="unlimited">不限</option></select></label>
        <label>有效期<select id="inviteExpiry"><option value="7">7天</option><option value="30" selected>30天</option><option value="90">90天</option><option value="permanent">永久</option></select></label>
        <div class="form-actions"><button id="cancelCreateInvite" class="ghost" type="button">取消</button><button id="createInvite" class="primary" type="button">创建邀请码</button></div>
      </div>
      <div id="inviteList" class="invite-list"></div>
    </section>
    <section id="logsTab" class="panel hidden">
      <div class="panel-head"><div><h2>管理日志</h2><span>系统管理操作记录</span></div><button id="refreshLogs" class="ghost">刷新</button></div>
      <div id="logList" class="route-list"></div>
    </section>
    <section id="resetTab" class="panel hidden">
      <div class="reset-card">
        <div class="reset-title">清空智配One业务数据</div>
        <p class="reset-warning">此操作不可恢复。将清除当前 Redis 中的业务运行数据及账号数据。</p>
        <p class="reset-note">不会修改 GitHub 代码、Cloudflare 环境变量或 Upstash 服务本身。执行后仅保留唯一的“主系统管理员”账号；其他账号与业务数据全部清除，线路和基准库需要重新建立。</p>
        <label class="confirm-label">数据重置密钥<div class="reset-key-row"><input id="resetKey" type="text" inputmode="text" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="输入或粘贴 Cloudflare 中配置的 DATA_RESET_KEY"><button id="toggleResetKey" type="button" class="key-toggle">隐藏</button></div></label>
        <label class="confirm-label">确认文字<input id="resetConfirmation" autocomplete="off" placeholder="输入：确认清空智配One数据"></label>
        <button id="resetDataBtn" class="danger-btn">执行系统数据重置</button>
        <div id="resetResult" class="reset-result hidden"></div>
      </div>
    </section>
  </main>
  <script src="js/modal.js?v=20260926-2"></script>
  <script src="js/admin.js?v=20260926-21"></script>
</body>
</html>
