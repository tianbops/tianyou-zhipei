<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>账户设置 · 智配One</title>
<link rel="stylesheet" href="css/login.css">
<style>
*{box-sizing:border-box}
:root{--bg:#05070A;--card:#18212B;--card2:#10161D;--line:rgba(255,255,255,.06);--muted:#7F8B98;--blue:#2457A6;--danger:#FF6B5E}
body{margin:0;background:var(--bg);color:#fff;font-family:"Microsoft YaHei",Arial,sans-serif;min-height:100vh}
.settings-page{width:100%;max-width:520px;min-height:100dvh;margin:0 auto;padding:12px 16px 34px;overflow-y:auto}
.settings-header{height:52px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 78%,transparent)}
.back-btn{width:40px;height:40px;border:0;border-radius:13px;background:#18212B;color:#fff;font-size:23px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}.back-btn:active{background:var(--blue);transform:scale(.95)}
.header-title{font-size:18px;font-weight:700;letter-spacing:.4px}.header-placeholder{width:40px}
.profile-hero{position:relative;background:linear-gradient(145deg,#1B2632,#111820);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:22px;overflow:hidden}.profile-hero:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-55px;top:-60px;background:rgba(36,87,166,.16)}
.avatar{position:relative;z-index:1;width:54px;height:54px;border-radius:17px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;margin-bottom:14px}.profile-name{position:relative;z-index:1;font-size:20px;font-weight:700}.profile-account{position:relative;z-index:1;margin-top:5px;color:#8793A0;font-size:12px}
.group{margin-bottom:20px}.group-title{padding:0 4px 8px;color:#74808D;font-size:12px;font-weight:600;letter-spacing:.3px}.settings-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.setting-row{width:100%;min-height:62px;padding:11px 14px;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:transparent;color:#fff;text-align:left;cursor:pointer}.setting-row:last-child{border-bottom:0}.setting-row:active{background:#202B37}.row-icon{width:36px;height:36px;border-radius:11px;background:#111820;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 36px}.row-main{min-width:0;flex:1}.row-title{font-size:14px;font-weight:600}.row-sub{margin-top:3px;color:#74808D;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-arrow{color:#64717F;font-size:21px;line-height:1;margin-left:4px}
.logout-btn{width:100%;height:48px;border:1px solid rgba(255,107,94,.18);border-radius:15px;background:rgba(255,107,94,.06);color:#FF8278;font-size:14px;font-weight:600;cursor:pointer}.logout-btn:active{background:rgba(255,107,94,.12)}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.62);backdrop-filter:blur(5px)}.modal.show{display:flex}.sheet{width:100%;max-width:520px;max-height:88dvh;overflow:auto;background:#111820;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -15px 50px rgba(0,0,0,.35);animation:sheetIn .18s ease-out}@keyframes sheetIn{from{transform:translateY(22px);opacity:.5}to{transform:none;opacity:1}}
.grabber{width:38px;height:4px;border-radius:4px;background:#4A5662;margin:2px auto 17px}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.sheet-title{font-size:17px;font-weight:700}.close-btn{width:34px;height:34px;border:0;border-radius:10px;background:#1B2631;color:#AAB5C0;font-size:20px;cursor:pointer}.sheet-note{color:#75818E;font-size:11px;line-height:1.6;margin:-8px 1px 16px}.field{margin-bottom:13px}.field-label{display:block;color:#7F8B98;font-size:12px;margin:0 3px 7px}.input-wrap{position:relative}.input-wrap input{width:100%;height:48px;padding:0 14px;border:1px solid rgba(255,255,255,.07);border-radius:13px;background:#0D1319;color:#fff;outline:none;font-size:15px}.input-wrap input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(36,87,166,.16)}.input-wrap input::placeholder{color:#566473}.input-wrap input[readonly]{color:#7F8B98}.eye{position:absolute;right:8px;top:7px;width:34px;height:34px;border:0;background:none;color:#778492;font-size:16px;cursor:pointer}.sheet-actions{display:flex;gap:10px;margin-top:17px}.secondary-btn,.primary-btn{height:48px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer}.secondary-btn{flex:1;background:#1A232D;border:1px solid var(--line);color:#AAB5C0}.primary-btn{flex:1.5;background:var(--blue);border:0;color:#fff}.secondary-btn:active,.primary-btn:active{transform:scale(.98)}.primary-btn:disabled{opacity:.55;cursor:not-allowed}
.message{display:none;border-radius:11px;padding:10px 12px;font-size:12px;line-height:1.5;margin-top:12px}.message.error{display:block;background:rgba(231,76,60,.10);color:#FF8F84;border:1px solid rgba(231,76,60,.15)}.message.success{display:block;background:rgba(39,174,96,.10);color:#76D59D;border:1px solid rgba(39,174,96,.15)}
@media(max-width:380px){.settings-page{padding-left:12px;padding-right:12px}.profile-hero{padding:18px}.setting-row{min-height:60px}.sheet{padding-left:13px;padding-right:13px}}
</style>
</head>
<body>
<main class="settings-page">
<header class="settings-header"><button class="back-btn" onclick="goBack()" aria-label="返回">←</button><div class="header-title">账户设置</div><div class="header-placeholder"></div></header>
<section class="profile-hero"><div class="avatar" id="avatar">智</div><div class="profile-name" id="profileName">加载中…</div><div class="profile-account" id="profileAccount">账户信息读取中</div></section>

<section class="group">
<div class="group-title">配送设置</div>
<div class="settings-card">
<button class="setting-row" onclick="openModal('deliveryModal')"><span class="row-icon">🚚</span><span class="row-main"><span class="row-title">配送资料</span><span class="row-sub" id="deliverySummary">线路与默认车辆</span></span><span class="row-arrow">›</span></button>
</div>
</section>

<section class="group">
<div class="group-title">账号与安全</div>
<div class="settings-card">
<button class="setting-row" onclick="openModal('usernameModal')"><span class="row-icon">👤</span><span class="row-main"><span class="row-title">更改账号</span><span class="row-sub" id="usernameSummary">登录账号</span></span><span class="row-arrow">›</span></button>
<button class="setting-row" onclick="openModal('passwordModal')"><span class="row-icon">🔐</span><span class="row-main"><span class="row-title">修改密码</span><span class="row-sub">定期更新密码，保护账号安全</span></span><span class="row-arrow">›</span></button>
</div>
</section>

<button class="logout-btn" onclick="Auth.logout()">退出登录</button>
</main>

<div class="modal" id="deliveryModal" onclick="backdropClose(event,'deliveryModal')"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="deliveryTitle"><div class="grabber"></div><div class="sheet-head"><div class="sheet-title" id="deliveryTitle">配送资料</div><button class="close-btn" onclick="closeModal('deliveryModal')">×</button></div><div class="field"><label class="field-label" for="route">配送线路</label><div class="input-wrap"><input id="route" type="text" inputmode="numeric" placeholder="例如 17号线" autocomplete="off"></div></div><div class="field"><label class="field-label" for="vehicle">默认车辆</label><div class="input-wrap"><input id="vehicle" type="text" placeholder="例如 渝DK7692" autocomplete="off" maxlength="30"></div></div><div id="profileMessage" class="message"></div><div class="sheet-actions"><button class="secondary-btn" onclick="closeModal('deliveryModal')">取消</button><button class="primary-btn" id="saveButton" onclick="saveProfile()">保存</button></div></section></div>

<div class="modal" id="usernameModal" onclick="backdropClose(event,'usernameModal')"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="usernameTitle"><div class="grabber"></div><div class="sheet-head"><div class="sheet-title" id="usernameTitle">更改账号</div><button class="close-btn" onclick="closeModal('usernameModal')">×</button></div><div class="sheet-note">账号用于登录智配One。更改后原账号立即失效。</div><div class="field"><label class="field-label" for="currentUsername">当前账号</label><div class="input-wrap"><input id="currentUsername" type="text" readonly></div></div><div class="field"><label class="field-label" for="newUsername">新账号</label><div class="input-wrap"><input id="newUsername" type="text" placeholder="3-32位字母、数字或下划线" autocomplete="username" maxlength="32"></div></div><div class="field"><label class="field-label" for="accountPassword">当前密码</label><div class="input-wrap"><input id="accountPassword" type="password" autocomplete="current-password" placeholder="请输入当前密码"><button class="eye" type="button" onclick="togglePassword('accountPassword',this)">◉</button></div></div><div id="accountMessage" class="message"></div><div class="sheet-actions"><button class="secondary-btn" onclick="closeModal('usernameModal')">取消</button><button class="primary-btn" id="accountButton" onclick="changeUsername()">确认更改</button></div></section></div>

<div class="modal" id="passwordModal" onclick="backdropClose(event,'passwordModal')"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="passwordTitle"><div class="grabber"></div><div class="sheet-head"><div class="sheet-title" id="passwordTitle">修改密码</div><button class="close-btn" onclick="closeModal('passwordModal')">×</button></div><div class="sheet-note">修改后立即生效，下次登录请使用新密码。</div><div class="field"><label class="field-label" for="currentPassword">当前密码</label><div class="input-wrap"><input id="currentPassword" type="password" autocomplete="current-password" placeholder="请输入当前密码"><button class="eye" type="button" onclick="togglePassword('currentPassword',this)">◉</button></div></div><div class="field"><label class="field-label" for="newPassword">新密码</label><div class="input-wrap"><input id="newPassword" type="password" autocomplete="new-password" placeholder="6-72位字符"><button class="eye" type="button" onclick="togglePassword('newPassword',this)">◉</button></div></div><div class="field"><label class="field-label" for="confirmPassword">确认新密码</label><div class="input-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入新密码"><button class="eye" type="button" onclick="togglePassword('confirmPassword',this)">◉</button></div></div><div id="passwordMessage" class="message"></div><div class="sheet-actions"><button class="secondary-btn" onclick="closeModal('passwordModal')">取消</button><button class="primary-btn" id="passwordButton" onclick="changePassword()">确认修改</button></div></section></div>

<script src="js/auth.js"></script>
<script>
let currentUser=null;
function $(id){return document.getElementById(id)}
function showMessage(id,message,type='error'){const el=$(id);el.textContent=message;el.className=`message ${type}`}
function hideMessage(id){const el=$(id);el.textContent='';el.className='message'}
function goBack(){location.href='home.html'}
function openModal(id){$(id).classList.add('show');document.body.style.overflow='hidden';setTimeout(()=>{const first=$(id).querySelector('input:not([readonly])');if(first)first.focus() },80)}
function closeModal(id){$(id).classList.remove('show');document.body.style.overflow='';hideMessage(id==='deliveryModal'?'profileMessage':id==='usernameModal'?'accountMessage':'passwordMessage')}
function backdropClose(event,id){if(event.target===event.currentTarget)closeModal(id)}
function togglePassword(id,button){const input=$(id);if(!input)return;const visible=input.type==='text';input.type=visible?'password':'text';button.style.opacity=visible?'1':'.65'}
function updateHero(user){currentUser=user;const name=user?.name||'用户';$('profileName').textContent=name;$('profileAccount').textContent=`账号：${user?.username||'—'}`;$('avatar').textContent=String(name).trim().charAt(0)||'智';$('currentUsername').value=user?.username||'';$('usernameSummary').textContent=user?.username?`当前账号：${user.username}`:'登录账号';$('deliverySummary').textContent=[user?.route,user?.vehicle].filter(Boolean).join('  ·  ')||'尚未设置配送线路和车辆'}
async function init(){try{const user=await Auth.getProfile();updateHero(user);$('route').value=user?.route||'';$('vehicle').value=user?.vehicle||''}catch(error){if(error.status===401){location.href='index.html';return}updateHero({name:'用户',username:'—'});}}
async function saveProfile(){const route=$('route').value.trim();const vehicle=$('vehicle').value.trim();const name=String(currentUser?.name||'').trim();const button=$('saveButton');hideMessage('profileMessage');if(!name)return showMessage('profileMessage','账户资料读取失败，请刷新后重试');if(!Auth.isValidRouteCode(route))return showMessage('profileMessage','请输入有效线路，例如 17号线');button.disabled=true;button.textContent='保存中…';try{const user=await Auth.updateProfile({name,route,vehicle});updateHero(user);showMessage('profileMessage','配送资料已保存','success');setTimeout(()=>closeModal('deliveryModal'),500)}catch(error){showMessage('profileMessage',error.message||'保存失败，请稍后重试')}finally{button.disabled=false;button.textContent='保存'}}
async function changeUsername(){const newUsername=$('newUsername').value.trim();const password=$('accountPassword').value;const button=$('accountButton');hideMessage('accountMessage');if(!/^[a-zA-Z0-9_]{3,32}$/.test(newUsername))return showMessage('accountMessage','新账号需为3-32位字母、数字或下划线');if(!password)return showMessage('accountMessage','请输入当前密码');if(newUsername.toLowerCase()===$('currentUsername').value.toLowerCase())return showMessage('accountMessage','新账号不能与当前账号相同');button.disabled=true;button.textContent='更改中…';try{const response=await fetch('/api/change-username',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({newUsername,password})});const data=await response.json().catch(()=>({}));if(response.status===401){location.href='index.html';return}if(!response.ok||!data.success)throw new Error(data.error||'账号更改失败，请稍后重试');updateHero(data.user);$('newUsername').value='';$('accountPassword').value='';showMessage('accountMessage','账号更改成功','success');setTimeout(()=>closeModal('usernameModal'),700)}catch(error){showMessage('accountMessage',error.message||'账号更改失败，请稍后重试')}finally{button.disabled=false;button.textContent='确认更改'}}
async function changePassword(){const currentPassword=$('currentPassword').value;const newPassword=$('newPassword').value;const confirmPassword=$('confirmPassword').value;const button=$('passwordButton');hideMessage('passwordMessage');if(!currentPassword)return showMessage('passwordMessage','请输入当前密码');if(newPassword.length<6||newPassword.length>72)return showMessage('passwordMessage','新密码需为6-72位字符');if(newPassword!==confirmPassword)return showMessage('passwordMessage','两次输入的新密码不一致');button.disabled=true;button.textContent='修改中…';try{const response=await fetch('/api/change-password',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({currentPassword,newPassword,confirmPassword})});const data=await response.json().catch(()=>({}));if(response.status===401){location.href='index.html';return}if(!response.ok||!data.success)throw new Error(data.error||'密码修改失败，请稍后重试');$('currentPassword').value='';$('newPassword').value='';$('confirmPassword').value='';showMessage('passwordMessage','密码修改成功','success');setTimeout(()=>closeModal('passwordModal'),700)}catch(error){showMessage('passwordMessage',error.message||'密码修改失败，请稍后重试')}finally{button.disabled=false;button.textContent='确认修改'}}
document.addEventListener('keydown',event=>{if(event.key==='Escape')document.querySelector('.modal.show')?.classList.remove('show')});
init();
</script>
</body>
</html>
