<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>账户设置 · Zhipei One</title>
<link rel="stylesheet" href="css/settings.css?v=20260922-17">
<link rel="stylesheet" href="css/icons.css?v=20260921-1">
</head>
<body>
<main class="settings-page">
<header class="settings-header">
  <button class="back-btn" type="button" aria-label="返回"><svg class="z-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
  <div class="header-title">账户设置</div>
  <div class="header-placeholder" aria-hidden="true"></div>
</header>

<section class="profile-hero">
  <div class="avatar" id="avatar">智</div>
  <div class="profile-name" id="profileName">加载中…</div>
  <div class="profile-meta" id="profileMeta">配送资料读取中</div>
</section>

<section class="group">
  <div class="group-title">配送设置</div>
  <div class="settings-card">
    <button class="setting-row" type="button" onclick="openModal('deliveryModal')">
      <span class="row-icon"><span class="z-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></span></span>
      <span class="row-main"><span class="row-title">配送资料</span><span class="row-sub" id="deliverySummary">线路与默认车辆</span></span>
      <span class="row-arrow" aria-hidden="true">›</span>
    </button>
  </div>
</section>

<section class="group">
  <div class="group-title">账号与安全</div>
  <div class="settings-card">
    <button class="setting-row" type="button" onclick="openModal('usernameModal')">
      <span class="row-icon"><span class="z-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.7-3.5 2.9-5.3 6.5-5.3s5.8 1.8 6.5 5.3"/></svg></span></span>
      <span class="row-main"><span class="row-title">更改账号</span><span class="row-sub">修改登录账号</span></span>
      <span class="row-arrow" aria-hidden="true">›</span>
    </button>
    <button class="setting-row" type="button" onclick="openModal('passwordModal')">
      <span class="row-icon"><span class="z-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span></span>
      <span class="row-main"><span class="row-title">修改密码</span><span class="row-sub">更新登录密码</span></span>
      <span class="row-arrow" aria-hidden="true">›</span>
    </button>
  </div>
</section>

<section class="group danger-group">
  <div class="group-title">危险操作</div>
  <div class="settings-card">
    <button class="setting-row danger-row" type="button" onclick="openModal('deleteAccountModal')">
      <span class="row-icon"><span class="z-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4 21 20H3z"/><path d="M12 9v5M12 17v.5"/></svg></span></span>
      <span class="row-main"><span class="row-title">注销账号</span><span class="row-sub">永久删除账号及个人业务数据</span></span>
      <span class="row-arrow" aria-hidden="true">›</span>
    </button>
  </div>
</section>

<button class="logout-btn" type="button" onclick="Auth.logout()">退出登录</button>
</main>

<div class="modal" id="deliveryModal" onclick="backdropClose(event,'deliveryModal')"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="deliveryTitle"><div class="grabber"></div><div class="sheet-head"><div class="sheet-title" id="deliveryTitle">配送资料</div><button class="close-btn" type="button" onclick="closeModal('deliveryModal')" aria-label="关闭">×</button></div><div class="field"><label class="field-label" for="route">配送线路</label><div class="input-wrap"><input id="route" type="text" inputmode="numeric" placeholder="例如 17号线" autocomplete="off"></div></div><div class="field"><label class="field-label" for="vehicle">默认车辆</label><div class="input-wrap"><input id="vehicle" type="text" placeholder="例如 渝DK7692" autocomplete="off" maxlength="30"></div></div><div id="profileMessage" class="message" role="alert" aria-live="polite"></div><div class="sheet-actions"><button class="secondary-btn" type="button" onclick="closeModal('deliveryModal')">取消</button><button class="primary-btn" id="saveButton" type="button" onclick="saveProfile()">保存</button></div></section></div>

<div class="modal" id="usernameModal" onclick="backdropClose(event,'usernameModal')"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="usernameTitle"><div class="grabber"></div><div class="sheet-head"><div class="sheet-title" id="usernameTitle">更改账号</div><button class="close-btn" type="button" onclick="closeModal('usernameModal')" aria-label="关闭">×</button></div><div class="sheet-note">账号用于登录 Zhipei One。更改后原账号立即失效。</div><div class="field"><label class="field-label" for="currentUsername">当前账号</label><div class="input-wrap"><input id="currentUsername" type="text" readonly></div></div><div class="field"><label class="field-label" for="newUsername">新账号</label><div class="input-wrap"><input id="newUsername" type="text" placeholder="3-32位字母、数字或下划线" autocomplete="username" maxlength="32"></div></div><div class="field"><label class="field-label" for="accountPassword">当前密码</label><div class="input-wrap"><input id="accountPassword" type="password" autocomplete="current-password" placeholder="请输入当前密码"><button class="eye" type="button" onclick="togglePassword('accountPassword',this)" aria-label="显示或隐藏密码">◉</button></div></div><div id="accountMessage" class="message" role="alert" aria-live="polite"></div><div class="sheet-actions"><button class="secondary-btn" type="button" onclick="closeModal('usernameModal')">取消</button><button class="primary-btn" id="accountButton" type="button" onclick="changeUsername()">确认更改</button></div></section></div>

<div class="modal" id="passwordModal" onclick="backdropClose(event,'passwordModal')"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="passwordTitle"><div class="grabber"></div><div class="sheet-head"><div class="sheet-title" id="passwordTitle">修改密码</div><button class="close-btn" type="button" onclick="closeModal('passwordModal')" aria-label="关闭">×</button></div><div class="sheet-note">修改后立即生效，下次登录请使用新密码。</div><div class="field"><label class="field-label" for="currentPassword">当前密码</label><div class="input-wrap"><input id="currentPassword" type="password" autocomplete="current-password" placeholder="请输入当前密码"><button class="eye" type="button" onclick="togglePassword('currentPassword',this)" aria-label="显示或隐藏密码">◉</button></div></div><div class="field"><label class="field-label" for="newPassword">新密码</label><div class="input-wrap"><input id="newPassword" type="password" autocomplete="new-password" placeholder="6-72位字符"><button class="eye" type="button" onclick="togglePassword('newPassword',this)" aria-label="显示或隐藏密码">◉</button></div></div><div class="field"><label class="field-label" for="confirmPassword">确认新密码</label><div class="input-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入新密码"><button class="eye" type="button" onclick="togglePassword('confirmPassword',this)" aria-label="显示或隐藏密码">◉</button></div></div><div id="passwordMessage" class="message" role="alert" aria-live="polite"></div><div class="sheet-actions"><button class="secondary-btn" type="button" onclick="closeModal('passwordModal')">取消</button><button class="primary-btn" id="passwordButton" type="button" onclick="changePassword()">确认修改</button></div></section></div>

<div class="modal" id="deleteAccountModal" onclick="backdropClose(event,'deleteAccountModal')"><section class="sheet danger-sheet" role="dialog" aria-modal="true" aria-labelledby="deleteAccountTitle"><div class="grabber"></div><div class="sheet-head"><div class="sheet-title danger-title" id="deleteAccountTitle">注销账号</div><button class="close-btn" type="button" onclick="closeModal('deleteAccountModal')" aria-label="关闭">×</button></div><div class="danger-warning"><strong>此操作不可恢复</strong><span>账号、订单、历史记录和个人学习数据将被永久删除。线路公共基准库不会被删除。</span></div><div class="field"><label class="field-label" for="deletePassword">当前密码</label><div class="input-wrap"><input id="deletePassword" type="password" autocomplete="current-password" placeholder="请输入当前密码"><button class="eye" type="button" onclick="togglePassword('deletePassword',this)" aria-label="显示或隐藏密码">◉</button></div></div><div class="field"><label class="field-label" for="deleteConfirmation">确认注销</label><div class="input-wrap"><input id="deleteConfirmation" type="text" autocomplete="off" placeholder="请输入：注销账号" maxlength="4"></div></div><div id="deleteMessage" class="message" role="alert" aria-live="polite"></div><div class="sheet-actions"><button class="secondary-btn" type="button" onclick="closeModal('deleteAccountModal')">取消</button><button class="danger-btn" id="deleteButton" type="button" onclick="deleteAccount()">永久注销</button></div></section></div>

<script src="js/auth.js?v=20260917"></script>
<script>
'use strict';
let currentUser=null;
const $=id=>document.getElementById(id);
const messageId=id=>id==='deliveryModal'?'profileMessage':id==='usernameModal'?'accountMessage':id==='deleteAccountModal'?'deleteMessage':'passwordMessage';
function showMessage(id,message,type='error'){const el=$(id);el.textContent=message;el.className=`message ${type}`}
function hideMessage(id){const el=$(id);el.textContent='';el.className='message'}
function openModal(id){const modal=$(id);if(!modal)return;document.querySelectorAll('.modal.show').forEach(item=>item.classList.remove('show'));modal.classList.add('show');document.body.style.overflow='hidden';setTimeout(()=>modal.querySelector('input:not([readonly])')?.focus(),80)}
function closeModal(id){const modal=$(id);if(!modal)return;modal.classList.remove('show');document.body.style.overflow='';hideMessage(messageId(id))}
function backdropClose(event,id){if(event.target===event.currentTarget)closeModal(id)}
function togglePassword(id,button){const input=$(id);if(!input)return;const visible=input.type==='text';input.type=visible?'password':'text';button.style.opacity=visible?'1':'.65'}
function updateHero(user){currentUser=user;const name=String(user?.name||'用户').trim()||'用户';$('profileName').textContent=name;$('profileMeta').textContent=[user?.route,user?.vehicle].filter(Boolean).join('  ·  ')||'尚未设置配送资料';$('avatar').textContent=name.charAt(0)||'智';$('currentUsername').value=user?.username||'';$('deliverySummary').textContent=[user?.route,user?.vehicle].filter(Boolean).join('  ·  ')||'线路与默认车辆'}
async function init(){try{const user=await Auth.getProfile();updateHero(user);$('route').value=user?.route||'';$('vehicle').value=user?.vehicle||''}catch(error){if(error.status===401){location.href='index.html';return}updateHero({name:'用户',username:'—'})}}
async function saveProfile(){const route=$('route').value.trim();const vehicle=$('vehicle').value.trim();const name=String(currentUser?.name||'').trim();const button=$('saveButton');hideMessage('profileMessage');if(!name)return showMessage('profileMessage','账户资料读取失败，请刷新后重试');if(!Auth.isValidRouteCode(route))return showMessage('profileMessage','请输入有效线路，例如 17号线');button.disabled=true;button.textContent='保存中…';try{const user=await Auth.updateProfile({name,route,vehicle});updateHero(user);showMessage('profileMessage','配送资料已保存','success');setTimeout(()=>closeModal('deliveryModal'),500)}catch(error){showMessage('profileMessage',error.message||'保存失败，请稍后重试')}finally{button.disabled=false;button.textContent='保存'}}
async function changeUsername(){const newUsername=$('newUsername').value.trim();const password=$('accountPassword').value;const button=$('accountButton');hideMessage('accountMessage');if(!/^[a-zA-Z0-9_]{3,32}$/.test(newUsername))return showMessage('accountMessage','新账号需为3-32位字母、数字或下划线');if(!password)return showMessage('accountMessage','请输入当前密码');if(newUsername.toLowerCase()===$('currentUsername').value.toLowerCase())return showMessage('accountMessage','新账号不能与当前账号相同');button.disabled=true;button.textContent='更改中…';try{const response=await fetch('/api/change-username',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({newUsername,password})});const data=await response.json().catch(()=>({}));if(response.status===401){location.href='index.html';return}if(!response.ok||!data.success)throw new Error(data.error||'账号更改失败，请稍后重试');updateHero(data.user);$('newUsername').value='';$('accountPassword').value='';showMessage('accountMessage','账号更改成功','success');setTimeout(()=>closeModal('usernameModal'),700)}catch(error){showMessage('accountMessage',error.message||'账号更改失败，请稍后重试')}finally{button.disabled=false;button.textContent='确认更改'}}
async function changePassword(){const currentPassword=$('currentPassword').value;const newPassword=$('newPassword').value;const confirmPassword=$('confirmPassword').value;const button=$('passwordButton');hideMessage('passwordMessage');if(!currentPassword)return showMessage('passwordMessage','请输入当前密码');if(newPassword.length<6||newPassword.length>72)return showMessage('passwordMessage','新密码需为6-72位字符');if(newPassword!==confirmPassword)return showMessage('passwordMessage','两次输入的新密码不一致');button.disabled=true;button.textContent='修改中…';try{const response=await fetch('/api/change-password',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({currentPassword,newPassword,confirmPassword})});const data=await response.json().catch(()=>({}));if(response.status===401){location.href='index.html';return}if(!response.ok||!data.success)throw new Error(data.error||'密码修改失败，请稍后重试');$('currentPassword').value='';$('newPassword').value='';$('confirmPassword').value='';showMessage('passwordMessage','密码修改成功','success');setTimeout(()=>closeModal('passwordModal'),700)}catch(error){showMessage('passwordMessage',error.message||'密码修改失败，请稍后重试')}finally{button.disabled=false;button.textContent='确认修改'}}
async function deleteAccount(){const password=$('deletePassword').value;const confirmation=$('deleteConfirmation').value.trim();const button=$('deleteButton');hideMessage('deleteMessage');if(!password)return showMessage('deleteMessage','请输入当前密码');if(confirmation!=='注销账号')return showMessage('deleteMessage','请输入“注销账号”确认操作');button.disabled=true;button.textContent='注销中…';try{const response=await fetch('/api/delete-account',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({password,confirmation})});const data=await response.json().catch(()=>({}));if(response.status===401){location.href='index.html';return}if(!response.ok||!data.success)throw new Error(data.error||'注销失败，请稍后重试');location.replace('index.html?accountDeleted=1')}catch(error){showMessage('deleteMessage',error.message||'注销失败，请稍后重试');button.disabled=false;button.textContent='永久注销'}}
document.addEventListener('keydown',event=>{if(event.key==='Escape'){const modal=document.querySelector('.modal.show');if(modal)closeModal(modal.id)}});
init();
</script>
</body>
</html>
