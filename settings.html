<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>账户设置 · 智配One</title>
<link rel="stylesheet" href="css/login.css">
<style>
*{box-sizing:border-box}body{background:#05070A;color:#fff;font-family:"Microsoft YaHei",Arial,sans-serif;min-height:100vh}.settings-page{width:100%;max-width:520px;min-height:100dvh;margin:0 auto;padding:18px 16px 30px;overflow-y:auto}.settings-header{height:52px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:0 0 40px;padding:0;border:0;border-radius:13px;background:#18212B;color:#fff;font-size:24px;font-family:Arial,"Microsoft YaHei",sans-serif;font-weight:400;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s,transform .1s}.back-btn:hover{background:#202B37}.back-btn:active{background:#2457A6;transform:scale(.94)}.header-title{font-size:18px;font-weight:700;letter-spacing:.5px}.header-placeholder{width:40px}.profile-hero{background:linear-gradient(145deg,#18212B,#111820);border:1px solid rgba(255,255,255,.05);border-radius:22px;padding:22px 20px;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.18)}.avatar{width:58px;height:58px;border-radius:18px;background:#2457A6;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700;margin-bottom:15px}.profile-name{font-size:21px;font-weight:700}.profile-account{margin-top:5px;color:#7F8B98;font-size:12px}.section-card{background:#18212B;border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid rgba(255,255,255,.04)}.section-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}.section-title span{font-size:17px}.field{margin-bottom:11px}.field:last-child{margin-bottom:0}.field-label{display:block;color:#7F8B98;font-size:12px;margin:0 3px 7px}.input-wrap{position:relative}.input-wrap input{width:100%;height:48px;padding:0 14px;border:1px solid rgba(255,255,255,.07);border-radius:13px;background:#10161D;color:#fff;outline:none;font-size:15px}.input-wrap input:focus{border-color:#2457A6;box-shadow:0 0 0 2px rgba(36,87,166,.15)}.input-wrap input::placeholder{color:#566473}.eye{position:absolute;right:10px;top:7px;width:34px;height:34px;border:0;background:none;color:#7F8B98;font-size:17px;cursor:pointer}.route-row{display:flex;gap:10px}.route-row .field{flex:1}.save-btn{width:100%;height:48px;border:0;border-radius:14px;background:#2457A6;color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:15px}.save-btn:disabled,.password-btn:disabled{opacity:.55;cursor:not-allowed}.password-btn{width:100%;height:46px;border:1px solid rgba(255,255,255,.07);border-radius:13px;background:#10161D;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}.password-btn:hover{background:#141C25}.notice{font-size:11px;color:#697786;line-height:1.6;margin:9px 2px 0}.message{display:none;border-radius:11px;padding:10px 12px;font-size:12px;line-height:1.5;margin-top:12px}.message.error{display:block;background:rgba(231,76,60,.10);color:#FF8F84;border:1px solid rgba(231,76,60,.15)}.message.success{display:block;background:rgba(39,174,96,.10);color:#76D59D;border:1px solid rgba(39,174,96,.15)}.logout-btn{width:100%;height:46px;border:1px solid rgba(255,176,32,.16);border-radius:13px;background:rgba(255,176,32,.05);color:#FFB020;font-size:14px;cursor:pointer;margin-top:2px}.hidden{display:none!important}@media(max-width:380px){.settings-page{padding-left:12px;padding-right:12px}.section-card{padding:15px}.profile-hero{padding:19px 17px}.route-row{display:block}.route-row .field{margin-bottom:11px}}
</style>
</head>
<body>
<main class="settings-page">
<header class="settings-header"><button class="back-btn" onclick="goBack()" aria-label="返回">←</button><div class="header-title">账户设置</div><div class="header-placeholder"></div></header>
<section class="profile-hero"><div class="avatar" id="avatar">智</div><div class="profile-name" id="profileName">加载中…</div><div class="profile-account" id="profileAccount">账户信息读取中</div></section>
<section class="section-card">
<div class="section-title"><span>🚚</span>配送资料</div>
<div class="route-row"><div class="field"><label class="field-label" for="route">配送线路</label><div class="input-wrap"><input id="route" type="text" inputmode="numeric" placeholder="例如 17号线" autocomplete="off"></div></div><div class="field"><label class="field-label" for="vehicle">默认车辆</label><div class="input-wrap"><input id="vehicle" type="text" placeholder="默认配送车辆" autocomplete="off" maxlength="30"></div></div></div>
<button class="save-btn" id="saveButton" onclick="saveProfile()">保存资料</button><div id="profileMessage" class="message"></div>
</section>
<section class="section-card">
<div class="section-title"><span>👤</span>账号更改</div>
<div class="field"><label class="field-label">当前账号</label><div class="input-wrap"><input id="currentUsername" type="text" readonly></div></div>
<div class="field"><label class="field-label" for="newUsername">新账号</label><div class="input-wrap"><input id="newUsername" type="text" placeholder="3-32位字母、数字或下划线" autocomplete="username" maxlength="32"></div></div>
<div class="field"><label class="field-label" for="accountPassword">当前密码</label><div class="input-wrap"><input id="accountPassword" type="password" autocomplete="current-password" placeholder="请输入当前密码"><button class="eye" type="button" onclick="togglePassword('accountPassword',this)">◉</button></div></div>
<button class="password-btn" id="accountButton" onclick="changeUsername()">更改账号</button><div class="notice">账号用于登录系统。更改后下次登录请使用新账号，原账号立即失效。</div><div id="accountMessage" class="message"></div>
</section>
<section class="section-card">
<div class="section-title"><span>🔐</span>账号安全</div>
<div class="field"><label class="field-label" for="currentPassword">当前密码</label><div class="input-wrap"><input id="currentPassword" type="password" autocomplete="current-password" placeholder="请输入当前密码"><button class="eye" type="button" onclick="togglePassword('currentPassword',this)">◉</button></div></div>
<div class="field"><label class="field-label" for="newPassword">新密码</label><div class="input-wrap"><input id="newPassword" type="password" autocomplete="new-password" placeholder="6-72位字符"><button class="eye" type="button" onclick="togglePassword('newPassword',this)">◉</button></div></div>
<div class="field"><label class="field-label" for="confirmPassword">确认新密码</label><div class="input-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入新密码"><button class="eye" type="button" onclick="togglePassword('confirmPassword',this)">◉</button></div></div>
<button class="password-btn" id="passwordButton" onclick="changePassword()">修改密码</button><div class="notice">修改后立即使用新密码登录。密码仅以加密哈希形式保存在服务器。</div><div id="passwordMessage" class="message"></div>
</section>
<button class="logout-btn" onclick="Auth.logout()">🚪 退出登录</button>
</main>
<script src="js/auth.js"></script>
<script>
function $(id){return document.getElementById(id)}
function showMessage(id,message,type='error'){const el=$(id);el.textContent=message;el.className=`message ${type}`}
function hideMessage(id){const el=$(id);el.textContent='';el.className='message'}
function goBack(){location.href='home.html'}
function togglePassword(id,button){const input=$(id);if(!input)return;const visible=input.type==='text';input.type=visible?'password':'text';button.style.opacity=visible?'1':'.65'}
function updateHero(user){const name=user?.name||'用户';$('profileName').textContent=name;$('profileAccount').textContent=`账号：${user?.username||'—'}${user?.route?`  ·  ${user.route}`:''}`;$('avatar').textContent=String(name).trim().charAt(0)||'智';$('currentUsername').value=user?.username||''}
async function init(){try{const user=await Auth.getProfile();updateHero(user);$('route').value=user?.route||'';$('vehicle').value=user?.vehicle||'';}catch(error){if(error.status===401){location.href='index.html';return}showMessage('profileMessage',error.message||'资料读取失败，请稍后重试')}}
async function saveProfile(){const route=$('route').value.trim();const vehicle=$('vehicle').value.trim();const button=$('saveButton');hideMessage('profileMessage');if(!Auth.isValidRouteCode(route))return showMessage('profileMessage','请输入有效线路，例如 17号线');button.disabled=true;button.textContent='保存中…';try{const user=await Auth.updateProfile({name:'',route,vehicle});updateHero(user);showMessage('profileMessage','资料已保存','success')}catch(error){showMessage('profileMessage',error.message||'保存失败，请稍后重试')}finally{button.disabled=false;button.textContent='保存资料'}}
async function changeUsername(){const newUsername=$('newUsername').value.trim();const password=$('accountPassword').value;const button=$('accountButton');hideMessage('accountMessage');if(!/^[a-zA-Z0-9_]{3,32}$/.test(newUsername))return showMessage('accountMessage','新账号需为3-32位字母、数字或下划线');if(!password)return showMessage('accountMessage','请输入当前密码');if(newUsername.toLowerCase()===$('currentUsername').value.toLowerCase())return showMessage('accountMessage','新账号不能与当前账号相同');button.disabled=true;button.textContent='更改中…';try{const response=await fetch('/api/change-username',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({newUsername,password})});const data=await response.json().catch(()=>({}));if(response.status===401){location.href='index.html';return}if(!response.ok||!data.success)throw new Error(data.error||'账号更改失败，请稍后重试');updateHero(data.user);$('newUsername').value='';$('accountPassword').value='';showMessage('accountMessage','账号更改成功','success')}catch(error){showMessage('accountMessage',error.message||'账号更改失败，请稍后重试')}finally{button.disabled=false;button.textContent='更改账号'}}
async function changePassword(){const currentPassword=$('currentPassword').value;const newPassword=$('newPassword').value;const confirmPassword=$('confirmPassword').value;const button=$('passwordButton');hideMessage('passwordMessage');if(!currentPassword)return showMessage('passwordMessage','请输入当前密码');if(newPassword.length<6||newPassword.length>72)return showMessage('passwordMessage','新密码需为6-72位字符');if(newPassword!==confirmPassword)return showMessage('passwordMessage','两次输入的新密码不一致');button.disabled=true;button.textContent='修改中…';try{const response=await fetch('/api/change-password',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({currentPassword,newPassword,confirmPassword})});const data=await response.json().catch(()=>({}));if(response.status===401){location.href='index.html';return}if(!response.ok||!data.success)throw new Error(data.error||'密码修改失败，请稍后重试');$('currentPassword').value='';$('newPassword').value='';$('confirmPassword').value='';showMessage('passwordMessage','密码修改成功，下次登录请使用新密码。','success')}catch(error){showMessage('passwordMessage',error.message||'密码修改失败，请稍后重试')}finally{button.disabled=false;button.textContent='修改密码'}}
init();
</script>
</body>
</html>
