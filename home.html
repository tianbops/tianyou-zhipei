<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>智配One</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="error-box" role="alert" aria-live="polite"></div>
<div class="app-container">
<header class="top-bar">
  <div class="brand-info"><div class="brand-name">智配One</div><div class="brand-sub">智能配送 · 一路领先</div></div>
  <button class="menu-btn" type="button" onclick="openHomeMenu()" aria-label="打开菜单">☰</button>
</header>
<div id="homeMenu" class="home-menu">
  <div class="current-line" id="menuRoute">加载中...</div>
  <div class="home-menu-item" onclick="location.href='settings.html'">👤 账户设置</div>
  <div class="home-menu-item" onclick="goToRouteEdit()">⚙ 原始数据</div>
  <div class="home-menu-item logout-item" onclick="logout()">🚪 退出登录</div>
</div>
<section class="task-card" id="taskCard">
  <div class="task-title"><div class="task-name">当日任务 <span class="status-dot" id="statusDot"></span></div><div class="vehicle-area" id="homeRoute">加载中...</div></div>
  <div class="task-main">
    <div class="task-info"><div>当日配送：<strong id="storeCount">无数据</strong></div><div>总重量：<strong id="totalWeight">无数据</strong></div></div>
    <div class="delivery-man"><img src="assets/delivery-route.png" alt="配送路线" onerror="this.style.display='none';this.parentElement.textContent='🚚'"></div>
  </div>
</section>
<div class="function-list">
  <button class="function-btn" type="button" onclick="toggleUpload()"><span>📷</span>上传运单</button>
  <button class="function-btn" type="button" onclick="goToOrderDetail()"><span>🗺</span>当日路线</button>
  <button class="function-btn" type="button" onclick="goToHistory()"><span>◷</span>历史查询</button>
</div>
<div class="upload-overlay" id="uploadOverlay">
  <div class="upload-sheet">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-title">📤 上传运单</div>
    <div class="upload-icons">
      <button class="upload-icon-btn" type="button" onclick="triggerUpload('camera')"><span class="icon">📷</span><span class="icon-label">拍摄</span></button>
      <button class="upload-icon-btn" type="button" onclick="triggerUpload('album')"><span class="icon">🖼️</span><span class="icon-label">相册</span></button>
      <button class="upload-icon-btn" type="button" onclick="triggerUpload('file')"><span class="icon">📄</span><span class="icon-label">文件</span></button>
    </div>
    <div class="divider-line"><hr><span>OCR文字 / 手动文字</span><hr></div>
    <div class="parse-status" id="parseStatus"><div class="status-row"><span id="statusIcon">⏳</span><span id="statusText">等待处理...</span></div><div class="progress-track"><div id="progressBar"></div></div><div id="statusCount"></div></div>
    <div class="input-area"><textarea id="manualOrderInput" rows="10" placeholder="上传图片后，这里显示识别文字。请核对后再开始解析，也可直接粘贴运单文字。" autocomplete="off"></textarea><span id="charCount">0</span></div>
    <div class="quick-actions"><button type="button" onclick="pasteFromClipboard()">📋 粘贴</button><button type="button" onclick="clearManualInput()">🗑️ 清空</button><button type="button" onclick="parseManualInput()">🔍 开始解析</button></div>
    <div class="sheet-footer"><button class="btn-cancel" type="button" onclick="toggleUpload()">取消</button><button class="btn-confirm" id="confirmBtn" type="button" onclick="submitManualOrder()">确认录入</button></div>
  </div>
</div>
<script src="js/auth.js"></script>
<script src="js/home.js"></script>
<script src="js/paddle_ocr.js"></script>
<script src="js/home_confirm.js"></script>
</body>
</html>
