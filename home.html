<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智配One</title>
  <!-- 引入图片压缩库 -->
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== Uber风格上传弹窗 ===== */
    .upload-overlay {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 999;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
    }
    .upload-overlay.active { display: flex; }
    .upload-sheet {
      width: 100%;
      max-width: 420px;
      background: rgba(28,37,48,0.92);
      border-radius: 28px;
      padding: 20px 20px 28px;
      animation: slideUp 0.35s cubic-bezier(0.22,1,0.36,1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.05);
      margin: 0 auto;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      margin: 0 auto 14px auto;
    }
    .sheet-title {
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }
    .sheet-subtitle {
      text-align: center;
      font-size: 12px;
      color: #5A6A7A;
      margin-bottom: 20px;
    }
    .upload-icons {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .upload-icon-btn {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      color: #7F8B98;
    }
    .upload-icon-btn:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.08);
      transform: translateY(-2px);
    }
    .upload-icon-btn:active {
      transform: scale(0.92);
      background: rgba(255,255,255,0.10);
    }
    .upload-icon-btn .icon {
      font-size: 28px;
      line-height: 1;
      transition: all 0.3s ease;
      filter: grayscale(0.2);
    }
    .upload-icon-btn .icon-label {
      font-size: 10px;
      color: #4A5A6A;
      margin-top: 4px;
      letter-spacing: 0.3px;
      font-weight: 400;
    }
    .upload-icon-btn .ripple {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      pointer-events: none;
      border: 1px solid rgba(36,87,166,0.2);
      opacity: 0;
      transition: all 0.5s ease;
    }
    .upload-icon-btn.loading .ripple {
      opacity: 1;
      animation: ripplePulse 1.2s ease-out infinite;
    }
    @keyframes ripplePulse {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.06); opacity: 0; }
    }
    .upload-icon-btn .badge-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #27AE60;
      border: 2px solid #1C2530;
      display: none;
    }
    .upload-icon-btn.done .badge-dot { display: block; }
    .divider-line {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 6px 0 16px 0;
    }
    .divider-line hr {
      flex: 1;
      border: none;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .divider-line span {
      color: #3A4A5A;
      font-size: 11px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .parse-status {
      background: rgba(0,0,0,0.25);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      min-height: 50px;
      display: none;
      border: 1px solid rgba(255,255,255,0.03);
      transition: all 0.4s ease;
    }
    .parse-status.active { display: block; }
    .parse-status .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .parse-status .status-icon { font-size: 18px; flex-shrink: 0; }
    .parse-status .status-text {
      font-size: 13px;
      color: #B8C2CC;
      flex: 1;
    }
    .parse-status .status-text strong { color: #fff; font-weight: 500; }
    .parse-status .status-progress {
      margin-top: 8px;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    .parse-status .status-progress .bar {
      height: 100%;
      background: linear-gradient(90deg, #2457A6, #4A8FD4);
      border-radius: 2px;
      width: 0%;
      transition: width 0.15s ease;
    }
    .parse-status.done .status-icon { color: #27AE60; }
    .parse-status.done .status-text { color: #27AE60; }
    .parse-status .status-count {
      font-size: 12px;
      color: #5A6A7A;
      margin-top: 4px;
    }
    .parse-status .status-count span { color: #fff; font-weight: 600; }
    .parsed-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
      max-height: 60px;
      overflow-y: auto;
    }
    .parsed-tags .tag {
      background: rgba(36,87,166,0.15);
      border: 1px solid rgba(36,87,166,0.08);
      border-radius: 16px;
      padding: 2px 10px;
      font-size: 11px;
      color: #B8C2CC;
      animation: tagFadeIn 0.3s ease;
    }
    @keyframes tagFadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    .parsed-tags .tag .idx { color: #4A5A6A; margin-right: 3px; }

    .input-area {
      position: relative;
      margin-bottom: 12px;
    }
    .input-area textarea {
      width: 100%;
      max-height: 120px;
      min-height: 70px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 14px;
      padding: 12px 14px 26px 14px;
      color: #fff;
      font-size: 13px;
      resize: vertical;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s ease;
      line-height: 1.6;
    }
    .input-area textarea:focus {
      border-color: rgba(36,87,166,0.4);
    }
    .input-area textarea::placeholder { color: #3A4A5A; }
    .input-area .char-count {
      position: absolute;
      bottom: 8px;
      right: 12px;
      color: #3A4A5A;
      font-size: 10px;
      pointer-events: none;
    }

    .quick-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .quick-actions button {
      flex: 1;
      min-width: 50px;
      padding: 6px 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.03);
      color: #5A6A7A;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .quick-actions button:hover {
      background: rgba(255,255,255,0.06);
      color: #B8C2CC;
    }
    .quick-actions button:active { transform: scale(0.94); }
    .quick-actions button .emoji { font-size: 14px; }

    .sheet-footer {
      display: flex;
      gap: 10px;
      margin-top: 2px;
    }
    .sheet-footer .btn-cancel {
      flex: 1;
      height: 44px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: none;
      color: #5A6A7A;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .sheet-footer .btn-cancel:hover {
      background: rgba(255,255,255,0.08);
    }
    .sheet-footer .btn-confirm {
      flex: 2;
      height: 44px;
      border-radius: 14px;
      background: #2457A6;
      border: none;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .sheet-footer .btn-confirm:active { transform: scale(0.96); }
    .sheet-footer .btn-confirm:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #18212B;
      color: #fff;
      padding: 10px 20px;
      border-radius: 12px;
      z-index: 9999;
      font-size: 13px;
      max-width: 90%;
      text-align: center;
      display: none;
      border-left: 3px solid #27AE60;
    }
    .toast.show { display: block; }
    .toast.warning { border-left-color: #FFB020; }
    .toast.error { border-left-color: #E74C3C; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <div class="brand-info">
        <div class="brand-name">智配One</div>
        <div class="brand-sub">智能配送 · 一路领先</div>
      </div>
      <button class="menu-btn" onclick="openHomeMenu()">☰</button>
    </header>

    <div id="homeMenu" class="home-menu">
      <div class="current-line" id="menuRoute">加载中...</div>
      <div class="home-menu-item" onclick="goToRouteEdit()">⚙ 原始数据</div>
      <div class="home-menu-item" onclick="logout()" style="color:#FFB020;">🚪 退出登录</div>
    </div>

    <section class="task-card">
      <div class="task-title">
        <div class="task-name">今日任务 <span class="status-dot" id="statusDot"></span></div>
        <div class="vehicle-area" id="homeRoute">加载中...</div>
      </div>
      <div class="task-main">
        <div class="task-info">
          <div>待配送：<strong id="storeCount">无数据</strong></div>
          <div>总重量：<strong id="totalWeight">无数据</strong></div>
        </div>
        <div class="delivery-man">
          <img src="assets/delivery-route.png" alt="配送路线" onerror="this.style.display='none';this.parentElement.textContent='🚚'">
        </div>
      </div>
    </section>

    <div class="function-list">
      <button class="function-btn upload-btn" onclick="toggleUpload()">
        <span>📷</span> 上传运单
      </button>
      <button class="function-btn" onclick="goToOrderDetail()">
        <span>🗺</span> 今日路线
      </button>
      <button class="function-btn" onclick="goToHistory()">
        <span>◷</span> 历史查询
      </button>
    </div>

    <!-- ===== Uber风格上传弹窗 ===== -->
    <div class="upload-overlay" id="uploadOverlay">
      <div class="upload-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">📤 上传运单</div>
        <div class="sheet-subtitle">从相册选取或上传文件</div>

        <div class="upload-icons">
          <div class="upload-icon-btn" id="albumBtn" onclick="triggerUpload('album')">
            <span class="icon">🖼️</span>
            <span class="icon-label">相册</span>
            <span class="ripple"></span>
            <span class="badge-dot"></span>
          </div>
          <div class="upload-icon-btn" id="fileBtn" onclick="triggerUpload('file')">
            <span class="icon">📄</span>
            <span class="icon-label">文件</span>
            <span class="ripple"></span>
            <span class="badge-dot"></span>
          </div>
        </div>

        <div class="divider-line"><hr><span>或手动输入</span><hr></div>

        <div class="parse-status" id="parseStatus">
          <div class="status-row">
            <span class="status-icon" id="statusIcon">⏳</span>
            <span class="status-text" id="statusText">正在解析运单信息...</span>
          </div>
          <div class="status-progress"><div class="bar" id="progressBar"></div></div>
          <div class="status-count" id="statusCount"></div>
          <div class="parsed-tags" id="parsedTags"></div>
        </div>

        <div class="input-area">
          <textarea id="manualOrderInput" rows="3" placeholder="输入门店名称，每行一个&#10;或粘贴运单列表"></textarea>
          <span class="char-count" id="charCount">0</span>
        </div>

        <div class="quick-actions">
          <button onclick="pasteFromClipboard()"><span class="emoji">📋</span> 粘贴</button>
          <button onclick="clearManualInput()"><span class="emoji">🗑️</span> 清空</button>
          <button onclick="loadExampleData()"><span class="emoji">📝</span> 示例</button>
          <button onclick="parseManualInput()"><span class="emoji">🔍</span> 解析</button>
        </div>

        <div class="sheet-footer">
          <button class="btn-cancel" onclick="toggleUpload()">取消</button>
          <button class="btn-confirm" id="confirmBtn" onclick="submitManualOrder()">确认录入</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // ============================================================
    // 全局变量
    // ============================================================
    let baseStores = [];
    let parsedOrders = [];

    // ============================================================
    // 页面初始化
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      if (!Auth.checkAuth()) return;
      const route = Auth.getCurrentRoute();
      document.getElementById("menuRoute").textContent = route;
      document.getElementById("homeRoute").textContent = route;
      loadRouteData(route);
      updateStatusDot();

      const textarea = document.getElementById('manualOrderInput');
      const charCount = document.getElementById('charCount');
      if (textarea && charCount) {
        textarea.addEventListener('input', function() {
          charCount.textContent = this.value.length;
          document.getElementById('parseStatus').classList.remove('active');
          document.getElementById('parseStatus').classList.remove('done');
        });
      }
    });

    // ============================================================
    // 加载基准门店
    // ============================================================
    async function loadRouteData(route) {
      try {
        let data = Auth.getCachedRouteData(route);
        if (!data) {
          const response = await fetch(`/api/route/${encodeURIComponent(route)}`);
          if (response.ok) data = await response.json();
        }
        if (data && data.stores) {
          baseStores = data.stores;
        }
        const todayOrders = getTodayOrders();
        if (todayOrders && todayOrders.length > 0) {
          const count = todayOrders.length;
          let totalWeight = 0;
          todayOrders.forEach(order => {
            const weight = parseFloat(order.weight) || 0;
            totalWeight += weight;
          });
          document.getElementById("storeCount").textContent = count + ' 家门店';
          document.getElementById("totalWeight").textContent = totalWeight.toFixed(1) + ' kg';
        } else {
          document.getElementById("storeCount").textContent = '无数据';
          document.getElementById("totalWeight").textContent = '无数据';
        }
        updateStatusDot();
      } catch (error) {
        console.error("加载数据失败:", error);
        document.getElementById("storeCount").textContent = '无数据';
        document.getElementById("totalWeight").textContent = '无数据';
        updateStatusDot();
      }
    }

    function getTodayOrders() {
      try {
        const data = localStorage.getItem('today_orders');
        return data ? JSON.parse(data) : null;
      } catch { return null; }
    }

    function saveTodayOrders(orders) {
      localStorage.setItem('today_orders', JSON.stringify(orders));
      saveToHistory(orders);
      Auth.saveCurrentUserData();
      loadRouteData(Auth.getCurrentRoute());
    }

    function saveToHistory(orders) {
      const today = new Date().toISOString().split('T')[0];
      const route = Auth.getCurrentRoute();
      let history = JSON.parse(localStorage.getItem('delivery_history') || '[]');
      let totalWeight = 0;
      orders.forEach(order => { totalWeight += order.weight || 0; });
      const record = {
        date: today, route, vehicle: localStorage.getItem('today_vehicle') || '渝DK7692',
        count: orders.length, weight: totalWeight.toFixed(1) + ' kg', orders
      };
      const index = history.findIndex(item => item.date === today);
      if (index >= 0) history[index] = record;
      else history.unshift(record);
      if (history.length > 100) history.length = 100;
      localStorage.setItem('delivery_history', JSON.stringify(history));
      Auth.saveCurrentUserData();
    }

    function updateStatusDot() {
      const dot = document.getElementById('statusDot');
      const todayOrders = getTodayOrders();
      if (todayOrders && todayOrders.length > 0) {
        dot.style.background = '#E74C3C';
      } else {
        dot.style.background = '#3498DB';
      }
    }

    // ============================================================
    // 菜单控制
    // ============================================================
    function openHomeMenu() {
      const menu = document.getElementById("homeMenu");
      menu.style.display = menu.style.display === "block" ? "none" : "block";
    }
    document.addEventListener("click", function(e) {
      const menu = document.getElementById("homeMenu");
      const btn = document.querySelector(".menu-btn");
      if (menu && !menu.contains(e.target) && !btn?.contains(e.target)) {
        menu.style.display = "none";
      }
    });

    function goToRouteEdit() { window.location.href = "pages/route_edit.html"; }
    function goToOrderDetail() { window.location.href = "pages/order_detail.html"; }
    function goToHistory() { window.location.href = "pages/history.html"; }
    function logout() {
      if (confirm("确定退出登录吗？")) Auth.logout();
    }

    // ============================================================
    // 上传弹窗
    // ============================================================
    function toggleUpload() {
      const overlay = document.getElementById("uploadOverlay");
      overlay.classList.toggle('active');
      if (!overlay.classList.contains('active')) {
        document.getElementById('parseStatus').classList.remove('active');
        document.getElementById('parseStatus').classList.remove('done');
      }
    }

    // ============================================================
    // 解析引擎（纯前端备用）
    // ============================================================
    function parseAndSortOrders(rawText) {
      const cleaned = rawText.replace(/ZW\w+/g, '').replace(/\s+/g, ' ').trim();
      const separators = /[->\n,，、；;]+/;
      let items = cleaned.split(separators).map(s => s.trim()).filter(s => s.length > 0);
      if (baseStores.length > 0) {
        const storeNames = baseStores.map(s => s.name);
        items.sort((a, b) => {
          const idxA = storeNames.findIndex(name => a.includes(name) || name.includes(a));
          const idxB = storeNames.findIndex(name => b.includes(name) || name.includes(b));
          return (idxA === -1 ? 9999 : idxA) - (idxB === -1 ? 9999 : idxB);
        });
      }
      return items;
    }

    // ============================================================
    // 显示解析进度动画
    // ============================================================
    function showParsingProgress(callback) {
      const statusEl = document.getElementById('parseStatus');
      const iconEl = document.getElementById('statusIcon');
      const textEl = document.getElementById('statusText');
      const barEl = document.getElementById('progressBar');
      const countEl = document.getElementById('statusCount');
      const tagsEl = document.getElementById('parsedTags');

      statusEl.classList.add('active');
      statusEl.classList.remove('done');
      iconEl.textContent = '⏳';
      textEl.textContent = '正在解析运单信息...';
      barEl.style.width = '0%';
      countEl.textContent = '';
      tagsEl.innerHTML = '';

      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 10 + 2;
        if (progress > 90) progress = 90;
        barEl.style.width = progress + '%';
      }, 100);

      setTimeout(() => {
        clearInterval(interval);
        barEl.style.width = '100%';
        setTimeout(() => {
          const result = callback();
          if (result && result.length > 0) {
            statusEl.classList.add('done');
            iconEl.textContent = '✅';
            textEl.textContent = `解析完成，识别到 ${result.length} 家门店`;
            countEl.textContent = '已按路线顺序排列';
            tagsEl.innerHTML = result.slice(0, 10).map((name, i) =>
              `<span class="tag"><span class="idx">${i+1}</span>${name}</span>`
            ).join('');
            if (result.length > 10) {
              tagsEl.innerHTML += `<span class="tag">+${result.length - 10} 家...</span>`;
            }
            parsedOrders = result;
            document.getElementById('manualOrderInput').value = result.join('\n');
            document.getElementById('charCount').textContent = result.join('\n').length;
            document.getElementById('confirmBtn').disabled = false;
          } else {
            iconEl.textContent = '⚠️';
            textEl.textContent = '未能识别到有效门店，请手动输入';
            barEl.style.width = '0%';
          }
        }, 300);
      }, 1200 + Math.random() * 800);
    }

    // ============================================================
    // 图片压缩（优化版）
    // ============================================================
    async function compressImage(file) {
      try {
        const options = {
          maxSizeMB: 0.15,          // 更小体积
          maxWidthOrHeight: 320,     // 更小尺寸
          useWebWorker: true,
          fileType: 'image/jpeg',    // 强制 JPEG
          initialQuality: 0.7
        };
        const compressedFile = await imageCompression(file, options);
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(compressedFile);
        });
      } catch (e) {
        // 压缩失败，返回原始文件（但可能仍失败）
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        });
      }
    }

    // ============================================================
    // 调用 OCR API
    // ============================================================
    async function callOCR(base64Image) {
      const pureBase64 = base64Image.split(',')[1] || base64Image;
      const route = Auth.getCurrentRoute();
      showParsingProgress(() => {});

      try {
        const response = await fetch('/api/ocr', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: pureBase64, route: route })
        });
        const result = await response.json();
        if (result.success && result.data) {
          const { stores, totalWeight, vehicle, matchRate, warning } = result.data;
          fillParsedResult(stores, totalWeight, vehicle);
          if (warning) {
            showToast('⚠️ ' + warning, 'warning');
          }
        } else {
          showToast('❌ ' + (result.error || '识别失败，请手动输入'), 'error');
        }
      } catch (e) {
        showToast('❌ 网络错误，请重试', 'error');
      }
    }

    // ============================================================
    // 填充解析结果
    // ============================================================
    function fillParsedResult(stores, totalWeight, vehicle) {
      const textarea = document.getElementById('manualOrderInput');
      textarea.value = stores.join('\n');
      document.getElementById('charCount').textContent = textarea.value.length;

      const statusEl = document.getElementById('parseStatus');
      statusEl.classList.add('active');
      statusEl.classList.remove('done');
      document.getElementById('statusIcon').textContent = '✅';
      document.getElementById('statusText').textContent = `解析完成，${stores.length} 家门店`;
      document.getElementById('statusCount').textContent = `总重量: ${totalWeight || '未识别'} | 车牌: ${vehicle || '未识别'}`;
      const tagsEl = document.getElementById('parsedTags');
      tagsEl.innerHTML = stores.slice(0, 10).map((name, i) =>
        `<span class="tag"><span class="idx">${i+1}</span>${name}</span>`
      ).join('');
      if (stores.length > 10) {
        tagsEl.innerHTML += `<span class="tag">+${stores.length - 10} 家...</span>`;
      }
      parsedOrders = stores;
      document.getElementById('confirmBtn').disabled = false;
    }

    // ============================================================
    // 上传处理（相册/文件）
    // ============================================================
    function triggerUpload(type) {
      const input = document.createElement("input");
      input.type = "file";
      if (type === 'album') {
        input.accept = "image/*";
      } else {
        input.accept = ".jpg,.png,.jpeg,.pdf,.xls,.xlsx,.csv,.txt";
      }
      input.click();
      input.onchange = function() {
        if (input.files && input.files[0]) {
          const file = input.files[0];
          Auth.addLog('文件上传', `上传: ${file.name}`);
          if (file.type.startsWith('image/')) {
            compressImage(file).then(compressedBase64 => {
              callOCR(compressedBase64);
            });
          } else {
            // 文本文件直接读取
            const reader = new FileReader();
            reader.onload = function(e) {
              const text = e.target.result;
              const sorted = parseAndSortOrders(text);
              fillParsedResult(sorted, '', '');
            };
            reader.readAsText(file);
          }
        }
        toggleUpload();
      };
    }

    // ============================================================
    // 手动输入解析
    // ============================================================
    function parseManualInput() {
      const rawText = document.getElementById('manualOrderInput').value.trim();
      if (!rawText) {
        showToast('⚠️ 请先输入运单信息', 'error');
        return;
      }
      showParsingProgress(() => {
        return parseAndSortOrders(rawText);
      });
    }

    // ============================================================
    // 快捷操作
    // ============================================================
    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('manualOrderInput').value = text;
        document.getElementById('charCount').textContent = text.length;
        showToast('✅ 已粘贴');
        parseManualInput();
      } catch (err) {
        alert('⚠️ 无法读取剪贴板，请手动 Ctrl+V');
      }
    }

    function clearManualInput() {
      if (confirm('清空内容？')) {
        document.getElementById('manualOrderInput').value = '';
        document.getElementById('charCount').textContent = '0';
        document.getElementById('parseStatus').classList.remove('active');
        document.getElementById('parseStatus').classList.remove('done');
        showToast('已清空', 'warning');
      }
    }

    function loadExampleData() {
      const example = `江北胡汪洋经销商 | 12.5 | 已送达
渝北中景隆贸易有限公司 | 8.3 | 配送中
江北重庆兴农融资担保集团 | 15.6 | 待配送`;
      document.getElementById('manualOrderInput').value = example;
      document.getElementById('charCount').textContent = example.length;
      showToast('📝 示例已加载');
      parseManualInput();
    }

    function showToast(msg, type = 'success') {
      let toast = document.getElementById('toast');
      if (!toast) {
        const div = document.createElement('div');
        div.id = 'toast';
        div.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#18212B;color:#fff;padding:10px 20px;border-radius:12px;z-index:9999;font-size:13px;max-width:90%;text-align:center;border-left:3px solid #27AE60;';
        document.body.appendChild(div);
        toast = div;
      }
      toast.textContent = msg;
      toast.style.display = 'block';
      toast.className = 'toast show ' + type;
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    // ============================================================
    // 提交录入（云端保存）
    // ============================================================
    function submitManualOrder() {
      const rawText = document.getElementById('manualOrderInput').value.trim();
      if (!rawText) {
        alert('⚠️ 请先录入运单数据');
        return;
      }
      if (parsedOrders.length === 0) {
        parsedOrders = rawText.split('\n').filter(s => s.trim());
      }
      if (parsedOrders.length === 0) {
        alert('⚠️ 请至少录入一条门店');
        return;
      }
      doSaveAndNavigate();
    }

    function doSaveAndNavigate() {
      const route = Auth.getCurrentRoute();
      const orders = parsedOrders;
      const countEl = document.getElementById('statusCount');
      let totalWeight = '';
      let vehicle = '';
      if (countEl) {
        const text = countEl.textContent;
        const weightMatch = text.match(/总重量:\s*([^\s|]+)/);
        if (weightMatch) totalWeight = weightMatch[1];
        const vehicleMatch = text.match(/车牌:\s*([^\s|]+)/);
        if (vehicleMatch) vehicle = vehicleMatch[1];
      }

      fetch('/api/order/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ route, orders, totalWeight, vehicle })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          Auth.addLog('运单录入', `录入 ${orders.length} 条运单`);
          toggleUpload();
          window.location.href = "pages/order_detail.html";
        } else {
          alert('❌ 保存失败，请重试');
        }
      })
      .catch(err => {
        alert('❌ 网络错误，请重试');
      });
    }

    // ============================================================
    // 点击外部关闭
    // ============================================================
    document.getElementById('uploadOverlay').addEventListener('click', function(e) {
      if (e.target === this) toggleUpload();
    });

    // ============================================================
    // 兼容原有函数
    // ============================================================
    function openTodayRoute() { window.location.href = "pages/order_detail.html"; }
    function openHistory() { window.location.href = "pages/history.html"; }
  </script>
</body>
</html>
