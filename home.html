<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>Zhipei One · 智配 One</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">
<header class="top-bar">
  <div class="brand-info"><div class="brand-name">智配 One</div><div class="brand-sub">智能配送 · 一路领先</div></div>
  <button class="menu-btn" type="button" onclick="openHomeMenu()" aria-label="打开菜单">☰</button>
</header>
<div id="homeMenu" class="home-menu">
  <div class="current-line" id="menuRoute">加载中...</div>
  <div class="home-menu-item" onclick="location.href='settings.html'">👤 账户设置</div>
  <div class="home-menu-item" onclick="goToRouteEdit()">⚙ 原始数据</div>
  <div class="home-menu-item logout-item" onclick="logout()">🚪 退出登录</div>
</div>
<section class="task-card" id="taskCard">
  <div class="task-title"><div class="task-name">当日任务 <span class="status-dot" id="statusDot"></span></div><div class="vehicle-area" id="homeRoute">加载中...</div></div>
  <div class="task-main">
    <div class="task-info"><div>当日配送：<strong id="storeCount">无数据</strong></div><div>总体重量：<strong id="totalWeight">无数据</strong></div></div>
    <div class="delivery-man"><img src="assets/delivery-route.png" alt="配送路线" onerror="this.style.display='none';this.parentElement.textContent='🚚'"></div>
  </div>
</section>
<div class="function-list">
  <button class="function-btn" type="button" onclick="toggleUpload()"><span class="function-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></span>上传运单</button>
  <button class="function-btn" type="button" onclick="goToOrderDetail()"><span class="function-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11.1A7 7 0 0 0 5 9.9C5 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.3"/><path d="M4 18.5h3M17 18.5h3"/></svg></span>当日路线</button>
  <button class="function-btn" type="button" onclick="goToHistory()"><span class="function-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 5v4h4"/><path d="M12 7.5v5l3.2 1.9"/></svg></span>历史查询</button>
</div>
<div class="upload-overlay" id="uploadOverlay">
  <div class="upload-sheet">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-title">📤 上传运单</div>
    <div class="upload-icons">
      <button class="upload-icon-btn" type="button" aria-label="拍摄"><input id="ocrCameraInput" class="ocr-file-input" type="file" accept="image/*" capture="environment"><span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5h3l1.4-2h3.2l1.4 2H16a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3Z"/><circle cx="10" cy="13.5" r="3.2"/><path d="M16 11h.01"/></svg></span><span class="icon-label">拍摄</span></button>
      <button class="upload-icon-btn" type="button" aria-label="相册"><input id="ocrAlbumInput" class="ocr-file-input" type="file" accept="image/*" multiple><span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4.5 17 4.5-4 3 2.5 5 4.5"/></svg></span><span class="icon-label">相册</span></button>
      <button class="upload-icon-btn" type="button" aria-label="文件"><input id="ocrFileInput" class="ocr-file-input" type="file" accept="*/*" multiple><span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v5h5M9 12h6M9 16h6"/></svg></span><span class="icon-label">文件</span></button>
    </div>
    <div class="parse-status" id="parseStatus"><div class="status-row"><span id="statusIcon" class="status-icon" aria-hidden="true"></span><span id="statusText" data-text="等待处理...">等待处理...</span></div><div id="statusDetail" class="status-detail" aria-live="polite"></div></div>
    <div class="input-area"><textarea id="manualOrderInput" rows="10" placeholder="上传图片后，这里显示识别文字。请核对后再开始解析，也可直接粘贴运单文字。" autocomplete="off"></textarea></div>
    <div class="quick-actions"><button type="button" onclick="parseManualInput()">规划</button><button type="button" onclick="pasteFromClipboard()">粘贴</button><button type="button" onclick="clearManualInput()">清空</button></div>
    <div class="sheet-footer"><button class="btn-cancel" type="button" onclick="cancelParse();toggleUpload()">取消</button><button class="btn-confirm" id="confirmBtn" type="button" onclick="submitManualOrder()">确认录入</button></div>
  </div>
</div>
<script src="js/auth.js"></script>
<script src="js/home_status.js"></script>
<script src="js/home.js"></script>
<script src="js/paddle_ocr.js"></script>
<script src="js/home_confirm.js"></script>
</body>
</html>
