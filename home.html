<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智配One</title>
  <!-- 引入图片压缩库 -->
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== Uber风格上传弹窗 ===== */
    .upload-overlay {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 999;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
    }
    .upload-overlay.active { display: flex; }
    .upload-sheet {
      width: 100%;
      max-width: 420px;
      background: rgba(28,37,48,0.92);
      border-radius: 28px;
      padding: 20px 20px 28px;
      animation: slideUp 0.35s cubic-bezier(0.22,1,0.36,1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.05);
      margin: 0 auto;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      margin: 0 auto 14px auto;
    }
    .sheet-title {
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }
    .sheet-subtitle {
      text-align: center;
      font-size: 12px;
      color: #5A6A7A;
      margin-bottom: 20px;
    }
    .upload-icons {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .upload-icon-btn {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      color: #7F8B98;
    }
    .upload-icon-btn:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.08);
      transform: translateY(-2px);
    }
    .upload-icon-btn:active {
      transform: scale(0.92);
      background: rgba(255,255,255,0.10);
    }
    .upload-icon-btn .icon {
      font-size: 28px;
      line-height: 1;
      transition: all 0.3s ease;
      filter: grayscale(0.2);
    }
    .upload-icon-btn .icon-label {
      font-size: 10px;
      color: #4A5A6A;
      margin-top: 4px;
      letter-spacing: 0.3px;
      font-weight: 400;
    }
    .upload-icon-btn .ripple {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      pointer-events: none;
      border: 1px solid rgba(36,87,166,0.2);
      opacity: 0;
      transition: all 0.5s ease;
    }
    .upload-icon-btn.loading .ripple {
      opacity: 1;
      animation: ripplePulse 1.2s ease-out infinite;
    }
    @keyframes ripplePulse {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.06); opacity: 0; }
    }
    .upload-icon-btn .badge-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #27AE60;
      border: 2px solid #1C2530;
      display: none;
    }
    .upload-icon-btn.done .badge-dot { display: block; }
    .divider-line {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 6px 0 16px 0;
    }
    .divider-line hr {
      flex: 1;
      border: none;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .divider-line span {
      color: #3A4A5A;
      font-size: 11px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .parse-status {
      background: rgba(0,0,0,0.25);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      min-height: 50px;
      display: none;
      border: 1px solid rgba(255,255,255,0.03);
      transition: all 0.4s ease;
    }
    .parse-status.active { display: block; }
    .parse-status .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .parse-status .status-icon { font-size: 18px; flex-shrink: 0; }
    .parse-status .status-text {
      font-size: 13px;
      color: #B8C2CC;
      flex: 1;
    }
    .parse-status .status-text strong { color: #fff; font-weight: 500; }
    .parse-status .status-progress {
      margin-top: 8px;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    .parse-status .status-progress .bar {
      height: 100%;
      background: linear-gradient(90deg, #2457A6, #4A8FD4);
      border-radius: 2px;
      width: 0%;
      transition: width 0.15s ease;
    }
    .parse-status.done .status-icon { color: #27AE60; }
    .parse-status.done .status-text { color: #27AE60; }
    .parse-status .status-count {
      font-size: 12px;
      color: #5A6A7A;
      margin-top: 4px;
    }
    .parse-status .status-count span { color: #fff; font-weight: 600; }
    .parsed-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
      max-height: 60px;
      overflow-y: auto;
    }
    .parsed-tags .tag {
      background: rgba(36,87,166,0.15);
      border: 1px solid rgba(36,87,166,0.08);
      border-radius: 16px;
      padding: 2px 10px;
      font-size: 11px;
      color: #B8C2CC;
      animation: tagFadeIn 0.3s ease;
    }
    @keyframes tagFadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    .parsed-tags .tag .idx { color: #4A5A6A; margin-right: 3px; }

    .input-area {
      position: relative;
      margin-bottom: 12px;
    }
    .input-area textarea {
      width: 100%;
      max-height: 120px;
      min-height: 70px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 14px;
      padding: 12px 14px 26px 14px;
      color: #fff;
      font-size: 13px;
      resize: vertical;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s ease;
      line-height: 1.6;
    }
    .input-area textarea:focus {
      border-color: rgba(36,87,166,0.4);
    }
    .input-area textarea::placeholder { color: #3A4A5A; }
    .input-area .char-count {
      position: absolute;
      bottom: 8px;
      right: 12px;
      color: #3A4A5A;
      font-size: 10px;
      pointer-events: none;
    }

    .quick-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .quick-actions button {
      flex: 1;
      min-width: 50px;
      padding: 6px 8px;
      border-radius: 10px;
      backgro
