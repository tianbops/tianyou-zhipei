<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>Zhipei One · 智配 One</title>
<link rel="stylesheet" href="css/style.css?v=20260921-9">
</head>
<body>

<div class="app-container">
<header class="top-bar">
  <div class="brand-info"><div class="brand-name">智配 One</div><div class="brand-sub">智能配送 · 一路领先</div></div>
  <button class="menu-btn" type="button" onclick="openHomeMenu()" aria-label="打开菜单">☰</button>
</header>
<div id="homeMenu" class="home-menu">
  <div class="current-line" id="menuRoute">加载中...</div>
  <div class="home-menu-item" onclick="location.href='settings.html'">👤 账户设置</div>
  <div class="home-menu-item" onclick="goToRouteEdit()">⚙ 原始数据</div>
  <div class="home-menu-item logout-item" onclick="logout()">🚪 退出登录</div>
</div>
<section class="task-card" id="taskCard">
  <div class="task-title"><div class="task-name">当日任务 <span class="status-dot" id="statusDot"></span></div><div class="vehicle-area" id="homeRoute">加载中...</div></div>
  <div class="task-main">
    <div class="task-info"><div>当日配送：<strong id="storeCount">无数据</strong></div><div>总体重量：<strong id="totalWeight">无数据</strong></div></div>
    <div class="delivery-man"><img src="assets/delivery-route.png" alt="配送路线" onerror="this.style.display='none';this.parentElement.textContent='🚚'"></div>
  </div>
</section>
<div class="function-list">
  <button class="function-btn" type="button" onclick="toggleUpload()"><span class="function-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></span>上传运单</button>
  <button class="function-btn" type="button" onclick="goToOrderDetail()"><span class="function-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11.1A7 7 0 0 0 5 9.9C5 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.3"/><path d="M4 18.5h3M17 18.5h3"/></svg></span>当日路线</button>
  <button class="function-btn" type="button" onclick="goToHistory()"><span class="function-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 5v4h4"/><path d="M12 7.5v5l3.2 1.9"/></svg></span>历史查询</button>
</div>
<div class="upload-overlay" id="uploadOverlay">
  <div class="upload-sheet">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="upload-source-menu active" id="uploadSourceMenu" aria-hidden="false">
      <div class="source-menu-title">上传运单</div>
      <div class="source-menu-options">
        <label class="source-option"><input id="ocrCameraInput" type="file" accept="image/*" capture="environment"><span>📷</span><strong>拍摄</strong></label>
        <label class="source-option"><input id="ocrAlbumInput" type="file" accept="image/*" multiple><span>🖼️</span><strong>相册</strong></label>
        <button class="source-option" id="fileSourceButton" type="button" onclick="openFileManager()"><span>📁</span><strong>文件</strong></button><input id="ocrFileInput" class="fallback-file-input" type="file" accept="image/jpeg,image/png,image/webp" multiple aria-hidden="true">
      </div>
      <button class="source-menu-cancel" type="button" onclick="clearManualInput();cancelParse();toggleUpload()">取消</button>
    </div>
    <div class="parse-status" id="parseStatus"><div class="status-row"><span id="statusIcon" class="status-icon" aria-hidden="true"></span><span id="statusText" data-text="等待处理...">等待处理...</span></div><div id="statusDetail" class="status-detail" aria-live="polite"></div></div>
    <div class="input-area"><div class="detail-toggle" id="ocrTextToggle" role="button" tabindex="0" aria-expanded="false" onclick="toggleOCRText()">规划详情 <span>›</span></div><textarea id="manualOrderInput" rows="10" placeholder="上传运单后，这里显示识别文字，请核对后规划路线。" autocomplete="off"></textarea></div>
    <div class="review-summary" id="reviewSummary" hidden role="button" tabindex="0" onclick="openCorrectionDetails()">修正详情 <span id="reviewCount">0</span> 项 <span>›</span></div>
    <div class="sheet-footer">
      <button class="btn-cancel" type="button" onclick="clearManualInput();cancelParse();toggleUpload()">取消</button>
      <button class="btn-primary-action" id="primaryActionBtn" type="button" onclick="handlePrimaryAction()">规划路线</button>
    </div>
  </div>
</div>
<div class="correction-modal" id="correctionModal" aria-hidden="true">
  <div class="correction-panel" role="dialog" aria-modal="true" aria-labelledby="correctionTitle">
    <div class="correction-header"><div class="correction-title" id="correctionTitle">修正详情</div><button class="correction-close" id="correctionClose" type="button" aria-label="关闭">×</button></div>
    <div class="correction-list" id="correctionList"></div>
  </div>
</div>
<script src="js/auth.js?v=20260920-5"></script>
<script src="js/home_status.js?v=20260921-3"></script>
<script src="js/home.js?v=20260921-6"></script>
<script src="js/paddle_ocr.js?v=20260920-5"></script>
<script src="js/home_confirm.js?v=20260920-2"></script>
</body>
</html>
