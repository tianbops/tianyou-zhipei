<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>智配One</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}body{background:#05070A;color:#fff;font-family:"Microsoft YaHei",Arial,sans-serif;min-height:100vh}.app-container{max-width:420px;min-height:100vh;margin:0 auto;padding:20px 16px;background:#05070A;position:relative}.top-bar{height:60px;display:flex;align-items:center;justify-content:space-between}.brand-info{display:flex;flex-direction:column;line-height:1.2}.brand-name{font-size:20px;font-weight:bold;letter-spacing:1px}.brand-sub{font-size:11px;color:#7F8B98;letter-spacing:2px;margin-top:2px}.menu-btn{width:42px;height:42px;background:#18212B;border:0;border-radius:50%;color:#fff;font-size:23px;cursor:pointer}.task-card{background:#1C2530;border-radius:22px;padding:20px;margin-top:20px}.task-title{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:bold}.task-name{display:flex;align-items:center;gap:12px}.status-dot{width:12px;height:12px;display:inline-block;border-radius:50%}.task-main{display:flex;justify-content:space-between;align-items:flex-end;margin-top:25px}.task-info{font-size:18px;line-height:45px}.task-info strong{font-size:20px}.delivery-man{width:120px;height:100px;display:flex;align-items:center;justify-content:center}.delivery-man img{width:100%;height:100%;object-fit:contain}.function-list{margin-top:30px}.function-btn{width:100%;height:70px;background:#18212B;border:0;border-radius:18px;margin-bottom:18px;color:#fff;font-size:18px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}.upload-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:999;align-items:flex-end;justify-content:center;padding:16px}.upload-overlay.active{display:flex}.upload-sheet{width:100%;max-width:420px;background:rgba(28,37,48,.96);border-radius:28px;padding:20px;backdrop-filter:blur(20px)}.upload-icons{display:flex;gap:16px;justify-content:center;margin-bottom:20px}.upload-icon-btn{width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#7F8B98}.upload-icon-btn .icon{font-size:28px}.upload-icon-btn .icon-label{font-size:10px;color:#4A5A6A;margin-top:4px}.divider-line{display:flex;align-items:center;gap:12px;margin:6px 0 16px}.divider-line hr{flex:1;border:0;border-top:1px solid rgba(255,255,255,.04)}.divider-line span{color:#3A4A5A;font-size:11px}.parse-status{background:rgba(0,0,0,.25);border-radius:14px;padding:14px 16px;margin-bottom:12px;display:none}.parse-status.active{display:block}.input-area textarea{width:100%;max-height:120px;min-height:70px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.04);border-radius:14px;padding:12px 14px;color:#fff;font-size:13px;resize:vertical;font-family:inherit;outline:0;line-height:1.6}.quick-actions{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.quick-actions button{flex:1;min-width:50px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.03);color:#5A6A7A;font-size:11px;cursor:pointer}.sheet-footer{display:flex;gap:10px}.sheet-footer button{height:44px;border-radius:14px;border:0;font-size:15px;cursor:pointer}.btn-cancel{flex:1;background:rgba(255,255,255,.04);color:#5A6A7A}.btn-confirm{flex:2;background:#2457A6;color:#fff;font-weight:600}.home-menu{display:none;position:absolute;right:20px;top:75px;width:170px;background:#18212B;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:999}.current-line{height:60px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.08)}.home-menu-item{height:55px;display:flex;align-items:center;padding-left:22px;font-size:16px;cursor:pointer}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#18212B;color:#fff;padding:10px 20px;border-radius:12px;z-index:9999;font-size:13px;max-width:90%;text-align:center;display:none;border-left:3px solid #27AE60}.toast.show{display:block}.toast.warning{border-left-color:#FFB020}.toast.error{border-left-color:#E74C3C}#error-box{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#E74C3C;color:#fff;padding:12px 20px;border-radius:8px;z-index:9999;max-width:90%;text-align:center;display:none}#error-box.show{display:block}
  </style>
</head>
<body>
<div id="error-box"></div>
<div class="app-container">
<header class="top-bar"><div class="brand-info"><div class="brand-name">智配One</div><div class="brand-sub">智能配送 · 一路领先</div></div><button class="menu-btn" onclick="openHomeMenu()">☰</button></header>
<div id="homeMenu" class="home-menu"><div class="current-line" id="menuRoute">加载中...</div><div class="home-menu-item" onclick="goToRouteEdit()">⚙ 原始数据</div><div class="home-menu-item" onclick="logout()" style="color:#FFB020">🚪 退出登录</div></div>
<section class="task-card"><div class="task-title"><div class="task-name">今日任务 <span class="status-dot" id="statusDot"></span></div><div class="vehicle-area" id="homeRoute">加载中...</div></div><div class="task-main"><div class="task-info"><div>待配送：<strong id="storeCount">无数据</strong></div><div>总重量：<strong id="totalWeight">无数据</strong></div></div><div class="delivery-man"><img src="assets/delivery-route.png" alt="配送路线" onerror="this.style.display='none';this.parentElement.textContent='🚚'"></div></div></section>
<div class="function-list"><button class="function-btn" onclick="toggleUpload()"><span>📷</span> 上传运单</button><button class="function-btn" onclick="goToOrderDetail()"><span>🗺</span> 今日路线</button><button class="function-btn" onclick="goToHistory()"><span>◷</span> 历史查询</button></div>
<div class="upload-overlay" id="uploadOverlay"><div class="upload-sheet"><div style="width:36px;height:4px;background:rgba(255,255,255,.15);border-radius:4px;margin:0 auto 14px"></div><div style="text-align:center;font-size:18px;font-weight:600;margin-bottom:4px">📤 上传运单</div><div style="text-align:center;font-size:12px;color:#5A6A7A;margin-bottom:20px">从相册选取或上传文件</div><div class="upload-icons"><div class="upload-icon-btn" onclick="triggerUpload('album')"><span class="icon">🖼️</span><span class="icon-label">相册</span></div><div class="upload-icon-btn" onclick="triggerUpload('file')"><span class="icon">📄</span><span class="icon-label">文件</span></div></div><div class="divider-line"><hr><span>或手动输入</span><hr></div><div class="parse-status" id="parseStatus"><div style="display:flex;align-items:center;gap:10px"><span id="statusIcon">⏳</span><span id="statusText">正在解析...</span></div><div style="margin-top:8px;height:2px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden"><div id="progressBar" style="height:100%;background:#2457A6;width:0%"></div></div><div id="statusCount" style="font-size:12px;color:#5A6A7A;margin-top:4px"></div><div id="parsedTags" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;max-height:60px;overflow-y:auto"></div></div><div class="input-area"><textarea id="manualOrderInput" rows="3" placeholder="输入门店名称，每行一个&#10;或粘贴运单列表"></textarea><span id="charCount" style="display:block;text-align:right;color:#3A4A5A;font-size:10px;margin-top:2px">0</span></div><div class="quick-actions"><button onclick="pasteFromClipboard()">📋 粘贴</button><button onclick="clearManualInput()">🗑️ 清空</button><button onclick="loadExampleData()">📝 示例</button><button onclick="parseManualInput()">🔍 解析</button></div><div class="sheet-footer"><button class="btn-cancel" onclick="toggleUpload()">取消</button><button class="btn-confirm" id="confirmBtn" onclick="submitManualOrder()">确认录入</button></div></div></div>
</div>
<script src="js/auth.js"></script>
<script src="js/order_engine.js"></script>
<script src="js/home.js"></script>
</body>
</html>
