<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智配One</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== Uber风格上传弹窗 ===== */
    .upload-overlay {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 999;
      align-items: flex-end;
      justify-content: center;
    }
    .upload-overlay.active {
      display: flex;
    }
    .upload-sheet {
      width: 100%;
      max-width: 420px;
      background: rgba(28, 37, 48, 0.92);
      border-radius: 32px 32px 0 0;
      padding: 28px 24px 34px;
      animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.06);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* 顶部指示条 */
    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      margin: 0 auto 18px auto;
    }

    .sheet-title {
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .sheet-subtitle {
      text-align: center;
      font-size: 13px;
      color: #7F8B98;
      margin-bottom: 24px;
    }

    /* ===== 双图标按钮（Uber风格） ===== */
    .upload-icons {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .upload-icon-btn {
      width: 100px;
      height: 100px;
      border-radius: 24px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      color: #7F8B98;
    }
    .upload-icon-btn:hover {
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-2px);
    }
    .upload-icon-btn:active {
      transform: scale(0.94);
    }
    .upload-icon-btn .icon {
      font-size: 40px;
      line-height: 1;
      transition: all 0.3s ease;
    }
    .upload-icon-btn .icon-label {
      font-size: 11px;
      color: #5A6A7A;
      margin-top: 8px;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    .upload-icon-btn .ripple {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      pointer-events: none;
      border: 1px solid rgba(36, 87, 166, 0.3);
      opacity: 0;
      transition: all 0.6s ease;
    }
    .upload-icon-btn.loading .ripple {
      opacity: 1;
      animation: ripplePulse 1.2s ease-out infinite;
    }
    @keyframes ripplePulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.08); opacity: 0; }
    }
    .upload-icon-btn .badge-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #27AE60;
      border: 2px solid #1C2530;
      display: none;
    }
    .upload-icon-btn.done .badge-dot {
      display: block;
    }

    /* 分隔线 */
    .divider-line {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 8px 0 18px 0;
    }
    .divider-line hr {
      flex: 1;
      border: none;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .divider-line span {
      color: #4A5A6A;
      font-size: 12px;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    /* ===== 解析状态显示 ===== */
    .parse-status {
      background: rgba(0,0,0,0.3);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 14px;
      min-height: 60px;
      display: none;
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.4s ease;
    }
    .parse-status.active {
      display: block;
    }
    .parse-status .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .parse-status .status-icon {
      font-size: 20px;
      flex-shrink: 0;
    }
    .parse-status .status-text {
      font-size: 14px;
      color: #B8C2CC;
      flex: 1;
    }
    .parse-status .status-text strong {
      color: #fff;
      font-weight: 500;
    }
    .parse-status .status-progress {
      margin-top: 10px;
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .parse-status .status-progress .bar {
      height: 100%;
      background: linear-gradient(90deg, #2457A6, #4A8FD4);
      border-radius: 4px;
      width: 0%;
      transition: width 0.15s ease;
    }

    /* 解析完成时 */
    .parse-status.done .status-icon { color: #27AE60; }
    .parse-status.done .status-text { color: #27AE60; }
    .parse-status .status-count {
      font-size: 13px;
      color: #7F8B98;
      margin-top: 6px;
    }
    .parse-status .status-count span {
      color: #fff;
      font-weight: 600;
    }

    /* ===== 手动输入区 ===== */
    .input-area {
      position: relative;
      margin-bottom: 14px;
    }
    .input-area textarea {
      width: 100%;
      max-height: 140px;
      min-height: 80px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 14px 16px 30px 16px;
      color: #fff;
      font-size: 14px;
      resize: vertical;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s ease;
      line-height: 1.7;
    }
    .input-area textarea:focus {
      border-color: rgba(36, 87, 166, 0.5);
    }
    .input-area textarea::placeholder {
      color: #4A5A6A;
    }
    .input-area .char-count {
      position: absolute;
      bottom: 10px;
      right: 14px;
      color: #4A5A6A;
      font-size: 11px;
      pointer-events: none;
    }

    /* ===== 快捷操作 ===== */
    .quick-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .quick-actions button {
      flex: 1;
      min-width: 60px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.04);
      color: #7F8B98;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .quick-actions button:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }
    .quick-actions button:active { transform: scale(0.96); }
    .quick-actions button .emoji { font-size: 16px; }

    /* ===== 底部按钮 ===== */
    .sheet-footer {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }
    .sheet-footer .btn-cancel {
      flex: 1;
      height: 50px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: none;
      color: #7F8B98;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .sheet-footer .btn-cancel:hover {
      background: rgba(255,255,255,0.08);
    }
    .sheet-footer .btn-confirm {
      flex: 2;
      height: 50px;
      border-radius: 16px;
      background: #2457A6;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      position: relative;
      overflow: hidden;
    }
    .sheet-footer .btn-confirm:active { transform: scale(0.96); }
    .sheet-footer .btn-confirm:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* ===== 解析结果标签 ===== */
    .parsed-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      max-height: 80px;
      overflow-y: auto;
    }
    .parsed-tags .tag {
      background: rgba(36, 87, 166, 0.2);
      border: 1px solid rgba(36, 87, 166, 0.15);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      color: #B8C2CC;
      animation: tagFadeIn 0.3s ease;
    }
    @keyframes tagFadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    .parsed-tags .tag .idx {
      color: #4A5A6A;
      margin-right: 4px;
    }
    .parsed-tags .tag.highlight {
      background: rgba(39, 174, 96, 0.15);
      border-color: rgba(39, 174, 96, 0.2);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <div class="brand-info">
        <div class="brand-name">智配One</div>
        <div class="brand-sub">智能配送 · 一路领先</div>
      </div>
      <button class="menu-btn" onclick="openHomeMenu()">☰</button>
    </header>

    <div id="homeMenu" class="home-menu">
      <div class="current-line" id="menuRoute">加载中...</div>
      <div class="home-menu-item" onclick="goToRouteEdit()">⚙ 原始数据</div>
      <div class="home-menu-item" onclick="logout()" style="color:#FFB020;">🚪 退出登录</div>
    </div>

    <section class="task-card">
      <div class="task-title">
        <div class="task-name">今日任务 <span class="status-dot" id="statusDot"></span></div>
        <div class="vehicle-area" id="homeRoute">加载中...</div>
      </div>
      <div class="task-main">
        <div class="task-info">
          <div>待配送：<strong id="storeCount">无数据</strong></div>
          <div>总重量：<strong id="totalWeight">无数据</strong></div>
        </div>
        <div class="delivery-man">🚚</div>
      </div>
    </section>

    <div class="function-list">
      <button class="function-btn upload-btn" onclick="toggleUpload()">
        <span>📷</span> 上传运单
      </button>
      <button class="function-btn" onclick="goToOrderDetail()">
        <span>🗺</span> 今日路线
      </button>
      <button class="function-btn" onclick="goToHistory()">
        <span>◷</span> 历史查询
      </button>
    </div>

    <!-- ===== Uber风格上传弹窗 ===== -->
    <div class="upload-overlay" id="uploadOverlay">
      <div class="upload-sheet">
        <!-- 顶部指示条 -->
        <div class="sheet-handle"></div>
        
        <div class="sheet-title">📤 上传运单</div>
        <div class="sheet-subtitle">拍照或选择文件，自动识别门店</div>

        <!-- 双图标按钮（无文字） -->
        <div class="upload-icons">
          <div class="upload-icon-btn" id="cameraBtn" onclick="triggerUpload('camera')">
            <span class="icon">📷</span>
            <span class="icon-label">拍照</span>
            <span class="ripple"></span>
            <span class="badge-dot"></span>
          </div>
          <div class="upload-icon-btn" id="fileBtn" onclick="triggerUpload('file')">
            <span class="icon">📄</span>
            <span class="icon-label">文件</span>
            <span class="ripple"></span>
            <span class="badge-dot"></span>
          </div>
        </div>

        <!-- 分隔线 -->
        <div class="divider-line">
          <hr><span>或手动输入</span><hr>
        </div>

        <!-- ===== 解析状态显示 ===== -->
        <div class="parse-status" id="parseStatus">
          <div class="status-row">
            <span class="status-icon" id="statusIcon">⏳</span>
            <span class="status-text" id="statusText">正在解析运单信息...</span>
          </div>
          <div class="status-progress"><div class="bar" id="progressBar"></div></div>
          <div class="status-count" id="statusCount"></div>
          <div class="parsed-tags" id="parsedTags"></div>
        </div>

        <!-- 手动输入区 -->
        <div class="input-area">
          <textarea id="manualOrderInput" rows="3" placeholder="输入门店名称，每行一个&#10;或粘贴运单列表"></textarea>
          <span class="char-count" id="charCount">0</span>
        </div>

        <!-- 快捷操作 -->
        <div class="quick-actions">
          <button onclick="pasteFromClipboard()"><span class="emoji">📋</span> 粘贴</button>
          <button onclick="clearManualInput()"><span class="emoji">🗑️</span> 清空</button>
          <button onclick="loadExampleData()"><span class="emoji">📝</span> 示例</button>
          <button onclick="parseManualInput()"><span class="emoji">🔍</span> 解析</button>
        </div>

        <!-- 底部按钮 -->
        <div class="sheet-footer">
          <button class="btn-cancel" onclick="toggleUpload()">取消</button>
          <button class="btn-confirm" id="confirmBtn" onclick="submitManualOrder()">确认录入</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // ============================================================
    // 全局变量
    // ============================================================
    let baseStores = [];
    let parsedOrders = [];
    let isParsing = false;

    // ============================================================
    // 页面初始化
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      if (!Auth.checkAuth()) return;
      const route = Auth.getCurrentRoute();
      document.getElementById("menuRoute").textContent = route;
      document.getElementById("homeRoute").textContent = route;
      loadRouteData(route);
      updateStatusDot();
      
      const textarea = document.getElementById('manualOrderInput');
      const charCount = document.getElementById('charCount');
      if (textarea && charCount) {
        textarea.addEventListener('input', function() {
          charCount.textContent = this.value.length;
          // 输入时自动隐藏解析状态
          document.getElementById('parseStatus').classList.remove('active');
        });
      }
    });

    // ============================================================
    // 加载基准门店
    // ============================================================
    async function loadRouteData(route) {
      try {
        let data = Auth.getCachedRouteData(route);
        if (!data) {
          const response = await fetch(`/api/route/${encodeURIComponent(route)}`);
          if (response.ok) data = await response.json();
        }
        if (data && data.stores) {
          baseStores = data.stores;
        }
        const todayOrders = getTodayOrders();
        if (todayOrders && todayOrders.length > 0) {
          const count = todayOrders.length;
          let totalWeight = 0;
          todayOrders.forEach(order => {
            const weight = parseFloat(order.weight) || 0;
            totalWeight += weight;
          });
          document.getElementById("storeCount").textContent = count + ' 家门店';
          document.getElementById("totalWeight").textContent = totalWeight.toFixed(1) + ' kg';
        } else {
          document.getElementById("storeCount").textContent = '无数据';
          document.getElementById("totalWeight").textContent = '无数据';
        }
        updateStatusDot();
      } catch (error) { 
        console.error("加载数据失败:", error);
        document.getElementById("storeCount").textContent = '无数据';
        document.getElementById("totalWeight").textContent = '无数据';
        updateStatusDot();
      }
    }

    function getTodayOrders() {
      try {
        const data = localStorage.getItem('today_orders');
        return data ? JSON.parse(data) : null;
      } catch { return null; }
    }

    function saveTodayOrders(orders) {
      localStorage.setItem('today_orders', JSON.stringify(orders));
      saveToHistory(orders);
      Auth.saveCurrentUserData();
      loadRouteData(Auth.getCurrentRoute());
    }

    function saveToHistory(orders) {
      const today = new Date().toISOString().split('T')[0];
      const route = Auth.getCurrentRoute();
      let history = JSON.parse(localStorage.getItem('delivery_history') || '[]');
      let totalWeight = 0;
      orders.forEach(order => { totalWeight += order.weight || 0; });
      const record = {
        date: today, route, vehicle: localStorage.getItem('today_vehicle') || '渝DK7692',
        count: orders.length, weight: totalWeight.toFixed(1) + ' kg', orders
      };
      const index = history.findIndex(item => item.date === today);
      if (index >= 0) history[index] = record;
      else history.unshift(record);
      if (history.length > 100) history.length = 100;
      localStorage.setItem('delivery_history', JSON.stringify(history));
      Auth.saveCurrentUserData();
    }

    function updateStatusDot() {
      const dot = document.getElementById('statusDot');
      const todayOrders = getTodayOrders();
      if (todayOrders && todayOrders.length > 0) {
        dot.style.background = '#E74C3C';
      } else {
        dot.style.background = '#3498DB';
      }
    }

    // ============================================================
    // 菜单控制
    // ============================================================
    function openHomeMenu() {
      const menu = document.getElementById("homeMenu");
      menu.style.display = menu.style.display === "block" ? "none" : "block";
    }
    document.addEventListener("click", function(e) {
      const menu = document.getElementById("homeMenu");
      const btn = document.querySelector(".menu-btn");
      if (menu && !menu.contains(e.target) && !btn?.contains(e.target)) {
        menu.style.display = "none";
      }
    });

    function goToRouteEdit() { window.location.href = "pages/route_edit.html"; }
    function goToOrderDetail() { window.location.href = "pages/order_detail.html"; }
    function goToHistory() { window.location.href = "pages/history.html"; }

    function logout() {
      if (confirm("确定退出登录吗？")) Auth.logout();
    }

    // ============================================================
    // 上传弹窗
    // ============================================================
    function toggleUpload() {
      const overlay = document.getElementById("uploadOverlay");
      overlay.classList.toggle('active');
      if (!overlay.classList.contains('active')) {
        // 关闭时重置解析状态
        document.getElementById('parseStatus').classList.remove('active');
        document.getElementById('parseStatus').classList.remove('done');
      }
    }

    // ============================================================
    // 解析引擎
    // ============================================================
    function parseAndSortOrders(rawText) {
      // 清理无用字符
      const cleaned = rawText.replace(/ZW\w+/g, '').replace(/\s+/g, ' ').trim();
      const separators = /[->\n,，、；;]+/;
      let items = cleaned.split(separators).map(s => s.trim()).filter(s => s.length > 0);
      
      // 按基准顺序排序
      if (baseStores.length > 0) {
        const storeNames = baseStores.map(s => s.name);
        items.sort((a, b) => {
          const idxA = storeNames.findIndex(name => a.includes(name) || name.includes(a));
          const idxB = storeNames.findIndex(name => b.includes(name) || name.includes(b));
          return (idxA === -1 ? 9999 : idxA) - (idxB === -1 ? 9999 : idxB);
        });
      }
      return items;
    }

    // ============================================================
    // 显示解析进度动画
    // ============================================================
    function showParsingProgress(callback) {
      const statusEl = document.getElementById('parseStatus');
      const iconEl = document.getElementById('statusIcon');
      const textEl = document.getElementById('statusText');
      const barEl = document.getElementById('progressBar');
      const countEl = document.getElementById('statusCount');
      const tagsEl = document.getElementById('parsedTags');
      
      statusEl.classList.add('active');
      statusEl.classList.remove('done');
      iconEl.textContent = '⏳';
      textEl.textContent = '正在解析运单信息...';
      barEl.style.width = '0%';
      countEl.textContent = '';
      tagsEl.innerHTML = '';
      
      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 12 + 3;
        if (progress > 90) progress = 90;
        barEl.style.width = progress + '%';
      }, 120);
      
      // 执行解析
      setTimeout(() => {
        clearInterval(interval);
        barEl.style.width = '100%';
        setTimeout(() => {
          const result = callback();
          if (result && result.length > 0) {
            statusEl.classList.add('done');
            iconEl.textContent = '✅';
            textEl.textContent = `解析完成，识别到 ${result.length} 家门店`;
            countEl.textContent = '已按路线顺序排列';
            tagsEl.innerHTML = result.slice(0, 12).map((name, i) => 
              `<span class="tag"><span class="idx">${i+1}</span>${name}</span>`
            ).join('');
            if (result.length > 12) {
              tagsEl.innerHTML += `<span class="tag">+${result.length - 12} 家...</span>`;
            }
            parsedOrders = result;
            // 填充到输入框
            document.getElementById('manualOrderInput').value = result.join('\n');
            document.getElementById('charCount').textContent = result.join('\n').length;
            // 启用确认按钮
            document.getElementById('confirmBtn').disabled = false;
          } else {
            iconEl.textContent = '⚠️';
            textEl.textContent = '未能识别到有效门店，请手动输入';
            barEl.style.width = '0%';
          }
        }, 300);
      }, 1200 + Math.random() * 800);
    }

    // ============================================================
    // 上传处理（文件/相机）
    // ============================================================
    function triggerUpload(type) {
      const input = document.createElement("input");
      input.type = "file";
      if (type === 'camera') {
        input.accept = "image/*";
        input.capture = "environment";
      } else {
        input.accept = ".jpg,.png,.jpeg,.pdf,.xls,.xlsx,.csv,.txt";
      }
      input.click();
      input.onchange = function() {
        if (input.files && input.files[0]) {
          const file = input.files[0];
          Auth.addLog('文件上传', `上传: ${file.name}`);
          
          // 显示解析动画
          showParsingProgress(() => {
            // 模拟OCR/解析结果（使用示例数据）
            const demoText = `江北亿达鲜观府国际店(客百年) -> 江北亿达鲜半山华府店（客百年） -> 天友加盟农垦大厦店 -> 江北重庆全嘉食品供应链科技有限公司（救助管理站） -> 江北JM03115-谊品生鲜重庆御龙天峰店 -> 渝北JM03050谊品生鲜温馨家园南门店 -> 天友加盟韩志贤加盟重庆彭成商贸有限公司 -> II类天友生活花卉东路店 -> 江北JM03022谊品生鲜重庆北国风光店 -> 江北重庆彩食鲜供应链发展有限公司（重庆中法供水有限公司花园新村） -> 江北胡汪洋经销商（重庆胡建镜好食品有限公司） -> 江北A02175谊品生鲜锦绣北滨路店 -> 江北钱大妈半山华府店`;
            return parseAndSortOrders(demoText);
          });
        }
        toggleUpload();
      };
    }

    // ============================================================
    // 手动输入解析
    // ============================================================
    function parseManualInput() {
      const rawText = document.getElementById('manualOrderInput').value.trim();
      if (!rawText) {
        showToast('⚠️ 请先输入运单信息', 'error');
        return;
      }
      showParsingProgress(() => {
        return parseAndSortOrders(rawText);
      });
    }

    // ============================================================
    // 快捷操作
    // ============================================================
    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('manualOrderInput').value = text;
        document.getElementById('charCount').textContent = text.length;
        showToast('✅ 已粘贴');
        // 自动触发解析
        parseManualInput();
      } catch (err) {
        alert('⚠️ 无法读取剪贴板，请手动 Ctrl+V');
      }
    }

    function clearManualInput() {
      if (confirm('清空内容？')) {
        document.getElementById('manualOrderInput').value = '';
        document.getElementById('charCount').textContent = '0';
        document.getElementById('parseStatus').classList.remove('active');
        document.getElementById('parseStatus').classList.remove('done');
        showToast('已清空', 'warning');
      }
    }

    function loadExampleData() {
      const example = `江北胡汪洋经销商 | 12.5 | 已送达
渝北中景隆贸易有限公司 | 8.3 | 配送中
江北重庆兴农融资担保集团 | 15.6 | 待配送`;
      document.getElementById('manualOrderInput').value = example;
      document.getElementById('charCount').textContent = example.length;
      showToast('📝 示例已加载');
      parseManualInput();
    }

    function showToast(msg, type = 'success') {
      let toast = document.getElementById('toast');
      if (!toast) {
        const div = document.createElement('div');
        div.id = 'toast';
        div.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#18212B;color:#fff;padding:12px 24px;border-radius:12px;z-index:9999;font-size:14px;max-width:90%;text-align:center;border-left:4px solid #27AE60;';
        document.body.appendChild(div);
        toast = div;
      }
      toast.textContent = msg;
      toast.style.display = 'block';
      toast.className = 'toast show ' + type;
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    // ============================================================
    // 提交录入
    // ============================================================
    function submitManualOrder() {
      const textarea = document.getElementById('manualOrderInput');
      const rawText = textarea.value.trim();
      
      if (!rawText) {
        alert('⚠️ 请先录入运单数据');
        return;
      }

      // 如果还没有解析，先解析
      if (parsedOrders.length === 0) {
        parsedOrders = parseAndSortOrders(rawText);
      }

      const orders = parsedOrders.map((name, index) => ({
        id: Date.now() + index,
        name: name,
        weight: 0,
        note: '',
        status: '待配送'
      }));

      if (orders.length === 0) {
        alert('⚠️ 未能解析有效数据');
        return;
      }

      saveTodayOrders(orders);
      
      const count = orders.length;
      document.getElementById("storeCount").textContent = count + ' 家门店';
      document.getElementById("totalWeight").textContent = '0.0 kg';
      
      updateStatusDot();
      Auth.addLog('运单录入', `录入 ${count} 条运单`);
      
      toggleUpload();
      alert(`✅ 运单录入成功！\n共录入 ${count} 家门店`);
      
      textarea.value = '';
      document.getElementById('charCount').textContent = '0';
      parsedOrders = [];
      document.getElementById('parseStatus').classList.remove('active');
      document.getElementById('parseStatus').classList.remove('done');
    }

    // 点击外部关闭
    document.getElementById('uploadOverlay').addEventListener('click', function(e) {
      if (e.target === this) toggleUpload();
    });

    // 兼容原有函数
    function openTodayRoute() { window.location.href = "pages/order_detail.html"; }
    function openHistory() { window.location.href = "pages/history.html"; }
  </script>
</body>
</html>
