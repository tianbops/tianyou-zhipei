<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天友乳业 · 路线优化引擎</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-container">
    <div class="logo-area">
      <img src="assets/logo.png" alt="天友乳业" class="logo" onerror="this.style.display='none';this.parentElement.querySelector('.logo-fallback').style.display='block'">
      <div class="logo-fallback" style="display:none;font-size:80px;margin-bottom:10px;">🥛</div>
      <div class="brand-main">天友乳业</div><div class="brand-sub">路线优化引擎</div>
    </div>
    <div class="login-card">
      <div class="input-box"><input id="routeCode" type="text" placeholder="请输入线路"></div>
      <div class="input-box password-box"><input id="password" type="password" placeholder="请输入密码"><button type="button" class="eye-btn" onclick="togglePassword()">👁</button></div>
      <button class="login-btn" onclick="login()">进入系统</button>
      <div id="loginError" style="color:#E74C3C;font-size:14px;text-align:center;margin-top:10px;display:none"></div>
    </div>
    <div class="bottom-actions"><button onclick="openRegister()">注册</button><button onclick="openAdminLogin()">管理</button></div>
  </div>

  <div class="admin-login-overlay" id="registerOverlay"><div class="admin-login-box">
    <div class="admin-login-header"><span>📝 注册新线路</span><button class="admin-login-close" onclick="closeRegister()">✕</button></div>
    <div class="admin-login-body">
      <div style="color:#7F8B98;font-size:14px;text-align:center;margin-bottom:16px">请输入线路编号和企业统一密码完成注册</div>
      <div class="input-box"><input id="registerRoute" type="text" placeholder="请输入线路 (如 17)"></div>
      <div class="input-box password-box"><input id="registerPassword" type="password" placeholder="请输入企业统一密码"><button type="button" class="eye-btn" onclick="toggleRegisterPassword()">👁</button></div>
      <button class="login-btn" onclick="doRegister()">立即注册</button>
      <div id="registerError" style="color:#E74C3C;font-size:14px;text-align:center;margin-top:10px;display:none"></div>
      <div id="registerInfo" style="color:#27AE60;font-size:14px;text-align:center;margin-top:8px;display:none"></div>
    </div>
  </div></div>

  <div class="admin-login-overlay" id="adminLoginOverlay"><div class="admin-login-box">
    <div class="admin-login-header"><span>🔐 管理员登录</span><button class="admin-login-close" onclick="closeAdminLogin()">✕</button></div>
    <div class="admin-login-body">
      <div class="input-box"><input id="adminRoute" type="text" placeholder="请输入用户名"></div>
      <div class="input-box password-box"><input id="adminPassword" type="password" placeholder="请输入密码"><button type="button" class="eye-btn" onclick="toggleAdminPassword()">👁</button></div>
      <button class="login-btn" onclick="adminLogin()">管理员登录</button>
      <div id="adminLoginError" style="color:#E74C3C;font-size:14px;text-align:center;margin-top:10px;display:none"></div>
    </div>
  </div></div>

  <script src="js/auth.js"></script>
  <script>
    function getUnifiedPassword(){ return localStorage.getItem('unified_password') || 'tianyou2024'; }
    function formatRouteCode(input){
      if(!input)return '';
      const code=input.trim(), m=code.match(/(\d+)号线/), n=code.match(/^(\d+)$/);
      if(m)return String(parseInt(m[1])).padStart(2,'0')+'号线';
      if(n)return String(parseInt(n[1])).padStart(2,'0')+'号线';
      return code;
    }
    function isValidRouteCode(code){ return /^\d{2,}号线$/.test(code); }
    function showError(id,msg){ const e=document.getElementById(id); e.textContent=msg; e.style.display='block'; }
    function hideError(id){ document.getElementById(id).style.display='none'; }

    async function login(){
      const raw=document.getElementById('routeCode').value.trim(), password=document.getElementById('password').value.trim();
      hideError('loginError');
      if(!raw)return showError('loginError','⚠️ 请输入线路编号');
      if(!password)return showError('loginError','⚠️ 请输入密码');
      const route=formatRouteCode(raw);
      if(!isValidRouteCode(route))return showError('loginError','⚠️ 线路格式错误，请输入如 17 或 105');
      try{
        const user=await Auth.loginWithCredentials('route',route,password);
        Auth.addLog('用户登录',`${user.route} 登录系统`);
        window.location.href='home.html';
      }catch(error){ showError('loginError',error.status===401?'❌ 密码错误，请重试':'⚠️ 网络错误，请稍后重试'); console.error(error); }
    }
    function togglePassword(){const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';}

    function openRegister(){document.getElementById('registerOverlay').classList.add('active');document.getElementById('registerRoute').value='';document.getElementById('registerPassword').value='';hideError('registerError');document.getElementById('registerInfo').style.display='none';}
    function closeRegister(){document.getElementById('registerOverlay').classList.remove('active');}
    function toggleRegisterPassword(){const p=document.getElementById('registerPassword');p.type=p.type==='password'?'text':'password';}
    async function doRegister(){
      const raw=document.getElementById('registerRoute').value.trim(), password=document.getElementById('registerPassword').value.trim();
      hideError('registerError'); document.getElementById('registerInfo').style.display='none';
      if(!raw)return showError('registerError','⚠️ 请输入线路编号');
      if(!password)return showError('registerError','⚠️ 请输入企业统一密码');
      const route=formatRouteCode(raw);
      if(!isValidRouteCode(route))return showError('registerError','⚠️ 线路格式错误，请输入如 17 或 105');
      if(password!==getUnifiedPassword())return showError('registerError','❌ 企业统一密码错误，请重试');
      try{
        if(await Auth.isRouteRegistered(route))return showError('registerError','❌ 该线路已被注册，请直接登录');
        const info=document.getElementById('registerInfo'); info.textContent='⏳ 正在创建新线路...';info.style.display='block';
        const data=await Auth.createRoute(route,password,'driver','');
        if(!data)return showError('registerError','❌ 线路创建失败，请重试');
        info.textContent='✅ 线路注册成功！正在跳转...';
        Auth.login(route);Auth.addLog('线路注册',`${route} 注册成功`);
        setTimeout(()=>window.location.href='home.html',1000);
      }catch(error){console.error(error);showError('registerError','⚠️ 网络异常，请稍后重试');}
    }

    function openAdminLogin(){document.getElementById('adminLoginOverlay').classList.add('active');document.getElementById('adminRoute').value='';document.getElementById('adminPassword').value='';hideError('adminLoginError');}
    function closeAdminLogin(){document.getElementById('adminLoginOverlay').classList.remove('active');}
    function toggleAdminPassword(){const p=document.getElementById('adminPassword');p.type=p.type==='password'?'text':'password';}
    async function adminLogin(){
      const account=document.getElementById('adminRoute').value.trim(),password=document.getElementById('adminPassword').value.trim();
      hideError('adminLoginError');
      if(!account)return showError('adminLoginError','⚠️ 请输入用户名');
      if(!password)return showError('adminLoginError','⚠️ 请输入密码');
      try{
        const user=await Auth.loginWithCredentials('admin',account,password);
        Auth.addLog('管理员登录',`${user.name||account} 登录管理系统`);
        closeAdminLogin();window.location.href='admin.html';
      }catch(error){showError('adminLoginError',error.status===401?'❌ 用户名或密码错误':'⚠️ 网络错误，请稍后重试');console.error(error);}
    }

    ['registerOverlay','adminLoginOverlay'].forEach(id=>document.getElementById(id).addEventListener('click',function(e){if(e.target===this)this.classList.remove('active');}));
    document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(document.getElementById('adminLoginOverlay').classList.contains('active'))adminLogin();else if(document.getElementById('registerOverlay').classList.contains('active'))doRegister();else login();});
    if(localStorage.getItem('loginStatus')==='true'){window.location.href=localStorage.getItem('currentRoute')==='admin'?'admin.html':'home.html';}
    ['routeCode','registerRoute'].forEach(id=>document.getElementById(id).addEventListener('blur',function(){const v=formatRouteCode(this.value);if(isValidRouteCode(v))this.value=v;}));
  </script>
</body>
</html>
