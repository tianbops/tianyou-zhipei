<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#05070A">
  <title>智配One</title>
  <link rel="stylesheet" href="css/login.css">
  <style>
    .form-title{margin:0 0 18px;text-align:center;font-size:22px;font-weight:700}
    .form-tip{margin:10px 0 0;text-align:center;font-size:12px;line-height:1.5;opacity:.6}
    .switch-btn{display:block;width:100%;margin:14px 0 0;padding:4px;border:0;background:none;color:#7ea9e8;font-size:14px;cursor:pointer}
    .register-only{display:none}
    .login-card.register-mode .register-only{display:block}
    .login-card.register-mode .login-only{display:none}
    .input-box + .input-box{margin-top:10px}
  </style>
</head>
<body>
  <main class="login-container">
    <section class="logo-area">
      <img src="assets/logo.png" alt="天友乳业" class="logo">
      <div class="brand-sub">配送路线优化引擎</div>
    </section>

    <section class="login-card" id="authCard">
      <h1 class="form-title" id="formTitle">登录</h1>

      <div class="input-box register-only"><input id="name" type="text" placeholder="姓名（可选）" autocomplete="name"></div>
      <div class="input-box"><input id="username" type="text" placeholder="请输入用户名" autocomplete="username" maxlength="32"></div>
      <div class="input-box register-only"><input id="route" type="text" inputmode="numeric" placeholder="线路，例如 17号线" autocomplete="off"></div>
      <div class="input-box register-only"><input id="vehicle" type="text" placeholder="默认车辆（可选）" autocomplete="off" maxlength="30"></div>
      <div class="input-box password-box"><input id="password" type="password" placeholder="请输入密码" autocomplete="current-password"><button type="button" class="eye-btn" onclick="togglePassword()" aria-label="显示或隐藏密码">👁</button></div>
      <div class="input-box register-only password-box"><input id="confirmPassword" type="password" placeholder="再次输入密码" autocomplete="new-password"><button type="button" class="eye-btn" onclick="toggleConfirmPassword()" aria-label="显示或隐藏确认密码">👁</button></div>

      <button class="login-btn login-only" id="loginButton" onclick="login()">登录</button>
      <button class="login-btn register-only" id="registerButton" onclick="registerUser()">注册</button>
      <button class="switch-btn" id="switchButton" type="button" onclick="toggleMode()">没有账号？立即注册</button>
      <div id="authError" style="color:#E74C3C;font-size:14px;text-align:center;margin-top:10px;display:none"></div>
      <div class="form-tip register-only">每条线路独立绑定一个用户，注册后即可独立维护自己的线路基准数据。</div>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script>
    const card = document.getElementById('authCard');
    let registerMode = false;

    function showError(message){const el=document.getElementById('authError');el.textContent=message;el.style.display='block'}
    function hideError(){const el=document.getElementById('authError');el.textContent='';el.style.display='none'}
    function togglePassword(){const input=document.getElementById('password');input.type=input.type==='password'?'text':'password'}
    function toggleConfirmPassword(){const input=document.getElementById('confirmPassword');input.type=input.type==='password'?'text':'password'}

    function toggleMode(){
      registerMode=!registerMode;
      card.classList.toggle('register-mode',registerMode);
      document.getElementById('formTitle').textContent=registerMode?'注册':'登录';
      document.getElementById('switchButton').textContent=registerMode?'已有账号？返回登录':'没有账号？立即注册';
      hideError();
    }

    async function login(){
      const username=document.getElementById('username').value.trim();
      const password=document.getElementById('password').value;
      const button=document.getElementById('loginButton');
      hideError();
      if(!username)return showError('请输入用户名');
      if(!password)return showError('请输入密码');
      button.disabled=true;button.textContent='登录中…';
      try{await Auth.loginWithCredentials('username',username,password);location.href='home.html'}
      catch(error){showError(error?.status===401?'用户名或密码错误，请重试':(error?.message||'网络异常，请稍后重试'))}
      finally{button.disabled=false;button.textContent='登录'}
    }

    async function registerUser(){
      const name=document.getElementById('name').value.trim();
      const username=document.getElementById('username').value.trim();
      const route=document.getElementById('route').value.trim();
      const vehicle=document.getElementById('vehicle').value.trim();
      const password=document.getElementById('password').value;
      const confirm=document.getElementById('confirmPassword').value;
      const button=document.getElementById('registerButton');
      hideError();
      if(!username)return showError('请输入用户名');
      if(!route)return showError('请输入线路，例如 17号线');
      if(password.length<6)return showError('密码至少6位');
      if(password!==confirm)return showError('两次输入的密码不一致');
      button.disabled=true;button.textContent='注册中…';
      try{
        await Auth.register({name,username,route,vehicle,password});
        showError('注册成功，请使用新账号登录');
        document.getElementById('password').value='';
        document.getElementById('confirmPassword').value='';
        registerMode=false;
        card.classList.remove('register-mode');
        document.getElementById('formTitle').textContent='登录';
        document.getElementById('switchButton').textContent='没有账号？立即注册';
      }catch(error){showError(error?.message||'注册失败，请稍后重试')}
      finally{button.disabled=false;button.textContent='注册'}
    }

    ['username','password','route','confirmPassword'].forEach(id=>{
      document.getElementById(id).addEventListener('keydown',event=>{
        if(event.key==='Enter')registerMode?registerUser():login();
      });
    });
  </script>
</body>
</html>
