<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天友乳业 · 路线优化引擎</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-container">
    <div class="logo-area">
      <img src="assets/logo.png" alt="天友乳业" class="logo" 
           onerror="this.style.display='none';this.parentElement.querySelector('.logo-fallback').style.display='block'">
      <div class="logo-fallback" style="display:none; font-size:80px; margin-bottom:10px;">🥛</div>
      <div class="brand-main">天友乳业</div>
      <div class="brand-sub">路线优化引擎</div>
    </div>
    <div class="login-card">
      <div class="input-box">
        <input id="routeCode" type="text" placeholder="请输入线路">
      </div>
      <div class="input-box password-box">
        <input id="password" type="password" placeholder="请输入密码">
        <button type="button" class="eye-btn" onclick="togglePassword()">👁</button>
      </div>
      <button class="login-btn" onclick="userLogin()">进入系统</button>
      <div id="loginError" style="color:#E74C3C; font-size:14px; text-align:center; margin-top:10px; display:none;"></div>
      <div id="loginInfo" style="color:#27AE60; font-size:14px; text-align:center; margin-top:8px; display:none;"></div>
    </div>
    <div class="bottom-actions">
      <button onclick="openRegister()">注册</button>
      <button onclick="openAdminLogin()">管理</button>
    </div>
  </div>

  <!-- ===== 注册弹窗 ===== -->
  <div class="admin-login-overlay" id="registerOverlay">
    <div class="admin-login-box">
      <div class="admin-login-header">
        <span>📝 注册新线路</span>
        <button class="admin-login-close" onclick="closeRegister()">✕</button>
      </div>
      <div class="admin-login-body">
        <div style="color:#7F8B98; font-size:14px; text-align:center; margin-bottom:16px;">
          请输入线路编号和企业统一密码完成注册
        </div>
        <div class="input-box">
          <input id="registerRoute" type="text" placeholder="请输入线路 (如 01号线)">
        </div>
        <div class="input-box password-box">
          <input id="registerPassword" type="password" placeholder="请输入企业统一密码">
          <button type="button" class="eye-btn" onclick="toggleRegisterPassword()">👁</button>
        </div>
        <button class="login-btn" onclick="doRegister()">立即注册</button>
        <div id="registerError" style="color:#E74C3C; font-size:14px; text-align:center; margin-top:10px; display:none;"></div>
        <div id="registerInfo" style="color:#27AE60; font-size:14px; text-align:center; margin-top:8px; display:none;"></div>
      </div>
    </div>
  </div>

  <!-- ===== 管理员登录弹窗 ===== -->
  <div class="admin-login-overlay" id="adminLoginOverlay">
    <div class="admin-login-box">
      <div class="admin-login-header">
        <span>🔐 管理员登录</span>
        <button class="admin-login-close" onclick="closeAdminLogin()">✕</button>
      </div>
      <div class="admin-login-body">
        <div class="input-box">
          <input id="adminRoute" type="text" placeholder="请输入用户名">
        </div>
        <div class="input-box password-box">
          <input id="adminPassword" type="password" placeholder="请输入密码">
          <button type="button" class="eye-btn" onclick="toggleAdminPassword()">👁</button>
        </div>
        <button class="login-btn" onclick="adminLogin()">管理员登录</button>
        <div id="adminLoginError" style="color:#E74C3C; font-size:14px; text-align:center; margin-top:10px; display:none;"></div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // ============================================================
    // 工具函数：格式化线路编号
    // ============================================================
    function formatRouteCode(input) {
      if (!input) return '';
      let code = input.trim();
      if (code.includes('号线')) {
        const numMatch = code.match(/(\d+)号线/);
        if (numMatch) {
          const num = parseInt(numMatch[1]);
          return String(num).padStart(2, '0') + '号线';
        }
      }
      const numMatch = code.match(/^(\d+)$/);
      if (numMatch) {
        const num = parseInt(numMatch[1]);
        return String(num).padStart(2, '0') + '号线';
      }
      return code;
    }

    function isValidRouteCode(code) {
      return /^\d{2,}号线$/.test(code);
    }

    // ============================================================
    // 普通用户登录
    // ============================================================
    async function userLogin() {
      const rawRoute = document.getElementById('routeCode').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorEl = document.getElementById('loginError');
      const infoEl = document.getElementById('loginInfo');
      errorEl.style.display = 'none';
      infoEl.style.display = 'none';

      if (!rawRoute) { 
        errorEl.textContent = '⚠️ 请输入线路编号'; 
        errorEl.style.display = 'block'; 
        return; 
      }
      if (!password) { 
        errorEl.textContent = '⚠️ 请输入密码'; 
        errorEl.style.display = 'block'; 
        return; 
      }

      const routeCode = formatRouteCode(rawRoute);
      
      if (!isValidRouteCode(routeCode)) {
        errorEl.textContent = '⚠️ 线路格式错误，请输入如 01号线、17号线';
        errorEl.style.display = 'block';
        return;
      }

      const UNIFIED_PASSWORD = 'tianyou2024';

      try {
        // 检查用户是否已注册
        const user = Auth.findUserByRoute(routeCode);
        
        if (user) {
          // 用户已注册 → 验证密码
          if (password === UNIFIED_PASSWORD) {
            // 加载线路数据
            const routeData = await Auth.validateRoute(routeCode);
            Auth.login(routeCode);
            if (routeData) {
              Auth.cacheRouteData(routeCode, routeData);
            }
            Auth.addLog('用户登录', `${routeCode} 登录系统`);
            window.location.href = 'home.html';
          } else {
            errorEl.textContent = '❌ 账号或密码错误，请重试';
            errorEl.style.display = 'block';
          }
        } else {
          // 用户未注册 → 提示注册
          errorEl.textContent = '❌ 线路未注册，请点击「注册」按钮创建';
          errorEl.style.display = 'block';
        }
      } catch (error) {
        errorEl.textContent = '⚠️ 网络错误，请稍后重试';
        errorEl.style.display = 'block';
        console.error(error);
      }
    }

    function togglePassword() {
      const pwd = document.getElementById('password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }

    // ============================================================
    // 注册弹窗 - 检查线路是否已被注册
    // ============================================================
    function openRegister() {
      document.getElementById('registerOverlay').classList.add('active');
      document.getElementById('registerRoute').value = '';
      document.getElementById('registerPassword').value = '';
      document.getElementById('registerError').style.display = 'none';
      document.getElementById('registerInfo').style.display = 'none';
    }

    function closeRegister() {
      document.getElementById('registerOverlay').classList.remove('active');
    }

    function toggleRegisterPassword() {
      const pwd = document.getElementById('registerPassword');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }

    async function doRegister() {
      const rawRoute = document.getElementById('registerRoute').value.trim();
      const password = document.getElementById('registerPassword').value.trim();
      const errorEl = document.getElementById('registerError');
      const infoEl = document.getElementById('registerInfo');
      errorEl.style.display = 'none';
      infoEl.style.display = 'none';

      if (!rawRoute) { 
        errorEl.textContent = '⚠️ 请输入线路编号'; 
        errorEl.style.display = 'block'; 
        return; 
      }
      if (!password) { 
        errorEl.textContent = '⚠️ 请输入企业统一密码'; 
        errorEl.style.display = 'block'; 
        return; 
      }

      const routeCode = formatRouteCode(rawRoute);
      
      if (!isValidRouteCode(routeCode)) {
        errorEl.textContent = '⚠️ 线路格式错误，请输入如 01号线、17号线';
        errorEl.style.display = 'block';
        return;
      }

      const UNIFIED_PASSWORD = 'tianyou2024';

      if (password !== UNIFIED_PASSWORD) {
        errorEl.textContent = '❌ 企业统一密码错误，请重试';
        errorEl.style.display = 'block';
        return;
      }

      try {
        // ===== 检查线路是否已被注册 =====
        const existingUser = Auth.findUserByRoute(routeCode);
        if (existingUser) {
          errorEl.textContent = '❌ 该线路已被注册，请直接登录';
          errorEl.style.display = 'block';
          return;
        }

        // ===== 检查线路是否已存在基准数据（兼容旧数据） =====
        const existingRoute = await Auth.validateRoute(routeCode);
        if (existingRoute) {
          errorEl.textContent = '❌ 该线路已存在数据，请直接登录';
          errorEl.style.display = 'block';
          return;
        }

        infoEl.textContent = '⏳ 正在创建新线路...';
        infoEl.style.display = 'block';
        infoEl.style.color = '#FFB020';

        const newRouteData = await Auth.createRoute(routeCode, 'driver', '');
        
        if (newRouteData) {
          infoEl.textContent = '✅ 线路注册成功！正在跳转...';
          infoEl.style.color = '#27AE60';
          infoEl.style.display = 'block';
          
          Auth.login(routeCode);
          Auth.cacheRouteData(routeCode, newRouteData);
          Auth.addLog('线路注册', `${routeCode} 注册成功`);
          
          setTimeout(() => {
            window.location.href = 'home.html';
          }, 1500);
        } else {
          errorEl.textContent = '❌ 线路创建失败，请重试';
          errorEl.style.display = 'block';
        }
      } catch (error) {
        console.error('注册错误:', error);
        errorEl.textContent = '⚠️ 网络异常，请稍后重试';
        errorEl.style.display = 'block';
      }
    }

    document.getElementById('registerOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeRegister();
    });

    // ============================================================
    // 管理员登录
    // ============================================================
    function openAdminLogin() {
      document.getElementById('adminLoginOverlay').classList.add('active');
      document.getElementById('adminRoute').value = '';
      document.getElementById('adminPassword').value = '';
      document.getElementById('adminLoginError').style.display = 'none';
    }

    function closeAdminLogin() {
      document.getElementById('adminLoginOverlay').classList.remove('active');
    }

    function toggleAdminPassword() {
      const pwd = document.getElementById('adminPassword');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }

    async function adminLogin() {
      const route = document.getElementById('adminRoute').value.trim();
      const password = document.getElementById('adminPassword').value.trim();
      const errorEl = document.getElementById('adminLoginError');
      errorEl.style.display = 'none';

      if (!route) { 
        errorEl.textContent = '⚠️ 请输入用户名'; 
        errorEl.style.display = 'block'; 
        return; 
      }
      if (!password) { 
        errorEl.textContent = '⚠️ 请输入密码'; 
        errorEl.style.display = 'block'; 
        return; 
      }

      const ADMIN_PASSWORD = 'admin123';
      const ADMIN_ROUTES = ['admin', '管理员', 'ADMIN'];

      if (ADMIN_ROUTES.includes(route) && password === ADMIN_PASSWORD) {
        Auth.login(route, '管理员');
        Auth.addLog('管理员登录', `${route} 登录管理系统`);
        closeAdminLogin();
        window.location.href = 'admin.html';
      } else {
        errorEl.textContent = '❌ 用户名或密码错误，请重试';
        errorEl.style.display = 'block';
      }
    }

    document.getElementById('adminLoginOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeAdminLogin();
    });

    // ============================================================
    // 回车键触发
    // ============================================================
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const adminOverlay = document.getElementById('adminLoginOverlay');
        const registerOverlay = document.getElementById('registerOverlay');
        
        if (adminOverlay.classList.contains('active')) {
          adminLogin();
        } else if (registerOverlay.classList.contains('active')) {
          doRegister();
        } else {
          userLogin();
        }
      }
    });

    // ============================================================
    // 已登录自动跳转
    // ============================================================
    if (localStorage.getItem('loginStatus') === 'true') {
      const currentRoute = localStorage.getItem('currentRoute');
      const adminRoutes = ['admin', '管理员', 'ADMIN'];
      if (adminRoutes.includes(currentRoute)) {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'home.html';
      }
    }

    // ============================================================
    // 输入框自动格式化
    // ============================================================
    document.getElementById('routeCode').addEventListener('blur', function() {
      const val = this.value.trim();
      if (val) {
        const formatted = formatRouteCode(val);
        if (formatted !== val && isValidRouteCode(formatted)) {
          this.value = formatted;
        }
      }
    });

    document.getElementById('registerRoute').addEventListener('blur', function() {
      const val = this.value.trim();
      if (val) {
        const formatted = formatRouteCode(val);
        if (formatted !== val && isValidRouteCode(formatted)) {
          this.value = formatted;
        }
      }
    });
  </script>
</body>
</html>
