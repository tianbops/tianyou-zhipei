<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>天友乳业 · 路线优化引擎</title><link rel="stylesheet" href="css/login.css"></head><body>
<div class="login-container"><div class="logo-area"><img src="assets/logo.png" alt="天友乳业" class="logo"><div class="brand-main">天友乳业</div><div class="brand-sub">路线优化引擎</div></div><div class="login-card"><div class="input-box"><input id="routeCode" type="text" placeholder="请输入线路"></div><div class="input-box password-box"><input id="password" type="password" placeholder="请输入密码"><button type="button" class="eye-btn" onclick="togglePassword()">👁</button></div><button class="login-btn" onclick="login()">进入系统</button><div id="loginError" style="color:#E74C3C;font-size:14px;text-align:center;margin-top:10px;display:none"></div></div><div class="bottom-actions"><button onclick="openRegister()">注册</button><button onclick="openAdminLogin()">管理</button></div></div>
<div class="admin-login-overlay" id="registerOverlay"><div class="admin-login-box"><div class="admin-login-header"><span>📝 注册新线路</span><button class="admin-login-close" onclick="closeRegister()">✕</button></div><div class="admin-login-body"><div style="color:#7F8B98;font-size:14px;text-align:center;margin-bottom:16px">请输入线路编号和企业统一密码完成注册</div><div class="input-box"><input id="registerRoute" type="text" placeholder="请输入线路 (如 17)"></div><div class="input-box password-box"><input id="registerPassword" type="password" placeholder="请输入企业统一密码"><button type="button" class="eye-btn" onclick="toggleRegisterPassword()">👁</button></div><button class="login-btn" onclick="doRegister()">立即注册</button><div id="registerError" style="color:#E74C3C;font-size:14px;text-align:center;margin-top:10px;display:none"></div><div id="registerInfo" style="color:#27AE60;font-size:14px;text-align:center;margin-top:8px;display:none"></div></div></div></div>
<div class="admin-login-overlay" id="adminLoginOverlay"><div class="admin-login-box"><div class="admin-login-header"><span>🔐 管理员登录</span><button class="admin-login-close" onclick="closeAdminLogin()">✕</button></div><div class="admin-login-body"><div class="input-box"><input id="adminRoute" type="text" placeholder="请输入用户名"></div><div class="input-box password-box"><input id="adminPassword" type="password" placeholder="请输入密码"><button type="button" class="eye-btn" onclick="toggleAdminPassword()">👁</button></div><button class="login-btn" onclick="adminLogin()">管理员登录</button><div id="adminLoginError" style="color:#E74C3C;font-size:14px;text-align:center;margin-top:10px;display:none"></div></div></div></div>
<script src="js/auth.js"></script><script>
function formatRouteCode(v){if(!v)return'';const c=v.trim(),m=c.match(/(\d+)号线/),n=c.match(/^(\d+)$/);if(m)return String(parseInt(m[1])).padStart(2,'0')+'号线';if(n)return String(parseInt(n[1])).padStart(2,'0')+'号线';return c}
function isValidRouteCode(c){return/^\d{2,}号线$/.test(c)}function showError(id,m){const e=document.getElementById(id);e.textContent=m;e.style.display='block'}function hideError(id){document.getElementById(id).style.display='none'}
async function login(){const raw=document.getElementById('routeCode').value.trim(),password=document.getElementById('password').value.trim();hideError('loginError');if(!raw)return showError('loginError','⚠️ 请输入线路编号');if(!password)return showError('loginError','⚠️ 请输入密码');const route=formatRouteCode(raw);if(!isValidRouteCode(route))return showError('loginError','⚠️ 线路格式错误，请输入如 17 或 105');try{const u=await Auth.loginWithCredentials('route',route,password);Auth.addLog('用户登录',`${u.route} 登录系统`);location.href='home.html'}catch(e){showError('loginError',e.status===401?'❌ 密码错误，请重试':'⚠️ 网络错误，请稍后重试')}}
function togglePassword(){const p=document.getElementById('password');p.type=p.type==='password'?'text':'password'}
function openRegister(){document.getElementById('registerOverlay').classList.add('active');hideError('registerError');document.getElementById('registerInfo').style.display='none'}function closeRegister(){document.getElementById('registerOverlay').classList.remove('active')}function toggleRegisterPassword(){const p=document.getElementById('registerPassword');p.type=p.type==='password'?'text':'password'}
async function doRegister(){const raw=document.getElementById('registerRoute').value.trim(),password=document.getElementById('registerPassword').value.trim();hideError('registerError');document.getElementById('registerInfo').style.display='none';if(!raw)return showError('registerError','⚠️ 请输入线路编号');if(!password)return showError('registerError','⚠️ 请输入企业统一密码');const route=formatRouteCode(raw);if(!isValidRouteCode(route))return showError('registerError','⚠️ 线路格式错误');const info=document.getElementById('registerInfo');info.textContent='⏳ 正在由服务器验证并创建新线路...';info.style.display='block';try{const r=await fetch('/api/register',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({route,password})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)return showError('registerError',d.error||'❌ 线路创建失败，请重试');info.textContent='✅ 线路注册成功！请登录';document.getElementById('routeCode').value=route;document.getElementById('password').value=password;setTimeout(()=>{closeRegister();login()},700)}catch(e){showError('registerError','⚠️ 网络异常，请稍后重试')}}
function openAdminLogin(){document.getElementById('adminLoginOverlay').classList.add('active');hideError('adminLoginError')}function closeAdminLogin(){document.getElementById('adminLoginOverlay').classList.remove('active')}function toggleAdminPassword(){const p=document.getElementById('adminPassword');p.type=p.type==='password'?'text':'password'}
async function adminLogin(){const account=document.getElementById('adminRoute').value.trim(),password=document.getElementById('adminPassword').value.trim();hideError('adminLoginError');if(!account)return showError('adminLoginError','⚠️ 请输入用户名');if(!password)return showError('adminLoginError','⚠️ 请输入密码');try{const u=await Auth.loginWithCredentials('admin',account,password);Auth.addLog('管理员登录',`${u.name||account} 登录管理系统`);closeAdminLogin();location.href='admin.html'}catch(e){showError('adminLoginError',e.status===401?'❌ 用户名或密码错误':'⚠️ 网络错误，请稍后重试')}}
['registerOverlay','adminLoginOverlay'].forEach(id=>document.getElementById(id).addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('active')}));document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(document.getElementById('adminLoginOverlay').classList.contains('active'))adminLogin();else if(document.getElementById('registerOverlay').classList.contains('active'))doRegister();else login()});if(localStorage.getItem('loginStatus')==='true'&&localStorage.getItem('sessionToken'))location.href=localStorage.getItem('currentRoute')==='admin'?'admin.html':'home.html';
</script></body></html>
