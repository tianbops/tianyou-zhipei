<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#05070A">
  <title>天友乳业 · 配送路线优化引擎</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login-container">
    <section class="logo-area">
      <img src="assets/logo.png" alt="天友乳业" class="logo">
      <div class="brand-main">天友乳业</div>
      <div class="brand-sub">配送路线优化引擎</div>
    </section>

    <section class="login-card">
      <div class="route-fixed">
        <div class="route-title">17号线</div>
        <div class="route-vehicle">🚚 渝DK7692</div>
      </div>

      <div class="input-box password-box">
        <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
        <button type="button" class="eye-btn" onclick="togglePassword()" aria-label="显示或隐藏密码">👁</button>
      </div>

      <button class="login-btn" id="loginButton" onclick="login()">登录</button>
      <div id="loginError" style="color:#E74C3C;font-size:14px;text-align:center;margin-top:10px;display:none"></div>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script>
    const TEST_ROUTE = '17号线';

    function showError(message) {
      const el = document.getElementById('loginError');
      el.textContent = message;
      el.style.display = 'block';
    }

    function hideError() {
      const el = document.getElementById('loginError');
      el.textContent = '';
      el.style.display = 'none';
    }

    function togglePassword() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    async function login() {
      const password = document.getElementById('password').value;
      const button = document.getElementById('loginButton');
      hideError();

      if (!password) {
        showError('⚠️ 请输入密码');
        return;
      }

      button.disabled = true;
      button.textContent = '登录中…';

      try {
        const user = await Auth.loginWithCredentials('route', TEST_ROUTE, password);
        Auth.addLog('用户登录', `${TEST_ROUTE} 登录系统`);
        location.href = 'home.html';
      } catch (error) {
        if (error?.status === 401) {
          showError('❌ 密码错误，请重试');
        } else {
          showError(error?.message || '⚠️ 网络异常，请稍后重试');
        }
      } finally {
        button.disabled = false;
        button.textContent = '登录';
      }
    }

    document.getElementById('password').addEventListener('keydown', event => {
      if (event.key === 'Enter') login();
    });
  </script>
</body>
</html>
