<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>Zhipei One · 智配 One</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<main class="login-container">
<section class="logo-area">
<img src="assets/logo.png" alt="智配 One" class="logo">
<div class="brand-sub">智能配送•一路领先</div>
</section>
<section class="login-card" id="authCard">
<h1 class="form-title" id="formTitle">登录</h1>
<div class="input-box"><input id="username" type="text" placeholder="请输入用户名" autocomplete="username" maxlength="32"></div>
<div class="input-box password-box"><input id="password" type="password" placeholder="请输入密码" autocomplete="current-password"><button type="button" class="eye-btn" onclick="togglePassword('password',this)" aria-label="显示或隐藏密码">👁</button></div>
<div class="input-box register-only password-box"><input id="confirmPassword" type="password" placeholder="再次输入密码" autocomplete="new-password"><button type="button" class="eye-btn" onclick="togglePassword('confirmPassword',this)" aria-label="显示或隐藏确认密码">👁</button></div>
<button class="login-btn login-only" id="loginButton" type="button" onclick="login()">登录</button>
<button class="login-btn register-only" id="registerButton" type="button" onclick="registerUser()">注册</button>
<button class="switch-btn" id="switchButton" type="button" onclick="toggleMode()">没有账号？立即注册</button>
<div id="authError" role="alert" aria-live="polite"></div>
<div class="form-tip register-only">注册完成后进入系统，再设置姓名、线路和车辆。</div>
</section>
</main>
<script src="js/auth.js?v=20260917-2"></script>
<script>
'use strict';
const card=document.getElementById('authCard');
let registerMode=false;
function showError(message){const el=document.getElementById('authError');el.textContent=message}
function hideError(){document.getElementById('authError').textContent=''}
function togglePassword(id,button){const input=document.getElementById(id);const visible=input.type==='text';input.type=visible?'password':'text';button.style.opacity=visible?'1':'.65'}
function toggleMode(){registerMode=!registerMode;card.classList.toggle('register-mode',registerMode);document.getElementById('formTitle').textContent=registerMode?'注册':'登录';document.getElementById('switchButton').textContent=registerMode?'已有账号？返回登录':'没有账号？立即注册';document.getElementById('password').autocomplete=registerMode?'new-password':'current-password';hideError();document.getElementById(registerMode?'confirmPassword':'username').focus()}
function requireAuth(){if(window.Auth)return window.Auth;showError('认证模块加载失败，请刷新页面重试');throw new Error('Auth is not defined')}\nfunction enterApp(url){document.body.classList.add('is-leaving');requestAnimationFrame(()=>{location.href=url})}
async function login(){const username=document.getElementById('username').value.trim();const password=document.getElementById('password').value;const button=document.getElementById('loginButton');hideError();if(!username)return showError('请输入用户名');if(!password)return showError('请输入密码');button.disabled=true;button.textContent='登录中…';try{const user=await requireAuth().loginWithCredentials('username',username,password);enterApp(user?.route?'home.html':'settings.html')}catch(error){showError(error?.status===401?'用户名或密码错误，请重试':(error?.message||'网络异常，请稍后重试'))}finally{button.disabled=false;button.textContent='登录'}}
async function registerUser(){const username=document.getElementById('username').value.trim();const password=document.getElementById('password').value;const confirm=document.getElementById('confirmPassword').value;const button=document.getElementById('registerButton');hideError();if(!username)return showError('请输入用户名');if(!/^[a-zA-Z0-9_]{3,32}$/.test(username))return showError('用户名需为3-32位字母、数字或下划线');if(password.length<6)return showError('密码至少6位');if(password!==confirm)return showError('两次输入的密码不一致');button.disabled=true;button.textContent='注册中…';try{await requireAuth().register({username,password});enterApp('settings.html')}catch(error){showError(error?.message||'注册失败，请稍后重试')}finally{button.disabled=false;button.textContent='注册'}}
['username','password','confirmPassword'].forEach(id=>document.getElementById(id).addEventListener('keydown',event=>{if(event.key==='Enter')registerMode?registerUser():login()}));
</script>
</body>
</html>
