<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史查询</title>
  <link rel="stylesheet" href="../css/order.css">
  <style>
    /* ===== 日期选择器 - 三个滚动窗口 ===== */
    .date-picker-title {
      text-align: center;
      color: #B8C2CC;
      font-size: 15px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .date-picker {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .date-picker select {
      flex: 1;
      height: 50px;
      background: #05070A;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      padding: 4px 0;
      cursor: pointer;
      /* 确保滚动选择器可见 */
      overflow-y: auto;
    }
    .date-picker select:focus {
      outline: 2px solid rgba(36, 87, 166, 0.45);
    }
    /* 下拉选项样式 */
    .date-picker select option {
      background: #18212B;
      color: #fff;
      padding: 6px 8px;
      font-size: 14px;
      text-align: center;
    }
    /* 滚动条样式 */
    .date-picker select::-webkit-scrollbar {
      width: 4px;
    }
    .date-picker select::-webkit-scrollbar-thumb {
      background: #3A4654;
      border-radius: 10px;
    }
    /* Firefox 滚动条 */
    .date-picker select {
      scrollbar-width: thin;
      scrollbar-color: #3A4654 transparent;
    }

    /* 查询按钮 */
    .query-btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 14px;
      background: #2457A6;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }
    .query-btn:active { transform: scale(0.97); }

    /* ===== 配送记录列表 - 可滚动 ===== */
    .history-scroll {
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
      margin-top: 4px;
    }
    .history-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .history-scroll::-webkit-scrollbar-thumb {
      background: #3A4654;
      border-radius: 10px;
    }

    .history-scroll .empty-tip {
      text-align: center;
      padding: 40px 20px;
      color: #7F8B98;
      font-size: 15px;
    }
    .history-scroll .empty-tip .icon {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
    }

    /* 历史条目样式 */
    .history-item {
      background: #05070A;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .history-item:last-child { margin-bottom: 0; }
    .history-item .history-date {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #FFB020;
    }
    .history-item .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 34px;
      font-size: 14px;
      border-bottom: none;
    }
    .history-item .info-row .label {
      color: #7F8B98;
    }
    .history-item .info-row .value {
      color: #fff;
      font-weight: 500;
    }
    .history-item .history-btn {
      width: 100%;
      height: 40px;
      margin-top: 10px;
      background: #2457A6;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .history-item .history-btn:active { transform: scale(0.97); }

    /* 日期选择器小屏适配 */
    @media (max-height: 700px) {
      .date-picker select {
        height: 40px;
        font-size: 14px;
      }
      .date-picker select option {
        font-size: 12px;
        padding: 4px 6px;
      }
      .history-scroll {
        max-height: 240px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <button class="back-btn" onclick="goBack()">←</button>
      <div class="app-title">历史查询</div>
      <div style="width:40px;"></div>
    </header>

    <!-- ===== 日期选择区域 ===== -->
    <section class="task-card">
      <div class="date-picker-title">选择日期</div>
      
      <!-- 三个滚动选择器：年、月、日 -->
      <div class="date-picker">
        <select id="yearSelect" onchange="updateDateDisplay()"></select>
        <select id="monthSelect" onchange="updateDateDisplay()"></select>
        <select id="daySelect" onchange="updateDateDisplay()"></select>
      </div>

      <button class="query-btn" onclick="queryHistory()">查询配送记录</button>
    </section>

    <!-- ===== 配送记录列表 - 可滚动 ===== -->
    <section class="task-card">
      <div class="route-title">📋 配送记录</div>
      <div class="history-scroll" id="historyList">
        <div class="empty-tip">
          <span class="icon">📭</span>
          请选择日期并点击查询
        </div>
      </div>
    </section>
  </div>

  <script src="../js/auth.js"></script>
  <script>
    // ============================================================
    // 全局变量
    // ============================================================
    let selectedYear = '';
    let selectedMonth = '';
    let selectedDay = '';
    let historyData = [];

    // ============================================================
    // 页面初始化 - 默认显示当天日期
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      if (!Auth.checkAuth()) return;
      
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      
      selectedYear = String(year);
      selectedMonth = month;
      selectedDay = day;
      
      populateSelectors(year, parseInt(month), parseInt(day));
      
      // 默认查询当天
      loadHistory(`${year}-${month}-${day}`);
    });

    // ============================================================
    // 填充选择器 - 每个选择器都有足够的选项供滚动
    // ============================================================
    function populateSelectors(year, month, day) {
      const yearSelect = document.getElementById('yearSelect');
      const monthSelect = document.getElementById('monthSelect');
      const daySelect = document.getElementById('daySelect');
      
      // ===== 年份：当前年份前后5年，共11个选项（足够滚动） =====
      yearSelect.innerHTML = '';
      for (let i = year - 5; i <= year + 5; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = i + '年';
        if (i === year) option.selected = true;
        yearSelect.appendChild(option);
      }
      
      // ===== 月份：1-12月 =====
      monthSelect.innerHTML = '';
      for (let i = 1; i <= 12; i++) {
        const option = document.createElement('option');
        option.value = String(i).padStart(2, '0');
        option.textContent = i + '月';
        if (i === month) option.selected = true;
        monthSelect.appendChild(option);
      }
      
      // ===== 日期：1-当月天数 =====
      const daysInMonth = getDaysInMonth(year, month);
      daySelect.innerHTML = '';
      for (let i = 1; i <= daysInMonth; i++) {
        const option = document.createElement('option');
        option.value = String(i).padStart(2, '0');
        option.textContent = i + '日';
        if (i === day) option.selected = true;
        daySelect.appendChild(option);
      }
    }

    // ============================================================
    // 获取当月天数
    // ============================================================
    function getDaysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    // ============================================================
    // 更新日期显示（仅用于内部变量）
    // ============================================================
    function updateDateDisplay() {
      const year = document.getElementById('yearSelect').value;
      const month = document.getElementById('monthSelect').value;
      const day = document.getElementById('daySelect').value;
      
      selectedYear = year;
      selectedMonth = month;
      selectedDay = day;
      
      // 月份变化时更新天数
      const daysInMonth = getDaysInMonth(parseInt(year), parseInt(month));
      const daySelect = document.getElementById('daySelect');
      const currentDay = parseInt(day);
      
      // 如果当前选择的天数大于当月天数，自动调整
      if (currentDay > daysInMonth) {
        daySelect.innerHTML = '';
        for (let i = 1; i <= daysInMonth; i++) {
          const option = document.createElement('option');
          option.value = String(i).padStart(2, '0');
          option.textContent = i + '日';
          if (i === daysInMonth) option.selected = true;
          daySelect.appendChild(option);
        }
        selectedDay = String(daysInMonth).padStart(2, '0');
      }
    }

    // ============================================================
    // 查询历史
    // ============================================================
    function queryHistory() {
      const year = document.getElementById('yearSelect').value;
      const month = document.getElementById('monthSelect').value;
      const day = document.getElementById('daySelect').value;
      const date = `${year}-${month}-${day}`;
      loadHistory(date);
    }

    // ============================================================
    // 加载历史数据
    // ============================================================
    async function loadHistory(date) {
      const container = document.getElementById('historyList');
      container.innerHTML = '<div class="empty-tip"><span class="icon">⏳</span>加载中...</div>';
      
      try {
        const allHistory = JSON.parse(localStorage.getItem('delivery_history') || '[]');
        const filtered = allHistory.filter(item => item.date === date);
        
        if (filtered.length > 0) {
          historyData = filtered;
          renderHistory(filtered);
        } else {
          try {
            const response = await fetch(`/api/history/${date}`);
            if (response.ok) {
              const data = await response.json();
              if (data && data.length > 0) {
                historyData = data;
                renderHistory(data);
                return;
              }
            }
          } catch (e) {
            console.log('API不可用，使用本地数据');
          }
          
          container.innerHTML = `
            <div class="empty-tip">
              <span class="icon">📭</span>
              暂无配送记录<br>
              <span style="font-size:13px;color:#4A5568;">${date} 没有配送数据</span>
            </div>
          `;
        }
      } catch (error) {
        console.error("加载历史失败:", error);
        container.innerHTML = `
          <div class="empty-tip">
            <span class="icon">⚠️</span>
            加载失败，请重试
          </div>
        `;
      }
    }

    // ============================================================
    // 渲染历史记录
    // ============================================================
    function renderHistory(records) {
      const container = document.getElementById('historyList');
      container.innerHTML = "";
      
      if (!records || records.length === 0) {
        container.innerHTML = `
          <div class="empty-tip">
            <span class="icon">📭</span>
            暂无配送记录
          </div>
        `;
        return;
      }
      
      records.forEach(function(item, index) {
        const orderCount = item.count || (item.orders ? item.orders.length : 0);
        const weight = item.weight || '0.0 kg';
        const route = item.route || Auth.getCurrentRoute();
        const vehicle = item.vehicle || '渝DK7692';
        const date = item.date || '未知日期';
        
        container.innerHTML += `
          <div class="history-item">
            <div class="history-date">📅 ${date}</div>
            <div class="info-row">
              <span class="label">线路</span>
              <span class="value">${route}</span>
            </div>
            <div class="info-row">
              <span class="label">车辆</span>
              <span class="value">🚚 ${vehicle}</span>
            </div>
            <div class="info-row">
              <span class="label">配送</span>
              <span class="value">${orderCount} 家门店</span>
            </div>
            <div class="info-row">
              <span class="label">总重量</span>
              <span class="value">${weight}</span>
            </div>
            <button class="history-btn" onclick="viewHistoryDetail(${index})">
              查看路线 →
            </button>
          </div>
        `;
      });
    }

    // ============================================================
    // 查看历史详情
    // ============================================================
    function viewHistoryDetail(index) {
      const item = historyData[index];
      if (!item) {
        alert('数据不存在');
        return;
      }
      
      localStorage.setItem('history_view_data', JSON.stringify(item));
      window.location.href = 'order_detail.html?mode=history';
    }

    // ============================================================
    // 返回首页
    // ============================================================
    function goBack() {
      window.location.href = "../home.html";
    }

    // ============================================================
    // 年份变化时更新月份天数
    // ============================================================
    document.getElementById('yearSelect').addEventListener('change', function() {
      updateDateDisplay();
    });
    document.getElementById('monthSelect').addEventListener('change', function() {
      updateDateDisplay();
    });

    // ============================================================
    // 键盘回车触发查询
    // ============================================================
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        queryHistory();
      }
    });
  </script>
</body>
</html>
