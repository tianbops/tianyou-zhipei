<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>管理中心</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
    .admin-card { background: #1C2530; border-radius: 16px; padding: 20px 16px; text-align: center; cursor: pointer; transition: transform 0.15s; border: none; color: #FFFFFF; font-family: inherit; position: relative; }
    .admin-card:active { transform: scale(0.96); }
    .admin-card .icon { font-size: 32px; margin-bottom: 8px; }
    .admin-card .title { font-size: 15px; font-weight: 500; }
    .admin-card .desc { font-size: 12px; color: #7F8B98; margin-top: 4px; }
    .admin-card .badge { position: absolute; top: 8px; right: 8px; background: #FFB020; color: #000; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
    .full-width { grid-column: 1 / -1; }
    .admin-dialog { display: none; position: fixed; left: 0; right: 0; top: 0; bottom: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; z-index: 999; }
    .admin-dialog.active { display: flex; }
    .admin-dialog-box { width: 90%; max-width: 400px; max-height: 80vh; background: #18212B; border-radius: 20px; padding: 24px 20px; overflow-y: auto; }
    .admin-dialog-box h3 { text-align: center; margin-bottom: 18px; font-size: 20px; }
    .admin-dialog-box input, .admin-dialog-box select, .admin-dialog-box textarea { width: 100%; height: 48px; background: #05070A; border: none; border-radius: 14px; padding: 0 16px; color: #fff; font-size: 16px; margin-bottom: 14px; text-align: center; }
    .admin-dialog-box textarea { height: 80px; padding: 12px 16px; resize: vertical; text-align: left; }
    .admin-dialog-box input::placeholder, .admin-dialog-box textarea::placeholder { color: #7F8B98; }
    .admin-password-box { position: relative; }
    .admin-password-box input { padding-right: 50px; padding-left: 16px; text-align: center; }
    .admin-eye-btn {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      border: none; background: none; color: #7F8B98; font-size: 18px; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center;
    }
    .admin-eye-btn:hover { color: #fff; }
    .admin-dialog-btn { display: flex; gap: 14px; margin-top: 6px; }
    .admin-dialog-btn button { flex: 1; height: 46px; border-radius: 14px; font-size: 16px; cursor: pointer; }
    .admin-dialog-btn .btn-primary { background: #2457A6; color: #fff; border: none; }
    .admin-dialog-btn .btn-secondary { background: #303A46; color: #fff; border: none; }
    .admin-dialog-btn .btn-danger { background: #C0392B; color: #fff; border: none; }
    .admin-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .admin-list-item:last-child { border-bottom: none; }
    .admin-list-item .info { flex: 1; }
    .admin-list-item .info .name { font-size: 15px; font-weight: 500; }
    .admin-list-item .info .sub { font-size: 12px; color: #7F8B98; }
    .admin-list-item .actions { display: flex; gap: 8px; }
    .admin-list-item .actions button { padding: 4px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; border: none; }
    .admin-list-item .actions .edit-btn { background: #2457A6; color: #fff; }
    .admin-list-item .actions .del-btn { background: #C0392B; color: #fff; }
    .admin-list-item .status-badge { padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; }
    .admin-list-item .status-badge.active { background: #27AE60; color: #fff; }
    .admin-list-item .status-badge.inactive { background: #7F8B98; color: #fff; }
    .admin-empty { text-align: center; padding: 30px; color: #7F8B98; }
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .admin-tabs button { padding: 6px 16px; border-radius: 12px; border: none; background: #303A46; color: #7F8B98; font-size: 14px; cursor: pointer; }
    .admin-tabs button.active { background: #2457A6; color: #fff; }
    .admin-search { display: flex; gap: 10px; margin-bottom: 16px; }
    .admin-search input { flex: 1; height: 42px; background: #05070A; border: none; border-radius: 12px; padding: 0 16px; color: #fff; font-size: 14px; text-align: center; }
    .admin-search button { height: 42px; padding: 0 18px; border-radius: 12px; border: none; background: #2457A6; color: #fff; cursor: pointer; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #18212B; color: #fff; padding: 12px 24px; border-radius: 12px; z-index: 9999; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: none; font-size: 14px; max-width: 90%; text-align: center; }
    .toast.show { display: block; }
    .toast.success { border-left: 4px solid #27AE60; }
    .toast.error { border-left: 4px solid #C0392B; }
    .toast.warning { border-left: 4px solid #FFB020; }
    .role-badge { padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; }
    .role-badge.admin { background: #E74C3C; color: #fff; }
    .role-badge.driver { background: #3498DB; color: #fff; }
    .role-badge.delivery { background: #2ECC71; color: #fff; }

    /* 数字输入框提示 */
    .input-hint {
      color: #7F8B98;
      font-size: 12px;
      text-align: center;
      margin-top: -6px;
      margin-bottom: 10px;
    }

    /* ===== 状态选择 - 左右方块 ===== */
    .status-toggle {
      display: flex;
      border-radius: 14px;
      overflow: hidden;
      background: #05070A;
      border: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 14px;
    }
    .status-toggle .status-option {
      flex: 1;
      padding: 12px 0;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      color: #7F8B98;
      background: transparent;
      border: none;
      font-family: inherit;
    }
    .status-toggle .status-option.active {
      background: #2457A6;
      color: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(36,87,166,0.3);
    }
    .status-toggle .status-option:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="page-container">
    <header class="top-bar">
      <button class="back-btn" onclick="history.back()">‹</button>
      <span class="page-title">管理中心</span>
      <div style="width:40px;"></div>
    </header>

    <section class="card" style="margin-bottom:16px;">
      <div style="display:flex; justify-content:space-around; text-align:center;">
        <div><div style="font-size:24px; font-weight:bold; color:#2457A6;" id="statUsers">0</div><div style="color:#7F8B98; font-size:12px;">用户</div></div>
        <div><div style="font-size:24px; font-weight:bold; color:#27AE60;" id="statVehicles">0</div><div style="color:#7F8B98; font-size:12px;">车辆</div></div>
        <div><div style="font-size:24px; font-weight:bold; color:#FFB020;" id="statStores">0</div><div style="color:#7F8B98; font-size:12px;">门店</div></div>
        <div><div style="font-size:24px; font-weight:bold; color:#E74C3C;" id="statLogs">0</div><div style="color:#7F8B98; font-size:12px;">日志</div></div>
      </div>
    </section>

    <div class="admin-grid">
      <button class="admin-card" onclick="openUserManagement()">
        <div class="icon">👤</div><div class="title">用户管理</div><div class="desc">添加/编辑/删除</div><div class="badge" id="userBadge">0</div>
      </button>
      <button class="admin-card" onclick="openVehicleManagement()">
        <div class="icon">🚚</div><div class="title">车辆管理</div><div class="desc">启用/停用/配置</div><div class="badge" id="vehicleBadge">0</div>
      </button>
      <button class="admin-card" onclick="openRouteSelectDialog()">
        <div class="icon">🏪</div><div class="title">原始数据</div><div class="desc">客户数据维护</div>
      </button>
      <button class="admin-card" onclick="openOCRManagement()">
        <div class="icon">🔍</div><div class="title">OCR优化</div><div class="desc">错误反馈学习</div><div class="badge" id="ocrBadge">0</div>
      </button>
      <button class="admin-card" onclick="openBackupManagement()">
        <div class="icon">💾</div><div class="title">数据备份</div><div class="desc">导出/导入</div>
      </button>
      <button class="admin-card" onclick="openLogManagement()">
        <div class="icon">📝</div><div class="title">修改日志</div><div class="desc">操作记录</div><div class="badge" id="logBadge">0</div>
      </button>
      <button class="admin-card full-width" onclick="logout()" style="background:#2C1A1A;">
        <div class="icon">🚪</div><div class="title">退出登录</div><div class="desc">返回登录页面</div>
      </button>
    </div>
  </div>

  <!-- ===== 选择线路弹窗 ===== -->
  <div class="admin-dialog" id="routeSelectDialog">
    <div class="admin-dialog-box">
      <h3>📋 输入要维护的线路</h3>
      <div style="color:#7F8B98; font-size:14px; text-align:center; margin-bottom:16px;">
        请输入线路编号，自动显示为 XX号线
      </div>
      <div class="input-box">
        <input id="routeSelectInput" type="number" placeholder="请输入线路编号 (如 17)" min="1" step="1">
        <div class="input-hint">💡 输入数字，自动显示为 XX号线</div>
      </div>
      <div class="admin-dialog-btn">
        <button class="btn-secondary" onclick="closeDialog('routeSelectDialog')">取消</button>
        <button class="btn-primary" onclick="confirmRouteSelect()">确认</button>
      </div>
    </div>
  </div>

  <!-- ===== 用户管理弹窗 ===== -->
  <div class="admin-dialog" id="userDialog">
    <div class="admin-dialog-box">
      <h3>👤 用户管理</h3>
      <div class="admin-search">
        <input id="userSearch" placeholder="搜索用户..." oninput="filterUsers()">
        <button onclick="showAddUserForm()">+ 添加</button>
      </div>
      <div id="userList"></div>
      <div class="admin-dialog-btn">
        <button class="btn-secondary" onclick="closeDialog('userDialog')">关闭</button>
      </div>
    </div>
  </div>

  <!-- ===== 添加用户弹窗 ===== -->
  <div class="admin-dialog" id="userFormDialog">
    <div class="admin-dialog-box">
      <h3 id="userFormTitle">添加用户</h3>
      <div class="input-box">
        <input id="userFormName" placeholder="用户名称 (可选，不填显示未命名)">
      </div>
      <div class="input-box">
        <input id="userFormRoute" type="number" placeholder="请输入线路编号 (如 17)" min="1" step="1">
        <div class="input-hint">💡 输入数字，自动显示为 XX号线</div>
      </div>
      <select id="userFormRole">
        <option value="driver">司机</option>
        <option value="delivery">配送</option>
      </select>
      <div class="admin-dialog-btn">
        <button class="btn-secondary" onclick="closeDialog('userFormDialog')">取消</button>
        <button class="btn-primary" onclick="saveUser()">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== 编辑普通用户弹窗 ===== -->
  <div class="admin-dialog" id="userEditDialog">
    <div class="admin-dialog-box">
      <h3 id="userEditTitle">编辑用户</h3>
      <div class="input-box">
        <input id="userEditName" placeholder="用户名称">
      </div>
      <div class="input-box">
        <input id="userEditRoute" type="number" placeholder="请输入线路编号 (如 17)" min="1" step="1">
        <div class="input-hint">💡 输入数字，自动显示为 XX号线</div>
      </div>
      <select id="userEditRole">
        <option value="driver">司机</option>
        <option value="delivery">配送</option>
      </select>
      <div class="admin-dialog-btn">
        <button class="btn-secondary" onclick="closeDialog('userEditDialog')">取消</button>
        <button class="btn-primary" onclick="saveUserEdit()">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== 编辑管理员弹窗 ===== -->
  <div class="admin-dialog" id="adminEditDialog">
    <div class="admin-dialog-box">
      <h3 id="adminEditTitle">修改管理员名称</h3>
      <div class="input-box">
        <input id="adminEditName" placeholder="修改管理员名称">
      </div>
      <div class="admin-password-box">
        <input id="adminEditPassword" type="password" placeholder="修改管理员密码">
        <button type="button" class="admin-eye-btn" onclick="toggleAdminEditPassword()">👁</button>
      </div>
      <div class="admin-password-box">
        <input id="adminEditUnifiedPassword" type="password" placeholder="修改企业统一密码">
        <button type="button" class="admin-eye-btn" onclick="toggleAdminEditUnifiedPassword()">👁</button>
      </div>
      <div class="admin-dialog-btn">
        <button class="btn-secondary" onclick="closeDialog('adminEditDialog')">取消</button>
        <button class="btn-primary" onclick="saveAdminEdit()">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== 车辆管理弹窗 ===== -->
  <div class="admin-dialog" id="vehicleDialog">
    <div class="admin-dialog-box">
      <h3>🚚 车辆管理</h3>
      <div class="admin-search">
        <input id="vehicleSearch" placeholder="搜索车辆..." oninput="filterVehicles()">
        <button onclick="showAddVehicleForm()">+ 添加</button>
      </div>
      <div id="vehicleList"></div>
      <div class="admin-dialog-btn">
        <button class="btn-secondary" onclick="closeDialog('vehicleDialog')">关闭</button>
      </div>
    </div>
  </div>

  <!-- ===== 添加车辆弹窗（含线路验证） ===== -->
  <div class="admin-dialog" id="vehicleFormDialog">
    <div class="admin-dialog-box">
      <h3 id="vehicleFormTitle">添加车辆</h3>
      <div class="input-box">
        <input id="vehicleFormPlate" placeholder="车牌号 (如 渝DK7692)">
      </div>
      <div class="input-box">
        <input id="vehicleFormRoute" type="number" placeholder="请输入线路编号 (如 17)" min="1" step="1">
        <div class="input-hint">💡 输入数字，自动显示为 XX号线</div>
      </div>
      <!-- 状态选择 - 左右方块 -->
      <div class="status-toggle">
        <button class="status-option" id="vehicleStatusInactive" onclick="setVehicleStatus('inactive')">停用</button>
        <button class="status-option active" id="vehicleStatusActive" onclick="setVehicleStatus('active')">启用</button>
      </div>
      <div class="admin-dialog-btn">
        <button class="btn-secondary" onclick="closeDialog('vehicleFormDialog')">取消</button>
        <button class="btn-primary" onclick="saveVehicle()">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== 编辑车辆弹窗（无线路） ===== -->
  <div class="admin-dialog" id="vehicleEditDialog">
    <div class="admin-dialog-box">
      <h3 id="vehicleEditTitle">编辑车辆</h3>
      <div class="input-box">
        <input id="vehicleEditPlate" placeholder="车牌号 (如 渝DK7692)">
      </div>
      <!-- 状态选择 - 左右方块 -->
      <div class="status-toggle">
        <button class="status-option" id="vehicleEditStatusInactive" onclick="setVehicleEditStatus('inactive')">停用</button>
        <button class="status-option active" id="vehicleEditStatusActive" onclick="setVehicleEditStatus('active')">启用</button>
      </div>
      <div class="admin-dialog-btn">
        <button class="btn-secondary" onclick="closeDialog('vehicleEditDialog')">取消</button>
        <button class="btn-primary" onclick="saveVehicleEdit()">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== OCR优化弹窗 ===== -->
  <div class="admin-dialog" id="ocrDialog">
    <div class="admin-dialog-box">
      <h3>🔍 OCR优化</h3>
      <div class="admin-tabs">
        <button class="active" onclick="switchOCRtab('pending')">待处理 <span id="ocrPendingCount">0</span></button>
        <button onclick="switchOCRtab('resolved')">已解决 <span id="ocrResolvedCount">0</span></button>
      </div>
      <div id="ocrList"></div>
      <div class="admin-dialog-btn">
        <button class="btn-secondary" onclick="closeDialog('ocrDialog')">关闭</button>
        <button class="btn-primary" onclick="exportOCRData()">导出反馈</button>
      </div>
    </div>
  </div>

  <!-- ===== OCR详情弹窗 ===== -->
  <div class="admin-dialog" id="ocrDetailDialog">
    <div class="admin-dialog-box">
      <h3>📋 反馈详情</h3>
      <div id="ocrDetailContent"></div>
      <div class="admin-dialog-btn">
        <button class="btn-secondary" onclick="closeDialog('ocrDetailDialog')">关闭</button>
        <button class="btn-primary" onclick="resolveOCR()">标记已解决</button>
      </div>
    </div>
  </div>

  <!-- ===== 备份管理弹窗 ===== -->
  <div class="admin-dialog" id="backupDialog">
    <div class="admin-dialog-box">
      <h3>💾 数据备份</h3>
      <div id="backupList"></div>
      <div class="admin-dialog-btn" style="flex-wrap:wrap;">
        <button class="btn-primary" onclick="createBackup()" style="flex:1;">创建备份</button>
        <button class="btn-secondary" onclick="exportAllData()" style="flex:1;">导出数据</button>
        <button class="btn-secondary" onclick="document.getElementById('importFile').click()" style="flex:1;">导入数据</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        <button class="btn-secondary" onclick="closeDialog('backupDialog')" style="flex:1;">关闭</button>
      </div>
    </div>
  </div>

  <!-- ===== 日志管理弹窗 ===== -->
  <div class="admin-dialog" id="logDialog">
    <div class="admin-dialog-box">
      <h3>📝 修改日志</h3>
      <div class="admin-search">
        <input id="logSearch" placeholder="搜索日志..." oninput="filterLogs()">
        <button onclick="clearLogs()">清空</button>
      </div>
      <div id="logList"></div>
      <div class="admin-dialog-btn">
        <button class="btn-secondary" onclick="closeDialog('logDialog')">关闭</button>
        <button class="btn-primary" onclick="exportLogs()">导出日志</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/auth.js"></script>
  <script>
    // ============================================================
    // 页面初始化
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      if (!Auth.checkAuth()) return;
      initDefaultData();
    });

    // ============================================================
    // 数据库操作
    // ============================================================
    const DB = {
      get(key, defaultVal) { 
        try { 
          const data = localStorage.getItem(`admin_${key}`); 
          return data ? JSON.parse(data) : defaultVal; 
        } catch { return defaultVal; } 
      },
      set(key, val) { 
        localStorage.setItem(`admin_${key}`, JSON.stringify(val)); 
        updateStats(); 
      },
      addLog(action, detail) {
        const logs = this.get('logs', []);
        logs.unshift({ 
          id: Date.now(), 
          time: new Date().toLocaleString(), 
          action, 
          detail, 
          user: Auth.getCurrentRoute() 
        });
        if (logs.length > 100) logs.length = 100;
        this.set('logs', logs);
      }
    };

    // ============================================================
    // 初始化默认数据
    // ============================================================
    function initDefaultData() {
      if (!localStorage.getItem('admin_users')) {
        DB.set('users', [
          { id: 1, name: '管理员', route: 'all', password: 'admin123', role: 'admin' },
          { id: 2, name: '', route: '17号线', password: 'tianyou2024', role: 'driver' },
          { id: 3, name: '', route: '17号线', password: 'tianyou2024', role: 'delivery' }
        ]);
      }
      if (!localStorage.getItem('admin_vehicles')) {
        DB.set('vehicles', [{ id: 1, plate: '渝DK7692', route: '17号线', status: 'active' }]);
      }
      if (!localStorage.getItem('admin_ocr')) {
        DB.set('ocr', [{ 
          id: 1, 
          image: '运单_001.jpg', 
          error: '门店名称识别错误', 
          correct: '江北胡汪洋经销商', 
          status: 'pending', 
          time: new Date().toLocaleString() 
        }]);
      }
      if (!localStorage.getItem('admin_backups')) {
        DB.set('backups', []);
      }
      if (!localStorage.getItem('admin_logs') || DB.get('logs', []).length === 0) {
        DB.set('logs', [{ 
          id: 1, 
          time: new Date().toLocaleString(), 
          action: '系统初始化', 
          detail: '管理中心已启动', 
          user: 'system' 
        }]);
      }
      updateStats();
    }

    // ============================================================
    // 更新统计
    // ============================================================
    function updateStats() {
      const users = DB.get('users', []);
      const vehicles = DB.get('vehicles', []);
      const logs = DB.get('logs', []);
      const stores = JSON.parse(localStorage.getItem('base_data') || '[]');
      
      document.getElementById('statUsers').textContent = users.length;
      document.getElementById('statVehicles').textContent = vehicles.filter(v => v.status === 'active').length;
      document.getElementById('statStores').textContent = stores.length;
      document.getElementById('statLogs').textContent = logs.length;
      document.getElementById('userBadge').textContent = users.length;
      document.getElementById('vehicleBadge').textContent = vehicles.filter(v => v.status === 'active').length;
      
      const ocr = DB.get('ocr', []);
      document.getElementById('ocrBadge').textContent = ocr.filter(o => o.status === 'pending').length;
      document.getElementById('logBadge').textContent = logs.length;
    }

    // ============================================================
    // 通用弹窗控制
    // ============================================================
    function openDialog(id) { document.getElementById(id).classList.add('active'); }
    function closeDialog(id) { document.getElementById(id).classList.remove('active'); }
    
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show ' + type;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ============================================================
    // 线路格式转换 - 数字转线路
    // ============================================================
    function formatRouteCode(input) {
      if (!input) return '';
      const num = parseInt(input.trim());
      if (isNaN(num) || num < 1) return '';
      return String(num).padStart(2, '0') + '号线';
    }

    // ============================================================
    // 验证线路是否已注册（在用户管理中）
    // ============================================================
    function isRouteRegistered(route) {
      const users = DB.get('users', []);
      return users.some(u => u.route === route && u.role !== 'admin');
    }

    function confirmRouteSelect() {
      const rawInput = document.getElementById('routeSelectInput').value.trim();
      
      if (!rawInput) {
        showToast('请输入线路编号', 'error');
        return;
      }
      
      const route = formatRouteCode(rawInput);
      if (!route) {
        showToast('请输入有效数字 (如 1, 17, 105)', 'error');
        return;
      }
      
      // 检查线路是否存在
      if (!isRouteRegistered(route)) {
        showToast('该线路未开通', 'error');
        return;
      }
      
      closeDialog('routeSelectDialog');
      window.location.href = `pages/route_edit.html?route=${encodeURIComponent(route)}&from=admin`;
    }

    let currentUserEditId = null;

    function renderUsers(filter = '') {
      let users = DB.get('users', []);
      users.sort((a, b) => {
        if (a.role === 'admin' && b.role !== 'admin') return -1;
        if (a.role !== 'admin' && b.role === 'admin') return 1;
        return a.id - b.id;
      });
      
      if (filter) {
        users = users.filter(u => u.name.includes(filter) || u.route.includes(filter) || u.role.includes(filter));
      }
      
      const container = document.getElementById('userList');
      if (!users.length) { container.innerHTML = '<div class="admin-empty">暂无用户</div>'; return; }
      
      const roleMap = { admin: '管理员', driver: '司机', delivery: '配送' };
      const roleClass = { admin: 'admin', driver: 'driver', delivery: 'delivery' };
      
      container.innerHTML = users.map(u => {
        const isAdmin = u.role === 'admin';
        const deleteBtn = isAdmin ? '' : `<button class="del-btn" onclick="deleteUser(${u.id})">删除</button>`;
        
        return `
          <div class="admin-list-item">
            <div class="info">
              <div class="name">${u.name || '(未命名)'}</div>
              <div class="sub">${u.route} · <span class="role-badge ${roleClass[u.role] || 'driver'}">${roleMap[u.role] || '司机'}</span></div>
            </div>
            <div class="actions">
              <button class="edit-btn" onclick="editUser(${u.id})">编辑</button>
              ${deleteBtn}
            </div>
          </div>
        `;
      }).join('');
    }

    function editUser(id) {
      const users = DB.get('users', []);
      const user = users.find(u => u.id === id);
      if (!user) return;
      
      currentUserEditId = id;
      
      if (user.role === 'admin') {
        document.getElementById('adminEditTitle').textContent = '修改管理员名称';
        document.getElementById('adminEditName').value = user.name || '';
        document.getElementById('adminEditName').placeholder = '修改管理员名称';
        document.getElementById('adminEditPassword').value = '';

        const routeNum = user.route.replace('号线', '');
        document.getElementById('userEditRoute').value = routeNum;
        document.getElementById('userEditRole').value = user.role || 'driver';

    function saveUser() {
      const rawName = document.getElementById('userFormName').value.trim();
      const rawRoute = document.getElementById('userFormRoute').value.trim();
      const role = document.getElementById('userFormRole').value;
      
      if (!rawRoute) { showToast('请填写线路编号', 'error'); return; }
      
      const route = formatRouteCode(rawRoute);
      if (!route) { showToast('请输入有效数字 (如 1, 17, 105)', 'error'); return; }
      
      let users = DB.get('users', []);
      const exists = users.some(u => u.route === route && u.id !== currentUserEditId);
      if (exists) { showToast('该线路已存在用户', 'error'); return; }
      
      const maxId = users.reduce((max, u) => Math.max(max, u.id || 0), 0);
      const name = rawName || '';
      
      users.push({ 
        id: maxId + 1, 
        name: name, 
        route: route, 
        password: 'tianyou2024',
        role: role,
        createdAt: new Date().toISOString()
      });

      const unifiedPassword = document.getElementById('adminEditUnifiedPassword').value.trim();

    function saveVehicle() {
      const plate = document.getElementById('vehicleFormPlate').value.trim();
      const rawRoute = document.getElementById('vehicleFormRoute').value.trim();
      const status = currentVehicleStatus;
      
      if (!plate) { showToast('请输入车牌号', 'error'); return; }
      if (!rawRoute) { showToast('请输入线路编号', 'error'); return; }
      
      const route = formatRouteCode(rawRoute);
      if (!route) { showToast('请输入有效数字 (如 1, 17, 105)', 'error'); return; }
      
      // ===== 验证线路是否已注册 =====
      if (!isRouteRegistered(route)) {
        showToast('❌ 该线路未开通', 'error');
        return;
      }
      
      let vehicles = DB.get('vehicles', []);
      const exists = vehicles.some(v => v.plate === plate);
      if (exists) { showToast('该车牌已存在', 'error'); return; }
      
      const maxId = vehicles.reduce((max, v) => Math.max(max, v.id), 0);
      vehicles.push({ id: maxId + 1, plate, route, status });

      currentVehicleStatus = v.status || 'active';

      const inactiveBtn = document.getElementById('vehicleEditStatusInactive');

        inactiveBtn.classList.remove('active');

        inactiveBtn.classList.add('active');
        activeBtn.classList.remove('active');
      }
      
      openDialog('vehicleEditDialog');

    function saveVehicleEdit() {
      const plate = document.getElementById('vehicleEditPlate').value.trim();
      const status = currentVehicleStatus;
      
      if (!plate) { showToast('请输入车牌号', 'error'); return; }
      
      let vehicles = DB.get('vehicles', []);
      const idx = vehicles.findIndex(v => v.id === currentVehicleEditId);
      if (idx === -1) { showToast('车辆不存在', 'error'); return; }
      
      // 检查车牌是否与其他车辆重复（排除自己）
      const exists = vehicles.some(v => v.plate === plate && v.id !== currentVehicleEditId);
      if (exists) { showToast('该车牌已存在', 'error'); return; }
      
      // 只更新车牌和状态，线路保持不变
      vehicles[idx].plate = plate;
      vehicles[idx].status = status;
      
      DB.set('vehicles', vehicles);
      DB.addLog('车辆编辑', `编辑车辆: ${plate}`);
      showToast('车辆已更新');
      closeDialog('vehicleEditDialog');
      renderVehicles();
    }

      if (!confirm('确定删除该车辆吗？')) return;
      let vehicles = DB.get('vehicles', []);
      const v = vehicles.find(v => v.id === id);
      vehicles = vehicles.filter(v => v.id !== id);
      DB.set('vehicles', vehicles);
      DB.addLog('车辆删除', `删除车辆: ${v?.plate || id}`);
      showToast('车辆已删除', 'warning');
      renderVehicles();
    }

    let currentOCRId = null, ocrFilter = 'pending';

    function openOCRManagement() { openDialog('ocrDialog'); renderOCR(); }

    function switchOCRtab(tab) {
      ocrFilter = tab;
      document.querySelectorAll('.admin-tabs button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderOCR();
    }

    function renderOCR() {
      let ocrs = DB.get('ocr', []);
      let filtered = ocrs.filter(o => o.status === ocrFilter);
      document.getElementById('ocrPendingCount').textContent = ocrs.filter(o => o.status === 'pending').length;
      document.getElementById('ocrResolvedCount').textContent = ocrs.filter(o => o.status === 'resolved').length;
      const container = document.getElementById('ocrList');
      if (!filtered.length) { container.innerHTML = '<div class="admin-empty">暂无反馈记录</div>'; return; }
      container.innerHTML = filtered.map(o => `
        <div class="admin-list-item" onclick="viewOCRDetail(${o.id})" style="cursor:pointer;">
          <div class="info"><div class="name">${o.image}</div><div class="sub">${o.error} → ${o.correct}</div></div>
          <div style="font-size:12px;color:#7F8B98;">${o.time}</div>
        </div>
      `).join('');
    }

    function viewOCRDetail(id) {
      const ocrs = DB.get('ocr', []);
      const ocr = ocrs.find(o => o.id === id);
      if (!ocr) return;
      currentOCRId = id;
      document.getElementById('ocrDetailContent').innerHTML = `
        <div style="background:#05070A;padding:16px;border-radius:12px;margin-bottom:12px;">
          <div><strong>图片：</strong>${ocr.image}</div>
          <div><strong>错误识别：</strong><span style="color:#E74C3C;">${ocr.error}</span></div>
          <div><strong>正确值：</strong><span style="color:#27AE60;">${ocr.correct}</span></div>
          <div><strong>状态：</strong>${ocr.status === 'pending' ? '⏳ 待处理' : '✅ 已解决'}</div>
          <div><strong>时间：</strong>${ocr.time}</div>
        </div>
      `;
      openDialog('ocrDetailDialog');
    }

    function resolveOCR() {
      if (!currentOCRId || !confirm('标记该反馈为已解决？')) return;
      let ocrs = DB.get('ocr', []);
      const idx = ocrs.findIndex(o => o.id === currentOCRId);
      if (idx !== -1) { ocrs[idx].status = 'resolved'; DB.set('ocr', ocrs); DB.addLog('OCR处理', '解决OCR反馈'); showToast('已标记为已解决'); closeDialog('ocrDetailDialog'); renderOCR(); }
    }

    function openBackupManagement() { openDialog('backupDialog'); renderBackups(); }

    function renderBackups() {
      const backups = DB.get('backups', []);
      const container = document.getElementById('backupList');
      if (!backups.length) { container.innerHTML = '<div class="admin-empty">暂无备份</div>'; return; }
      container.innerHTML = backups.map(b => `

      `).join('');

    function createBackup() {
      const data = { users: DB.get('users', []), vehicles: DB.get('vehicles', []), ocr: DB.get('ocr', []), stores: JSON.parse(localStorage.getItem('base_data') || '[]') };
      const size = (JSON.stringify(data).length / 1024).toFixed(1) + 'KB';
      const backups = DB.get('backups', []);
      backups.unshift({ id: Date.now(), name: `备份_${new Date().toISOString().split('T')[0]}`, time: new Date().toLocaleString(), size, data });
      if (backups.length > 20) backups.length = 20;
      DB.set('backups', backups);
      DB.addLog('备份创建', '创建数据备份');
      showToast('备份创建成功');
      renderBackups();
    }

    function restoreBackup(id) {
      if (!confirm('恢复备份将覆盖当前数据，确定继续？')) return;
      const backups = DB.get('backups', []);
      const backup = backups.find(b => b.id === id);
      if (!backup?.data) { showToast('备份数据无效', 'error'); return; }
      DB.set('users', backup.data.users || []);
      DB.set('vehicles', backup.data.vehicles || []);
      DB.set('ocr', backup.data.ocr || []);
      if (backup.data.stores) localStorage.setItem('base_data', JSON.stringify(backup.data.stores));
      DB.addLog('备份恢复', `恢复备份: ${backup.name}`);
      showToast('备份恢复成功');
      updateStats();
    }

    function deleteBackup(id) {
      if (!confirm('确定删除该备份？')) return;
      let backups = DB.get('backups', []);
      backups = backups.filter(b => b.id !== id);
      DB.set('backups', backups);
      showToast('备份已删除', 'warning');
      renderBackups();
    }

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });

      showToast('数据导出成功');
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data.users) DB.set('users', data.users);
          if (data.vehicles) DB.set('vehicles', data.vehicles);
          if (data.ocr) DB.set('ocr', data.ocr);
          if (data.stores) localStorage.setItem('base_data', JSON.stringify(data.stores));
          if (data.logs) DB.set('logs', data.logs);
          DB.addLog('数据导入', '导入数据备份');
          showToast('数据导入成功');
          updateStats();
          renderBackups();
        } catch (err) { showToast('导入失败: ' + err.message, 'error'); }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

      const logs = DB.get('logs', []);
      if (!logs.length) { showToast('暂无日志', 'warning'); return; }
      const blob = new Blob([JSON.stringify(logs, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `logs_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('日志导出成功');
    }
